/* ===== app\sterne.js ===== */
/**
 * Kartengrafik: aus einer Karte wird ein Sternbild-Zeichen.
 *
 * Grundgedanke: eine Zahlenkarte zeigt einen Stern mit genau `wert` Zacken.
 * Ein Pfeil wächst dadurch sichtbar um eine Zacke pro Karte, ein Kreuz zeigt
 * viermal dieselbe Form. Die Farbe gibt nur den groben Bereich an — drei feste
 * Töne aus den Marken, kein Verlauf: 1–4 kalt, 5–8 warm, 9–12 heiß.
 *
 * Alle Maße stammen jetzt aus `Design_Referenz.html`, Abschnitt „Die Karten".
 * Bildfeld ist `viewBox="0 0 78 88"` mit Sternmitte (39 | 44) und Außenradius
 * 26; die Karte darum ist 78 × 109, das Bild darin rund 56 × 62.
 *
 * Die Ziffer steckt NICHT im Bild. Die Referenz setzt sie als eigenes Element
 * unter das Bild (`<span class="zahl">`, bei uns `.karte-wert`) — das SVG zeigt
 * nur das Motiv. Deshalb gibt es hier keinen <text>-Knoten und kein
 * `data-zahl-im-bild` mehr.
 *
 * Leitidee der Referenz: „Papier auf der Nacht." Die Sterne sind gedruckt,
 * nicht beleuchtet — reine Flächen mit `opacity=".85"`, keine Kontur, kein
 * Verlauf, kein Schein. Darum braucht diese Datei auch kein Verlaufsblatt mehr.
 *
 * Reines SVG über createElementNS, kein innerHTML, kein Zufall: dieselbe Karte
 * sieht immer gleich aus.
 *
 * Keine Spiellogik. Wird von ansicht.js in `.karte` eingehängt (DOM-Vertrag-2,
 * Abschnitt „Kartengrafik").
 */

const NS_SVG = 'http://www.w3.org/2000/svg';

/** Bildfeld exakt wie die Referenz: viewBox 78 × 88. */
const BILD_B = 78;
const BILD_H = 88;

/** Mittelpunkt und Außenradius des Sterns, exakt wie in der Referenz. */
const MITTE_X = 39;
const MITTE_Y = 44;
const R_AUSSEN = 26;

/**
 * Deckkraft der Sternflächen. Die Referenz malt jede Zackenfläche mit
 * `opacity=".85"` — durchscheinend genug, dass das Papier trägt, aber kräftig
 * genug zum Zählen. Die Ausnahmen 1 und 2 stehen in der Referenz ohne
 * Deckkraftangabe, also voll deckend; das bleibt so.
 */
const DECKUNG = 0.85;

/**
 * Die drei Sternfarben aus den Marken (design-tokens.css). Keine Zwischentöne:
 * die Farbe sagt nur, in welchem Drittel der Wert liegt — gezählt wird an den
 * Zacken.
 */
const STERN_KALT  = '#6E9BD1';   /* Werte 1–4  */
const STERN_WARM  = '#D9A02B';   /* Werte 5–8  */
const STERN_HEISS = '#C0463A';   /* Werte 9–12 */

/** Weitere erlaubte Farben auf der Karte. Mehr gibt es nicht. */
const TINTE = '#1B2233';

function farbeFuer(wert) {
  if (wert <= 4) return STERN_KALT;
  if (wert <= 8) return STERN_WARM;
  return STERN_HEISS;
}

/* ---------------- kleine Helfer ---------------- */

/** Ein SVG-Element mit Attributen. */
function svgKnoten(tag, attr) {
  const e = document.createElementNS(NS_SVG, tag);
  if (attr) for (const k in attr) e.setAttribute(k, String(attr[k]));
  return e;
}

/** Ein HTML-Element mit Klasse und Text (eigene Fassung, ohne ansicht.js). */
function htmlKnoten(tag, klasse, text) {
  const e = document.createElement(tag);
  if (klasse) e.className = klasse;
  if (text != null) e.textContent = text;
  return e;
}

/** Zwei Nachkommastellen, damit die Pfade kurz bleiben. */
function rund(n) {
  return Math.round(n * 100) / 100;
}

/**
 * Innenradius (Kerben) zum Außenradius — Antons Formel, unverändert:
 * wenige Zacken dürfen spitz sein, viele brauchen einen dickeren Kern,
 * sonst werden sie zu Nadeln. Ab 13 Zacken deckelt 0.72.
 *
 * Gegenprobe an der Referenz (Mitte 39|44, R 26), jeweils die erste Kerbe:
 * Wert 4 → 46.6,36.4 · Wert 7 → 44.9,31.8 · Wert 12 → 43.7,26.5. Stimmt.
 */
function innenRadius(zacken, R) {
  return R * Math.min(0.38 + (zacken - 3) * 0.035, 0.72);
}

/* ---------------- Sternpfad ---------------- */

/**
 * Pfad eines Zackensterns um den Nullpunkt: 2n Punkte, Start bei -90°,
 * Schrittweite 180°/n, abwechselnd Außen- und Innenradius. Genau die Form,
 * die die Referenz als <polygon> ausschreibt.
 * @param {number} zacken   Anzahl der Spitzen (mindestens 3)
 * @param {number} r1       Außenradius (Spitzen)
 * @param {number} r2       Innenradius (Kerben)
 * @param {number} [drehung] Drehung in Grad, 0 = eine Spitze zeigt nach oben
 * @returns {string} Pfad-String „M … Z"
 */
function sternPfad(zacken, r1, r2, drehung) {
  const n = Math.max(3, Math.round(zacken));
  const start = (-90 + (drehung || 0)) * Math.PI / 180;
  const schritt = Math.PI / n;
  let d = '';
  for (let i = 0; i < 2 * n; i++) {
    const r = (i % 2 === 0) ? r1 : r2;
    const a = start + i * schritt;
    d += (i === 0 ? 'M' : 'L') + rund(Math.cos(a) * r) + ' ' + rund(Math.sin(a) * r);
  }
  return d + 'Z';
}

/* ---------------- Zahlenkarten ---------------- */

/**
 * Wert 1: gefüllter Lichtpunkt mit Ring — mit einer Zacke lässt sich kein
 * Stern zeichnen. Zeichengenau aus der Referenz:
 * `<circle cx="39" cy="44" r="8">` gefüllt und `r="18"` als Ring der Stärke 1.
 */
function bildEins(g) {
  const farbe = farbeFuer(1);
  g.appendChild(svgKnoten('circle', {
    cx: MITTE_X, cy: MITTE_Y, r: 8, fill: farbe,
  }));
  g.appendChild(svgKnoten('circle', {
    cx: MITTE_X, cy: MITTE_Y, r: 18,
    fill: 'none', stroke: farbe, 'stroke-width': 1,
  }));
}

/**
 * Wert 2: schmales senkrechtes Doppelglühen, zeichengenau aus der Referenz:
 * `M39 18 Q46 44 39 70 Q32 44 39 18 Z`. Die Linse reicht von -R bis +R und
 * ist 7 breit, also gut ein Viertel des Radius.
 */
function bildZwei(g) {
  g.appendChild(svgKnoten('path', {
    d: 'M39 18 Q46 44 39 70 Q32 44 39 18 Z',
    fill: farbeFuer(2),
  }));
}

/**
 * Werte 3–12: Zackenstern mit genau `wert` Spitzen, eine Spitze nach oben.
 * Reine Fläche mit Deckkraft 0.85 — keine Kontur, so malt die Referenz.
 */
function bildZacken(g, wert) {
  g.appendChild(svgKnoten('path', {
    d: sternPfad(wert, R_AUSSEN, innenRadius(wert, R_AUSSEN), 0),
    transform: 'translate(' + MITTE_X + ' ' + MITTE_Y + ')',
    fill: farbeFuer(wert), opacity: DECKUNG,
  }));
}

/* ---------------- kosmische Karten ---------------- */

/**
 * Die sechs Motive behalten ihre Machart (Akkretionsscheibe, Strahlenkranz,
 * Ringe, Spiralarme, Schweif, Spitzenkranz), stehen aber jetzt unmittelbar im
 * neuen Bildfeld: alle Zahlen sind einmal mit 26/34 auf Mitte (39 | 44)
 * umgerechnet und ausgeschrieben — kein verschachtelter Maßstabs-Transform
 * mehr, damit auch die Strichstärken lesbar in der Datei stehen.
 *
 * Der Faktor 26/34 kommt daher, dass die weiteste Hülle der alten Motive
 * (Akkretionsscheibe, Nova-Strichkreis) den Radius 34 hatte; sie liegt jetzt
 * genau auf dem Außenradius der Zackensterne. So sind Zahlenkarte und
 * kosmische Karte gleich groß.
 *
 * Erlaubt sind nur die drei Sternfarben, --tinte und --gold. Kein Weiß außer
 * für den Kern des Weißen Lochs, keine Verläufe, kein Schein: was früher wie
 * ein Leuchten wirkte (Hof um den Schnuppenkopf, blasse Außenringe), ist jetzt
 * eine dünne gezeichnete Linie.
 */

/** Kleine Pünktchen — überall dieselbe Machart. */
function punkte(g, liste, r, farbe, deckung) {
  for (const p of liste) {
    const a = { cx: p[0], cy: p[1], r, fill: farbe };
    if (deckung != null) a.opacity = deckung;
    g.appendChild(svgKnoten('circle', a));
  }
}

/** Schwarzes Loch: Akkretionsscheibe, dunkle Kugel, Ring, Bogen darüber. */
function bildSchwarzesLoch(g) {
  g.appendChild(svgKnoten('ellipse', {
    cx: 39, cy: 44, rx: 26, ry: 8.4,
    fill: 'none', stroke: STERN_WARM, 'stroke-width': 2.7,
  }));
  g.appendChild(svgKnoten('circle', { cx: 39, cy: 44, r: 11.5, fill: TINTE }));
  g.appendChild(svgKnoten('circle', {
    cx: 39, cy: 44, r: 12.6, fill: 'none', stroke: STERN_WARM, 'stroke-width': 1.2,
  }));
  g.appendChild(svgKnoten('path', {
    d: 'M20.6 37.9 A 19.9 6.9 0 0 1 57.4 37.9',
    fill: 'none', stroke: STERN_WARM, 'stroke-width': 2.3,
  }));
}

/**
 * Weißes Loch: heller Kern mit kalter Kontur, acht Strahlen, Strichkreis.
 * Das Weiß im Kern ist die einzige Stelle, an der die Referenz Weiß erlaubt.
 */
function bildWeissesLoch(g) {
  g.appendChild(svgKnoten('circle', {
    cx: 39, cy: 44, r: 10.7, fill: '#ffffff', stroke: STERN_KALT, 'stroke-width': 1.2,
  }));
  const strahlen = svgKnoten('g', {
    stroke: STERN_KALT, 'stroke-width': 1.5, 'stroke-linecap': 'round',
  });
  const wege = [
    'M39 28.7 L39 19.5',       'M39 59.3 L39 68.5',
    'M23.7 44 L14.5 44',       'M54.3 44 L63.5 44',
    'M28.3 33.3 L22.2 27.2',   'M49.7 33.3 L55.8 27.2',
    'M28.3 54.7 L22.2 60.8',   'M49.7 54.7 L55.8 60.8',
  ];
  for (const d of wege) strahlen.appendChild(svgKnoten('path', { d }));
  g.appendChild(strahlen);
  g.appendChild(svgKnoten('circle', {
    cx: 39, cy: 44, r: 22.9, fill: 'none', stroke: STERN_KALT,
    'stroke-width': 0.8, 'stroke-dasharray': '2.3 3.8', opacity: 0.6,
  }));
}

/** Urknall: dichter Punkt, drei Ringe nach außen blasser, verstreute Pünktchen. */
function bildUrknall(g) {
  g.appendChild(svgKnoten('circle', { cx: 39, cy: 44, r: 3.8, fill: STERN_HEISS }));
  const ringe = [[10.7, 1.7, 0.85], [17.6, 1.1, 0.55], [24.5, 0.8, 0.3]];
  for (const r of ringe) {
    g.appendChild(svgKnoten('circle', {
      cx: 39, cy: 44, r: r[0],
      fill: 'none', stroke: STERN_HEISS, 'stroke-width': r[1], opacity: r[2],
    }));
  }
  punkte(g, [
    [18.4, 30.2], [60.4, 33.3], [27.5, 64.6], [57.4, 60.8],
    [39, 15.7], [66.5, 47.8], [13, 51.6],
  ], 1.2, STERN_HEISS);
}

/** Milchstraße: schräger Balken, zwei Spiralarme, Pünktchen ringsum. */
function bildMilchstrasse(g) {
  g.appendChild(svgKnoten('ellipse', {
    cx: 39, cy: 44, rx: 11.5, ry: 5, fill: STERN_WARM,
    transform: 'rotate(-24 39 44)',
  }));
  const arme = [
    'M48.2 39.4 C 62.7 35.6 67.3 47.8 57.4 57 C 48.9 64.6 34.4 63.9 27.5 57',
    'M29.8 48.6 C 15.3 52.4 10.7 40.2 20.6 31 C 29.1 23.4 43.6 24.1 50.5 31',
  ];
  for (const d of arme) {
    g.appendChild(svgKnoten('path', {
      d, fill: 'none', stroke: STERN_KALT, 'stroke-width': 1.8, opacity: 0.8,
    }));
  }
  punkte(g, [
    [60.4, 42.5], [55.1, 59.3], [37.5, 63.9], [25.2, 59.3],
    [16.1, 43.2], [22.2, 27.9], [39.8, 23.4], [52.8, 27.9],
  ], 1.1, STERN_KALT);
}

/**
 * Sternschnuppe: langer Streifen von oben rechts, heller Kopf mit Ring.
 * Der Ring war in der alten Fassung als „Hof" gedacht — jetzt ist er das,
 * was er auf Papier sein kann: eine dünne gezogene Linie.
 */
function bildSternschnuppe(g) {
  g.appendChild(svgKnoten('polygon', {
    points: '58.9,22.6 26.8,59.3 21.4,53.9', fill: STERN_WARM,
  }));
  g.appendChild(svgKnoten('circle', { cx: 24.5, cy: 58.5, r: 4.2, fill: STERN_WARM }));
  g.appendChild(svgKnoten('circle', {
    cx: 24.5, cy: 58.5, r: 7.6, fill: 'none', stroke: STERN_WARM,
    'stroke-width': 0.8, opacity: 0.5,
  }));
  punkte(g, [[40.5, 46.3], [48.2, 36.4], [33.6, 53.2]], 1.1, STERN_WARM, 0.7);
}

/** Nova: Strichkreis, vier lange Spitzen, Kern mit Ring. */
function bildNova(g) {

const KOSMISCH_BILD = {
  SCHWARZES_LOCH: bildSchwarzesLoch,
  WEISSES_LOCH:   bildWeissesLoch,
  URKNALL:        bildUrknall,
  MILCHSTRASSE:   bildMilchstrasse,
  STERNSCHNUPPE:  bildSternschnuppe,
  NOVA:           bildNova,
};

/* ---------------- Kartenbild ---------------- */

/**
 * Vorlagen werden einmal gebaut und danach geklont. Die Oberfläche zeichnet
 * nach jedem Zug alles neu — cloneNode ist deutlich billiger als der Neubau.
 */
const bildVorlagen = new Map();

function baueVorlage(art, wert) {
  const svg = svgKnoten('svg', {
    class: 'karte-bild',
    viewBox: '0 0 ' + BILD_B + ' ' + BILD_H,
    preserveAspectRatio: 'xMidYMid meet',
    'aria-hidden': 'true', focusable: 'false',
  });
  const g = svgKnoten('g');

  if (art === 'ZAHL') {
    if (wert === 1) bildEins(g);
    else if (wert === 2) bildZwei(g);
    else bildZacken(g, wert);
    // Keine Ziffer im Bild: die Oberfläche setzt sie als eigenes Element
    // unter das SVG, wie in der Gestaltungsreferenz.
  } else {
    (KOSMISCH_BILD[art] || bildUrknall)(g);
  }

  svg.appendChild(g);
  return svg;
}

/**
 * Das Bild zu einer Karte.
 * @param {{id:number, art:string, wert:(number|null)}} karte Karte aus der Engine
 * @param {{klasse?:string}} [opts] zusätzliche CSS-Klasse
 * @returns {SVGElement} <svg class="karte-bild">, skaliert über CSS
 */
function karteBild(karte, opts) {
  const art = karte && karte.art ? karte.art : 'ZAHL';
  const wert = (art === 'ZAHL') ? Math.min(12, Math.max(1, karte.wert | 0)) : 0;
  const schluessel = art + ':' + wert;

  let vorlage = bildVorlagen.get(schluessel);
  if (!vorlage) {
    vorlage = baueVorlage(art, wert);
    bildVorlagen.set(schluessel, vorlage);
  }
  const svg = vorlage.cloneNode(true);
  if (opts && opts.klasse) svg.setAttribute('class', 'karte-bild ' + opts.klasse);
  return svg;
}

/* ---------------- Formentafel ---------------- */

/**
 * Die sechs Grundformen mit Kurzregel und Beispielwerten.
 * Reihenfolge und Wortlaut wie in den Kurzregeln (texte.js).
 */
const FORMEN = [
  { typ: 'PFEIL',       name: 'Pfeil',       regel: 'Werte in Folge',            werte: [4, 5, 6, 7] },
  { typ: 'WAGEN',       name: 'Wagen',       regel: 'gleicher Abstand ab ' + CONFIG.wagen.minSchrittweite, werte: [2, 5, 8, 11] },
  { typ: 'KRONE',       name: 'Krone',       regel: 'drei gleiche + zwei gleiche', werte: [6, 6, 6, 2, 2] },
  { typ: 'KREUZ',       name: 'Kreuz',       regel: 'vier gleiche',              werte: [9, 9, 9, 9] },
  { typ: 'ZWILLING',    name: 'Zwilling',    regel: 'drei Paare',                werte: [4, 4, 8, 8, 11, 11] },
  { typ: 'DOPPELSTIER', name: 'Doppelstier', regel: 'zwei Drillinge',            werte: [3, 3, 3, 9, 9, 9] },
];

/** Punktangabe aus CONFIG: „2 / 3 / 6 / 9" bei Pfeil und Wagen, sonst eine Zahl. */
function punkteText(typ) {
  const p = CONFIG.punkte[typ];
  if (typeof p === 'number') return String(p);
  return Object.keys(p).sort((a, b) => a - b).map((k) => p[k]).join(' / ');
}

/**
 * Eine kleine Beispielkarte — genauso aufgebaut wie eine echte Karte in
 * ansicht.js: erst das Bild, dann die Ziffer als eigenes Element darunter.
 * Kein Import von dort, sonst gäbe es einen Ringschluss.
 */
function beispielKarte(wert) {
  const e = htmlKnoten('div', 'karte');
  e.dataset.art = 'ZAHL';
  e.dataset.wert = String(wert);
  e.appendChild(karteBild({ art: 'ZAHL', wert }));
  e.appendChild(htmlKnoten('span', 'karte-wert', String(wert)));
  return e;
}

/**
 * Die Übersicht der sechs Sternbilder (DOM-Vertrag-2, „Formentafel").
 * @returns {HTMLElement} <div class="formentafel">
 */
function formenTafel() {
  const tafel = htmlKnoten('div', 'formentafel');
  for (const f of FORMEN) {
    const zeile = htmlKnoten('div', 'form-zeile');
    zeile.dataset.typ = f.typ;

    const kopf = htmlKnoten('div', 'form-kopf');
    kopf.appendChild(htmlKnoten('span', 'form-name', f.name));
    kopf.appendChild(htmlKnoten('span', 'form-regel', f.regel));
    zeile.appendChild(kopf);

    const reihe = htmlKnoten('div', 'kartenreihe form-beispiel');
    for (const w of f.werte) reihe.appendChild(beispielKarte(w));
    zeile.appendChild(reihe);

    zeile.appendChild(htmlKnoten('div', 'form-punkte', punkteText(f.typ)));
    tafel.appendChild(zeile);
  }
  return tafel;
}

/* ===== app\ansicht.js ===== */
/**
 * Zeichnet den Spielzustand ins DOM.
 *
 * Reine Darstellung: nimmt ein fertiges Sichtmodell entgegen (siehe start.js)
 * und baut daraus die Elemente. Keine Spiellogik, keine Ereignisbehandlung —
 * die Klicks fängt start.js über Delegation ab.
 *
 * Die Klassennamen sind in app/DOM-Vertrag.md festgeschrieben.
 */

/* ---------------- kleine Helfer ---------------- */

function el(tag, klasse, text) {
  const e = document.createElement(tag);
  if (klasse) e.className = klasse;
  if (text != null) e.textContent = text;
  return e;
}

function leere(e) { while (e.firstChild) e.removeChild(e.firstChild); }

/**
 * Eine Karte als Element.
 * @param {object} k    Karte aus der Engine
 * @param {string} ort  'hand' | 'mitte' | 'sb' | 'nova'
 * @param {object} [opt]
 */
function karteEl(k, ort, opt = {}) {
  const klickbar = opt.klickbar !== false;
  const e = el(klickbar ? 'button' : 'div', 'karte');
  e.dataset.art = k.art;
  e.dataset.id = String(k.id);
  e.dataset.ort = ort;
  if (klickbar) e.type = 'button';

  // Das Sternbild soll man an den Zacken erkennen, nicht an der Ziffer.
  e.appendChild(karteBild(k));

  if (k.art === 'ZAHL') {
    // Aufbau wie in der Gestaltungsreferenz: der Stern oben, die Ziffer darunter.
    e.dataset.wert = String(k.wert);
    e.appendChild(el('span', 'karte-wert', String(k.wert)));
  } else {
    e.classList.add('kosmisch');
    e.appendChild(el('span', 'karte-zeichen', ART_ZEICHEN[k.art] ?? '?'));
    e.appendChild(el('span', 'karte-name', ART_TEXT[k.art] ?? k.art));
    if (opt.jokerWert != null) {
      e.classList.add('joker-wert');
      e.dataset.wert = String(opt.jokerWert);
      e.appendChild(el('span', 'karte-jokerwert', String(opt.jokerWert)));
    }
  }

  if (opt.gewaehlt) e.classList.add('gewaehlt');
  if (opt.spielbar) e.classList.add('spielbar');
  if (opt.tot) e.classList.add('tot');
  if (opt.frisch) e.classList.add('frisch');
  if (opt.tot && klickbar) e.disabled = true;
  e.title = opt.titel ?? karteText(k);
  return e;
}

function rueckseiteEl() {
  const e = el('div', 'karte rueckseite');
  e.setAttribute('aria-hidden', 'true');
  return e;
}

/**
 * Ein Sternbild als Element.
 * @param {object} sb   Sternbild aus zustand()
 * @param {object} opt  { ziel, zielText, gefahr, frisch, jokerWerte:Map }
 */
function sternbildEl(sb, opt = {}) {
  const e = el('div', 'sternbild');
  e.dataset.typ = sb.typ ?? 'WRACK';   // ohne gültige Form: Wrack
  e.dataset.sb = sb.id;
  if (sb.versiegelt) e.classList.add('versiegelt');
  if (sb.sicher) e.classList.add('sicher');
  if (opt.ziel) e.classList.add('ziel');
  if (opt.gefahr) e.classList.add('gefahr');
  if (opt.jokerChance) e.classList.add('joker-chance');
  if (opt.frisch) e.classList.add('frisch');

  // Kein Schloss, kein Häkchen: versiegelt und sicher tragen die Goldränder.
  const kopf = el('div', 'sb-kopf');
  kopf.appendChild(el('span', 'sb-typ', typText(sb.typ)));
  kopf.appendChild(el('span', 'sb-punkte', String(sb.punkte)));
  e.appendChild(kopf);

  /*
     Aufsteigend nach dem Wert, den eine Karte im Sternbild vertritt — beim
     Joker also nach dem vertretenen Wert, nicht nach seiner Kartenart.
     Damit steht der Pfeil in Folge, der Wagen in gleichen Schritten, und
     bei Krone, Kreuz, Zwilling und Doppelstier liegen die gleichen Werte
     beieinander. In der Reihenfolge der Engine erkennt man den Typ nicht.
     Sortiert wird nur die Anzeige; die Karten im Spiel bleiben, wie sie sind.
  */
  const wertVon = (k) => {
    if (k.art === 'ZAHL') return k.wert;
    const j = opt.jokerWerte ? opt.jokerWerte.get(k.id) : undefined;
    return j == null ? 99 : j;   // unaufgelöster Joker ganz nach hinten
  };
  const sortiert = sb.karten.slice().sort((a, b) => wertVon(a) - wertVon(b));

  const reihe = el('div', 'kartenreihe');
  for (const k of sortiert) {
    // Eine Sternschnuppe in einem fremden Sternbild ist selbst anklickbar,
    // wenn man die passende Karte auf der Hand hat: Antippen heißt „diese
    // hier will ich haben". Alle anderen Karten im Sternbild sind es nicht.
    const jokerHolbar = opt.jokerHolbar && k.art === 'STERNSCHNUPPE';
    const kk = karteEl(k, jokerHolbar ? 'joker' : 'sb', {
      klickbar: !!jokerHolbar,
      spielbar: !!jokerHolbar,
      gewaehlt: opt.jokerGewaehlt === k.id,
      jokerWert: opt.jokerWerte ? opt.jokerWerte.get(k.id) : undefined,
      titel: jokerHolbar
        ? 'Antippen: diese Sternschnuppe gegen deine passende Karte tauschen'
        : undefined,
    });
    if (jokerHolbar) kk.dataset.sb = sb.id;
    reihe.appendChild(kk);
  }
  e.appendChild(reihe);

  // Anfassbar ist jedes Sternbild, das noch wachsen kann — eigenes wie fremdes.
  // Ohne diese Marke sieht man dem fremden Stapel nicht an, dass man ihn
  // antippen kann, um zu klauen.
  if (opt.ziel || opt.anklickbar) {
    e.setAttribute('role', 'button');
    e.tabIndex = 0;
    e.classList.add('anklickbar');
    if (opt.zielText) e.title = opt.zielText;
    else if (opt.anklickText) e.title = opt.anklickText;
  }
  return e;
}

/* ---------------- die einzelnen Bereiche ---------------- */

function zeichneKopf(dom, s) {
  const z = s.z;
  dom.kopfRunde.innerHTML =
    'Runde <b>' + z.runde + '</b>/' + s.rundenGesamt +
    ' · Zug <b>' + Math.min(z.zugIndex + 1, z.zuegeProRunde) + '</b>/' + z.zuegeProRunde;

  leere(dom.kopfPunkte);
  for (const sp of z.spieler) {
    const li = el('li', 'spieler-chip');
    if (sp.idx === s.menschIdx) li.classList.add('mensch');
    if (sp.idx === z.amZug) li.classList.add('aktiv');
    li.appendChild(el('span', 'chip-name', sp.name));
    li.appendChild(el('span', 'chip-punkte', String(sp.punkte)));
    if (sp.himmelErreicht) li.appendChild(el('span', 'chip-himmel', 'Himmel'));
    dom.kopfPunkte.appendChild(li);
  }
}

/**
 * Wo die Gegner am Tisch sitzen. Der Mensch sitzt immer unten; die Gegner
 * verteilen sich reihum darüber, damit es wie ein runder Tisch wirkt.
 * Schlüssel ist die Zahl der Gegner.
 */
const SITZE = {
  1: ['oben'],
  2: ['oben', 'links'],
  3: ['oben', 'links', 'rechts'],
};

function zeichneGegner(dom, s) {
  leere(dom.gegnerBereich);
  const gegner = s.z.spieler.filter((sp) => sp.idx !== s.menschIdx);
  const sitze = SITZE[gegner.length] || [];
  dom.gegnerBereich.dataset.anzahl = String(gegner.length);
  let n = 0;

  for (const sp of s.z.spieler) {
    if (sp.idx === s.menschIdx) continue;
    const art = el('article', 'gegner');
    art.dataset.idx = String(sp.idx);
    art.dataset.sitz = sitze[n++] || 'oben';
    if (sp.idx === s.z.amZug) art.classList.add('aktiv');

    const kopf = el('header', 'gegner-kopf');
    kopf.appendChild(el('span', 'gegner-name', sp.name));
    if (sp.idx === s.z.amZug) kopf.appendChild(el('span', 'gegner-dran', 'am Zug'));

    // Die Handkarten verdeckt und winzig — man muss nur sehen, wie viele es sind.
    const handbox = el('div', 'gegner-hand');
    handbox.title = sp.handAnzahl + ' Handkarten';
    const faecher = el('div', 'mini-faecher');
    for (let i = 0; i < sp.handAnzahl; i++) faecher.appendChild(el('div', 'mini-rueck'));
    handbox.appendChild(faecher);
    handbox.appendChild(el('span', 'gegner-hand-zahl', String(sp.handAnzahl)));
    kopf.appendChild(handbox);

    kopf.appendChild(el('span', 'gegner-punkte', String(sp.punkte)));
    art.appendChild(kopf);

    // Gegnerische Sternbilder liegen IMMER offen mit ihren Karten da.
    // Es gab hier einmal eine kompakte Zeilenansicht — die hat das Spiel
    // unspielbar gemacht: man musste erst suchen, was die anderen haben.
    const box = el('div', 'sternbilder');
    if (sp.sternbilder.length === 0) box.appendChild(el('p', 'leer', 'noch nichts ausgelegt'));
    for (const sb of sp.sternbilder) {
      const ziel = s.zieleSb.get(sb.id);
      box.appendChild(sternbildEl(sb, {
        ziel: !!ziel,
        zielText: ziel ? aktionText(ziel, s.z) : '',
        anklickbar: s.dranMensch && !sb.sicher,
        anklickText: 'Antippen: hier klauen. Dazu mindestens zwei eigene Handkarten wählen.',
        jokerChance: s.jokerSb.has(sb.id),
        jokerHolbar: s.dranMensch && s.jokerSb.has(sb.id),
        jokerGewaehlt: s.jokerZiel,
        frisch: s.frisch.has(sb.id),
        jokerWerte: s.jokerWerte.get(sb.id),
      }));
    }
    art.appendChild(box);
    dom.gegnerBereich.appendChild(art);
  }
}

function zeichneMitte(dom, s) {
  leere(dom.mitteKarten);
  for (const k of s.z.mitte) {
    dom.mitteKarten.appendChild(karteEl(k, 'mitte', {
      gewaehlt: s.auswahlMitte.has(k.id),
      spielbar: s.spielbareMitte.has(k.id),
      tot: !s.spielbareMitte.has(k.id) && !s.auswahlMitte.has(k.id),
    }));
  }
  if (s.z.nova) {
    const n = karteEl(s.z.nova, 'nova', {
      spielbar: s.novaMoeglich,
      tot: !s.novaMoeglich,
      titel: 'Nova — einmal pro Partie',
    });
    n.classList.add('nova-karte');
    dom.mitteKarten.appendChild(n);
  }
  dom.mitteHinweis.textContent = s.mitteHinweis;
  zeichneStapel(dom, s);
}

/**
 * Nachziehstapel und Ablage als echte Stapel: ein paar versetzte Blätter
 * darunter geben die Höhe an, damit man sieht, wie viel noch da ist.
 */
function zeichneStapel(dom, s) {
  const z = s.z;

  const bau = (wurzel, anzahl, oben, beschriftung) => {
    leere(wurzel);
    wurzel.dataset.anzahl = String(anzahl);
    // Höchstens vier Blätter andeuten — mehr sieht man ohnehin nicht.
    const blaetter = Math.min(4, Math.max(0, anzahl - (oben ? 1 : 0)));
    for (let i = 0; i < blaetter; i++) {
      const b = el('div', 'stapel-blatt');
      b.style.setProperty('--tiefe', String(blaetter - i));
      wurzel.appendChild(b);
    }
    if (oben) {
      const k = karteEl(oben, 'ablage', { klickbar: false, titel: 'zuletzt abgeworfen' });
      k.classList.add('stapel-oben');
      wurzel.appendChild(k);
    } else if (anzahl > 0) {
      const r = el('div', 'karte rueckseite stapel-oben');
      r.setAttribute('aria-hidden', 'true');
      wurzel.appendChild(r);
    } else {
      wurzel.appendChild(el('div', 'stapel-leer'));
    }
    const f = el('div', 'stapel-fuss');
    f.appendChild(el('span', 'stapel-name', beschriftung));
    f.appendChild(el('span', 'stapel-zahl', String(anzahl)));
    wurzel.appendChild(f);
  };

  bau(dom.stapelDeck, z.deckAnzahl ?? 0, null, 'Nachziehen');
  bau(dom.stapelAblage, z.ablageAnzahl ?? 0, z.ablageOben ?? null, 'Ablage');
}

function zeichneIch(dom, s) {
  const ich = s.z.spieler[s.menschIdx];

  // Dieselbe Hervorhebung wie bei einem aktiven Gegnerplatz, dazu die Marke.
  if (dom.ichBereich) dom.ichBereich.classList.toggle('aktiv', !!s.dranMensch);
  if (dom.handBereich) dom.handBereich.classList.toggle('aktiv', !!s.dranMensch);
  if (dom.dranMarke) dom.dranMarke.hidden = !s.dranMensch;

  leere(dom.meineSternbilder);
  if (ich.sternbilder.length === 0) {
    dom.meineSternbilder.appendChild(el('p', 'leer', 'Noch kein Sternbild — leg eins aus.'));
  }
  for (const sb of ich.sternbilder) {
    const ziel = s.zieleSb.get(sb.id);
    dom.meineSternbilder.appendChild(sternbildEl(sb, {
      ziel: !!ziel,
      zielText: ziel ? aktionText(ziel, s.z) : '',
      anklickbar: s.dranMensch && !sb.sicher,
      anklickText: 'Antippen: hier anlegen und das Sternbild vergrößern.',
      gefahr: s.gefahrSb.has(sb.id),
      frisch: s.frisch.has(sb.id),
      jokerWerte: s.jokerWerte.get(sb.id),
    }));
  }

  leere(dom.meineHand);
  for (const k of ich.hand || []) {
    dom.meineHand.appendChild(karteEl(k, 'hand', {
      gewaehlt: s.auswahlHand.has(k.id),
      spielbar: s.spielbareHand.has(k.id),
      tot: !s.spielbareHand.has(k.id) && !s.auswahlHand.has(k.id),
      frisch: s.frischeKarten.has(k.id),
    }));
  }
}

function zeichneTipps(dom, s) {
  leere(dom.tipps);
  if (!s.tipps.length) {
    dom.tipps.appendChild(el('li', 'leer', s.z.amZug === s.menschIdx ? 'kein Zug möglich' : '…'));
    return;
  }
  s.tipps.forEach((t, i) => {
    const li = el('li', 'tipp');
    li.dataset.nr = String(i);
    li.appendChild(el('span', 'tipp-text', aktionText(t, s.z)));
    li.appendChild(el('span', 'tipp-punkte', aktionWert(t)));
    dom.tipps.appendChild(li);
  });
}

function zeichneProtokoll(dom, zeilen) {
  leere(dom.protokoll);
  for (const p of zeilen) {
    const z = el('p', 'log-zeile', logText(p.text));
    z.dataset.runde = String(p.runde);
    if (p.text.indexOf('—') === 0) z.classList.add('rundenwechsel');
    dom.protokoll.appendChild(z);
  }
  dom.protokoll.scrollTop = dom.protokoll.scrollHeight;
}

function zeichneLeiste(dom, s) {
  dom.leisteText.textContent = s.hinweis;
  // Drei Tonlagen: was gerade passiert ist, warum etwas nicht geht, alles andere.
  dom.leisteText.classList.toggle('ist-zug', !!s.hinweisIstZug);
  dom.leisteText.classList.toggle('ist-fehler', !!s.hinweisIstFehler);
  leere(dom.leisteKnoepfe);
  s.knoepfe.forEach((k, i) => {
    const b = el('button', 'knopf' + (k.klasse ? ' ' + k.klasse : ''), k.text);
    b.type = 'button';
    b.dataset.knopf = String(i);
    if (k.aus) b.disabled = true;
    if (k.titel) b.title = k.titel;
    dom.leisteKnoepfe.appendChild(b);
  });
}

/* ---------------- Fenster ---------------- */

function zeigeModal(dom, titel, inhaltHtml, knoepfe = [], pflicht = false) {
  dom.modal.classList.toggle('pflicht', !!pflicht);
  const box = dom.modalInhalt;
  leere(box);
  box.appendChild(el('h2', 'modal-titel', titel));
  const koerper = el('div', 'modal-text');
  koerper.innerHTML = inhaltHtml;
  box.appendChild(koerper);
  if (knoepfe.length) {
    const reihe = el('div', 'modal-knoepfe');
    knoepfe.forEach((k) => {
      const b = el('button', 'knopf' + (k.klasse ? ' ' + k.klasse : ''), k.text);
      b.type = 'button';
      b.addEventListener('click', k.tun);
      reihe.appendChild(b);
    });
    box.appendChild(reihe);
  }
  dom.modal.hidden = false;
}

function schliesseModal(dom) { dom.modal.hidden = true; }

/* ---------------- Die eine auffällige Bewegung ---------------- */

/**
 * Wo liegt gerade welche Karte? Für jede sichtbare Karte ihre Bildschirmlage
 * und der Bereich, in dem sie liegt: `sp0`…`sp3` für einen Spielerplatz
 * (Auslage und Hand gehören demselben Platz), `mitte` oder `stapel`.
 */
function kartenLage() {
  const m = new Map();
  for (const e of document.querySelectorAll('.karte[data-id]')) {
    const id = Number(e.dataset.id);
    if (!Number.isFinite(id)) continue;
    let ort = 'stapel';
    const gegner = e.closest('.gegner');
    if (gegner) ort = 'sp' + gegner.dataset.idx;
    else if (e.closest('#mitte-karten')) ort = 'mitte';
    // Die eigene Hand ist ein eigener Ort, nicht dasselbe wie die eigene
    // Auslage — sonst wäre das Legen einer Handkarte gar keine Bewegung.
    else if (e.closest('#hand-bereich')) ort = 'hand0';
    else if (e.closest('#ich-bereich')) ort = 'sp0';
    // Das Element wird mitgemerkt: Karten, die der Zug vom Tisch nimmt, sind
    // nach dem Neuzeichnen nicht mehr da. Ein abgehängtes Element lässt sich
    // trotzdem klonen — nur so kann man sie noch wegfliegen lassen.
    m.set(id, { r: e.getBoundingClientRect(), ort, el: e });
  }
  return m;
}

/** Wo hat dieser Platz seine Handkarten? Ausgangspunkt für gelegte Karten. */
function handQuelle(ort, wie) {
  const wahl = ort === 'sp0'
    ? document.getElementById('meine-hand')
    : document.querySelector(`.gegner[data-idx="${ort.slice(2)}"] .gegner-hand`);
  if (!wahl) return null;
  const b = wahl.getBoundingClientRect();
  if (!b.width) return null;
  // Aus der Mitte der Handzone starten, in der Größe der Zielkarte.
  return {
    left: b.left + b.width / 2 - wie.width / 2,
    top: b.top + b.height / 2 - wie.height / 2,
    width: wie.width,
    height: wie.height,
  };
}

/** Der Ablagestapel — dorthin verschwinden zerstörte Karten. */
function ablageZiel(wie) {
  const a = document.getElementById('stapel-ablage');
  if (!a) return null;
  const b = a.getBoundingClientRect();
  if (!b.width) return null;
  return { left: b.left, top: b.top, width: wie.width, height: wie.height };
}

/**
 * Lässt Karten sichtbar von einem Platz zum anderen wandern.
 *
 * Bewusst nur zwei Fälle, sonst zappelt der Tisch bei jedem Zug:
 *   - von einem Spieler zu einem anderen  → geklaut
 *   - von einem Spieler in die Mitte      → zerstört
 * Bauen (Mitte → eigener Platz) bewegt sich nicht.
 *
 * @param {Map} vorher Ergebnis von kartenLage() VOR dem Zug
 * @returns {Promise<void>}
 */
/**
 * @param {Map} vorher  Ergebnis von kartenLage() VOR dem Zug
 * @param {{kosmisch?:string, dauer?:number}} [opt]
 *   kosmisch: 'SCHWARZES_LOCH' | 'URKNALL' | 'WEISSES_LOCH' | 'NOVA'
 *   Dann erzählt die Bewegung, was die Karte getan hat: das Schwarze Loch
 *   saugt ein, der Urknall schleudert auseinander, das Weiße Loch zieht eine
 *   einzelne Karte heraus. Vorher waren die Karten einfach weg und man musste
 *   im Protokoll nachlesen, was passiert war.
 */
function fliegeUm(vorher, opt = {}) {
  const dauer = opt.dauer || 700;
  const kosmisch = opt.kosmisch || null;
  const ruhig = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (ruhig || !vorher || vorher.size === 0) return Promise.resolve();

  const jetzt = kartenLage();
  const fluege = [];
  const istSp = (o) => o.indexOf('sp') === 0;

  for (const [id, neu] of jetzt) {
    const alt = vorher.get(id);
    if (!alt) {
      // Vorher nirgends zu sehen und jetzt in einer Auslage: aus der Hand gelegt.
      if (!istSp(neu.ort)) continue;
      const von = handQuelle(neu.ort, neu.r);
      if (von) fluege.push({ id, von, nach: neu.r, art: 'legen' });
      continue;
    }
    if (alt.ort === neu.ort) continue;
    if (istSp(alt.ort) && istSp(neu.ort)) fluege.push({ id, von: alt.r, nach: neu.r, art: 'klau', quelle: alt.el });
    else if ((alt.ort === 'mitte' || alt.ort === 'hand0') && istSp(neu.ort)) {
      fluege.push({ id, von: alt.r, nach: neu.r, art: 'legen' });
    }
    else if (istSp(alt.ort) && neu.ort === 'mitte') fluege.push({ id, von: alt.r, nach: neu.r, art: 'zerstoert', quelle: alt.el });
    // Aus einer Auslage auf die eigene Hand — das tut das Weiße Loch.
    else if (istSp(alt.ort) && neu.ort === 'hand0') fluege.push({ id, von: alt.r, nach: neu.r, art: 'zug', quelle: alt.el });
  }

  // Karten, die der Zug ganz vom Tisch genommen hat (zerstört, auf die Ablage).
  for (const [id, alt] of vorher) {
    if (jetzt.has(id) || !istSp(alt.ort)) continue;
    const ziel = ablageZiel(alt.r);
    if (ziel) fluege.push({ id, von: alt.r, nach: ziel, art: 'zerstoert', quelle: alt.el, weg: true });
  }

  if (!fluege.length) return Promise.resolve();

  /* ---- Kosmische Karten bekommen ihr eigenes Bild ---- */
  const zerstoerte = fluege.filter((f) => f.art === 'zerstoert');
  if (kosmisch === 'SCHWARZES_LOCH' || kosmisch === 'NOVA') {
    // Einsaugen: alles läuft im Schwerpunkt der zerfallenden Auslage zusammen
    // und schrumpft dabei auf nichts.
    const m = schwerpunkt(zerstoerte);
    for (const f of zerstoerte) {
      f.nach = { left: m.x - 3, top: m.y - 4, width: 6, height: 8 };
      f.weg = true;
      f.dreh = (f.von.left - m.x) / 6;
      f.art = 'loch';
    }
  } else if (kosmisch === 'URKNALL') {
    // Auseinanderfliegen: jede Karte weg von der Mitte des Geschehens.
    const m = schwerpunkt(zerstoerte);
    for (const f of zerstoerte) {
      const dx = (f.von.left + f.von.width / 2) - m.x;
      const dy = (f.von.top + f.von.height / 2) - m.y;
      const laenge = Math.max(1, Math.hypot(dx, dy));
      const weite = 340 + Math.random() * 220;
      f.nach = {
        left: f.von.left + (dx / laenge) * weite,
        top: f.von.top + (dy / laenge) * weite,
        width: f.von.width,
        height: f.von.height,
      };
      f.weg = true;
      f.dreh = (Math.random() * 2 - 1) * 90;
      f.art = 'knall';
    }
  } else if (kosmisch === 'WEISSES_LOCH') {
    // Herausziehen: die eine Karte wandert langsam und deutlich.
    for (const f of fluege) if (f.art === 'legen') f.art = 'zug';
  }

  // Klauen und Zerstören sind die großen Momente — sie dauern länger.
  const langsam = fluege.some((f) => f.art !== 'legen');
  let zeit = langsam ? Math.round(dauer * 1.7) : dauer;
  if (kosmisch === 'URKNALL') zeit = 1250;
  if (kosmisch === 'SCHWARZES_LOCH' || kosmisch === 'NOVA') zeit = 1150;
  if (kosmisch === 'WEISSES_LOCH') zeit = 1100;

  const buehne = el('div', 'flug-buehne');
  document.body.appendChild(buehne);
  const versteckt = [];

  // Der Urknall macht einen Knall: ein kurzer heller Anschlag über allem.
  if (kosmisch === 'URKNALL') {
    const blitz = el('div', 'knall-blitz');
    document.body.appendChild(blitz);
    setTimeout(() => blitz.remove(), 700);
  }

  for (const f of fluege) {
    const echt = document.querySelector(`.karte[data-id="${f.id}"]`);
    const muster = echt || f.quelle;
    if (!muster) continue;
    const klon = muster.cloneNode(true);
    klon.classList.add('fliegt', 'flug-' + f.art);
    klon.style.left = f.von.left + 'px';
    klon.style.top = f.von.top + 'px';
    klon.style.width = f.von.width + 'px';
    klon.style.height = f.von.height + 'px';
    buehne.appendChild(klon);
    if (echt) { echt.style.visibility = 'hidden'; versteckt.push(f.id); }
    if (f.weg) klon.style.opacity = '1';

    setTimeout(() => {
      klon.style.transitionDuration = zeit + 'ms';
      klon.style.left = f.nach.left + 'px';
      klon.style.top = f.nach.top + 'px';
      klon.style.width = f.nach.width + 'px';
      klon.style.height = f.nach.height + 'px';
      if (f.dreh) klon.style.transform = `rotate(${Math.round(f.dreh)}deg)`;
      if (f.weg) klon.style.opacity = '0';
    }, 20);
  }

  return new Promise((fertig) => {
    setTimeout(() => {
      buehne.remove();
      for (const id of versteckt) {
        const echt = document.querySelector(`.karte[data-id="${id}"]`);
        if (echt) echt.style.visibility = '';
      }
      fertig();
    }, zeit + 60);
  });
}

/** Mittelpunkt einer Gruppe von Flügen — der Ort, an dem etwas passiert. */
function schwerpunkt(fluege) {
  if (!fluege.length) return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  let x = 0, y = 0;
  for (const f of fluege) { x += f.von.left + f.von.width / 2; y += f.von.top + f.von.height / 2; }
  return { x: x / fluege.length, y: y / fluege.length };
}

/* ---------------- Mischen ---------------- */

/**
 * Am Rundenende kommen alle Karten zurück ins Deck und werden neu gemischt.
 * Ohne Bild passiert das unsichtbar — hier fliegen kurz ein paar Kartenrücken
 * zusammen, damit man sieht, dass der Tisch abgeräumt wurde.
 * @param {number} [dauer] Millisekunden, Vorgabe 1100
 * @returns {Promise<void>} löst auf, wenn das Bild wieder weg ist
 */
function mischeAnimation(dom, dauer = 1100) {
  // Wer Bewegung abgeschaltet hat, bekommt sie auch hier nicht.
  const ruhig = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const zeit = ruhig ? 260 : dauer;

  const buehne = el('div', 'mischen');
  const wolke = el('div', 'mischen-wolke');
  const ANZAHL = 12;
  for (let i = 0; i < ANZAHL; i++) {
    const k = el('div', 'karte rueckseite mischen-karte');
    // Jede Karte kommt aus einer anderen Richtung und fällt in die Mitte.
    const winkel = (i / ANZAHL) * Math.PI * 2;
    k.style.setProperty('--von-x', Math.round(Math.cos(winkel) * 260) + 'px');
    k.style.setProperty('--von-y', Math.round(Math.sin(winkel) * 170) + 'px');
    k.style.setProperty('--dreh', Math.round(Math.cos(winkel * 1.7) * 40) + 'deg');
    k.style.setProperty('--verzug', (i * 34) + 'ms');
    wolke.appendChild(k);
  }
  const text = el('div', 'mischen-text', 'Karten werden neu gemischt');
  buehne.appendChild(wolke);
  buehne.appendChild(text);
  document.body.appendChild(buehne);

  return new Promise((fertig) => {
    setTimeout(() => {
      buehne.classList.add('weg');
      setTimeout(() => { buehne.remove(); fertig(); }, 220);
    }, zeit);
  });
}

/* ---------------- Erklärung beim Überfahren ---------------- */

let hinweisEl = null;

/** Der kleine Kasten, der beim Überfahren erscheint. */
function hinweisKasten() {
  if (!hinweisEl) {
    hinweisEl = el('div', 'schweber');
    hinweisEl.hidden = true;
    document.body.appendChild(hinweisEl);
  }
  return hinweisEl;
}

function zeigeSchweber(text, umXY) {
  if (!text) return versteckeSchweber();
  const e = hinweisKasten();
  e.textContent = text;
  e.hidden = false;
  // In den Bildschirm hineinschieben, damit nichts abgeschnitten wird.
  const b = e.getBoundingClientRect();
  const x = Math.min(Math.max(8, umXY.x - b.width / 2), window.innerWidth - b.width - 8);
  const y = umXY.y - b.height - 12 < 8 ? umXY.y + 22 : umXY.y - b.height - 12;
  e.style.left = Math.round(x) + 'px';
  e.style.top = Math.round(y) + 'px';
}

function versteckeSchweber() {
  if (hinweisEl) hinweisEl.hidden = true;
}

/* ===== app\startschirm.js ===== */
/**
 * Der Startschirm — das Erste, was man sieht.
 *
 * Hält keine Spiellogik, kennt das Spiel nicht. Er sammelt nur die Wahl des
 * Spielers ein und meldet sie über Rückrufe an start.js.
 */

const SPEICHER_TUTORIAL = 'sternenraub.tutorialGesehen';
const SPEICHER_NAME = 'sternenraub.name';

/** localStorage kann fehlen (privates Fenster, gesperrte Seitendaten) — nie verlassen. */
function lies(schluessel, ersatz) {
  try { const v = localStorage.getItem(schluessel); return v === null ? ersatz : v; }
  catch { return ersatz; }
}
function schreib(schluessel, wert) {
  try { localStorage.setItem(schluessel, wert); } catch { /* egal */ }
}

/**
 * Wurde das Tutorial schon gespielt oder übersprungen?
 *
 * Es startet NICHT beim Öffnen der Seite — der Startschirm kommt immer zuerst.
 * Erst beim Druck auf „Spielen" führt der erste Besuch ins Tutorial.
 * Ist localStorage gesperrt, gilt es als gesehen: lieber einmal zu wenig
 * führen als jedes Mal ungefragt.
 */
function tutorialSchonGesehen() {
  try { return localStorage.getItem(SPEICHER_TUTORIAL) === 'ja'; }
  catch { return true; }
}
const merkeTutorialGesehen = () => schreib(SPEICHER_TUTORIAL, 'ja');

/** Zum Prüfen: wieder in den Zustand eines neuen Spielers versetzen. */
function vergissTutorial() {
  try { localStorage.removeItem(SPEICHER_TUTORIAL); } catch { /* egal */ }
}
const gemerkterName = () => lies(SPEICHER_NAME, 'Anton');
const merkeName = (name) => schreib(SPEICHER_NAME, name);

/**
 * Verdrahtet den Startschirm.
 * @param {object} rueckrufe { spielen({bots,stufe,name}), freunde(), tutorial(), regeln() }
 */
function baueStartschirm(rueckrufe) {
  const el = document.getElementById('startschirm');
  const knoepfe = document.getElementById('start-knoepfe');
  const wahl = document.getElementById('start-wahl');
  const nameFeld = document.getElementById('start-name');

  nameFeld.value = gemerkterName();

  let bots = 2;
  let stufe = 'normal';

  /** Eine Reihe Umschaltknöpfe: genau einer trägt .gewaehlt. */
  function umschalten(gruppe, attribut, wert) {
    for (const b of gruppe.querySelectorAll(`[data-${attribut}]`)) {
      b.classList.toggle('gewaehlt', b.dataset[attribut] === String(wert));
    }
  }

  wahl.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-bots], button[data-stufe]');
    if (!b) return;
    if (b.dataset.bots) { bots = Number(b.dataset.bots); umschalten(wahl, 'bots', bots); }
    else { stufe = b.dataset.stufe; umschalten(wahl, 'stufe', stufe); }
  });

  /** Genau eine Ebene ist offen: Hauptmenü oder „gegen wen?". */
  function zeigeEbene(welche) {
    knoepfe.hidden = welche !== 'menue';
    wahl.hidden = welche !== 'bots';
  }
  const zeigeWahl = (an) => zeigeEbene(an ? 'bots' : 'menue');

  document.getElementById('btn-spielen').addEventListener('click', () => {
    // Beim allerersten Mal übernimmt start.js und führt ins Tutorial.
    // Sonst kommt wie gehabt die Frage, gegen wen gespielt wird.
    if (rueckrufe.spielenGedrueckt && rueckrufe.spielenGedrueckt()) return;
    zeigeWahl(true);
    nameFeld.focus();
  });
  document.getElementById('btn-zurueck').addEventListener('click', () => zeigeWahl(false));

  document.getElementById('btn-los').addEventListener('click', () => {
    const name = (nameFeld.value || '').trim() || gemerkterName();
    merkeName(name);
    rueckrufe.spielen({ bots, stufe, name });
  });

  document.getElementById('btn-freunde').addEventListener('click', () => rueckrufe.freunde());
  document.getElementById('btn-tutorial').addEventListener('click', () => rueckrufe.tutorial());
  document.getElementById('btn-regeln-start').addEventListener('click', () => rueckrufe.regeln());

  // Zum Prüfen: den Merker löschen, damit „Spielen" wieder ins Tutorial führt.
  const btnNeu = document.getElementById('btn-tutorial-neu');
  btnNeu.addEventListener('click', () => {
    vergissTutorial();
    btnNeu.textContent = 'Erledigt — „Spielen" führt wieder ins Tutorial';
    setTimeout(() => { btnNeu.textContent = 'Tutorial beim Start wieder zeigen'; }, 3000);
  });


  return {
    zeigen() { el.hidden = false; zeigeEbene('menue'); },
    /** Direkt bei der Frage „gegen wen?" aufmachen — nach dem Tutorial. */
    zeigeWahl() { el.hidden = false; zeigeEbene('bots'); },
    verstecken() { el.hidden = true; },
    name: () => (nameFeld.value || '').trim() || gemerkterName(),
  };
}

/* ===== app\tutorial.js ===== */
/**
 * Sternenraub — Tutorial.
 *
 * Geführt wird von einer Kartenrückseite (siehe erzaehler.js). Sie erklärt
 * erst, worum es geht, und stellt dann ein paar Aufgaben auf dem echten
 * Spieltisch mit einer echten `Spiel`-Instanz. Vor jeder Aufgabe werden Hand,
 * Mitte und Sternbilder von Hand hingelegt; `erlaubt()` lässt danach genau den
 * einen gesuchten Zug durch. Am Ende endet die Führung und man spielt frei
 * weiter.
 *
 * Diese Datei enthält die Reihenfolge und die Texte. Das Abspielen steht in
 * start.js (laufeTutorial), die Darstellung in erzaehler.js.
 *
 * Regelzahlen stehen hier keine drin — alles kommt aus CONFIG.
 */

/* ------------------------------------------------------------------ */
/*  Karten für den Aufbau                                              */
/* ------------------------------------------------------------------ */

/**
 * Eigener ID-Bereich, weit weg von den echten Karten (die zählen ab 0 hoch).
 * Jeder Aufbau vergibt frische IDs, damit keine alte Auswahl der Oberfläche
 * versehentlich noch passt.
 */
let naechsteId = 90000;

function zahlkarte(wert) {
  return { id: naechsteId++, art: 'ZAHL', wert };
}

function sonderkarte(art) {
  return { id: naechsteId++, art, wert: null };
}

/** Werteliste → Kartenliste. Zeichenketten gelten als kosmische Karte. */
function karten(werte) {
  const out = [];
  for (const w of werte) out.push(typeof w === 'string' ? sonderkarte(w) : zahlkarte(w));
  return out;
}

/** Hat die Aktion genau diese Werte? `a.werte` kommt sortiert aus der Bewertung. */
function werteSind(a, werte) {
  if (!a || !a.werte || a.werte.length !== werte.length) return false;
  for (let i = 0; i < werte.length; i++) if (a.werte[i] !== werte[i]) return false;
  return true;
}

/* ------------------------------------------------------------------ */
/*  Kurzformen der Regelzahlen (nur zum Lesen der Texte)               */
/* ------------------------------------------------------------------ */

const P = CONFIG.punkte;
const MIN_KARTEN = CONFIG.sternbild.minKarten;
const MAX_KARTEN = CONFIG.sternbild.maxKarten;
const BAU_MIN_HAND = CONFIG.zug.bauenMinHandkarten;
const BAU_MAX_MITTE = CONFIG.zug.bauenMaxAusMitte;
const KLAU_MIN_HAND = CONFIG.zug.klauenMinHandkarten;
const TROST_PRO_KARTE = CONFIG.klauen.entschaedigungProKarte;
const VERSIEGELN_PRO_RUNDE = CONFIG.zug.versiegelnProRunde;
const RUNDEN = CONFIG.spiel.runden;
const WAGEN_SCHRITT = CONFIG.wagen.minSchrittweite;

/* ------------------------------------------------------------------ */
/*  Das Tutorial                                                       */
/* ------------------------------------------------------------------ */

class Tutorial {
  /** @param {import('../engine/src/engine/game.js').Spiel} spiel frisch, Runde läuft schon */
  constructor(spiel) {
    this.spiel = spiel;
    this.ich = 0;
    this.gegner = spiel.spieler.length > 1 ? 1 : 0;

    this.pos = 0;
    this.fertig = false;

    // Merker, die zwischen Aufbau, erlaubt() und Text gebraucht werden
    this._sbPfeil = null;
    this._sbBeute = null;
    this._geklaut = 0;

    this.schritte = this._baueSchritte();
    // Nur die Aufgaben werden gezählt — „Schritt 2 von 5" soll sich auf das
    // beziehen, was man selbst tut, nicht auf die Erzählabschnitte.
    this.aufgabenGesamt = this.schritte.filter((s) => s.art === 'aufgabe').length;
  }

  /* ---------------- Auskunft ---------------- */

  schritt() { return this.schritte[this.pos]; }

  /** Die wievielte Aufgabe ist die aktuelle? 0, wenn gerade nur erzählt wird. */
  get aufgabeNr() {
    let n = 0;
    for (let i = 0; i <= this.pos && i < this.schritte.length; i++) {
      if (this.schritte[i].art === 'aufgabe') n++;
    }
    return this.schritte[this.pos] && this.schritte[this.pos].art === 'aufgabe' ? n : 0;
  }

  /* ---------------- Ablauf ---------------- */

  /**
   * Baut den Spielzustand für den aktuellen Schritt auf.
   *
   * `aufbau` räumt den Tisch ab und stellt ihn neu — das ist ein Szenenwechsel
   * und muss im Text angekündigt sein. `vorbereiten` lässt liegen, was liegt,
   * und ändert nur eine Kleinigkeit; damit geht ein Schritt nahtlos in den
   * nächsten über.
   */
  starteSchritt() {
    const s = this.schritte[this.pos];
    if (!s) return this;
    if (s.aufbau) {
      this._tischLeeren();
      s.aufbau();
      this._gegnerHaendeFuellen();
    } else if (s.vorbereiten) {
      s.vorbereiten();
    }
    return this;
  }

  /** Darf diese Aktion aus generiereAktionen jetzt gespielt werden? */
  erlaubt(aktion) {
    const s = this.schritte[this.pos];
    if (!s || s.art !== 'aufgabe' || !aktion) return false;
    return !!s.erlaubt && s.erlaubt(aktion);
  }

  /** Dito für eine kosmische Karte aus generiereKosmische. */
  erlaubtKosmisch(wahl) {
    const s = this.schritte[this.pos];
    if (!s || s.art !== 'aufgabe' || !wahl) return false;
    return !!s.erlaubtKosmisch && s.erlaubtKosmisch(wahl);
  }

  /** Die geskriptete Antwort des Gegners, direkt nach deinem Zug. */
  nachZug() {
    const s = this.schritte[this.pos];
    if (s && s.nachZug) s.nachZug();
    return this;
  }

  /**
   * Einen Schritt weiter. Setzt `fertig`, wenn nichts mehr kommt.
   *
   * Der Tisch wird hier NICHT aufgebaut. Sonst änderte er sich schon beim
   * Druck auf „Weiter", während der alte Text noch stand — es sah aus, als
   * hätte jemand einen Zug gemacht, der nirgends erklärt wird. Den Aufbau
   * macht die Oberfläche, unmittelbar bevor der neue Text anfängt.
   */
  weiter() {
    if (this.pos >= this.schritte.length - 1) { this.fertig = true; return this; }
    this.pos++;
    return this;
  }

  /* ---------------- Aufbau-Werkzeug ---------------- */

  _tischLeeren() {
    for (const sp of this.spiel.spieler) {
      sp.hand = [];
      sp.sternbilder = [];
      sp.versiegelungenDieseRunde = 0;
    }
    this.spiel.mitte = [];
  }

  _hand(idx, werte) {
    this.spiel.spieler[idx].hand = karten(werte);
  }

  /**
   * Gegner, denen ein Schritt keine Hand gibt, bekommen eine neutrale.
   * Sie ist verdeckt und beeinflusst keinen Zug — der Tisch sieht nur normal aus.
   */
  _gegnerHaendeFuellen() {
    for (const sp of this.spiel.spieler) {
      if (sp.idx === this.ich || sp.hand.length > 0) continue;
      const werte = [];
      for (let i = 0; i < CONFIG.spiel.handkarten; i++) werte.push(1 + (i * 4) % 12);
      sp.hand = karten(werte);
    }
  }

  /**
   * Legt die Mitte. Falls die Runde mehr Karten verlangt, als der Schritt braucht,
   * wird mit `fuellWert` aufgefüllt — der Wert gehört in keinem Schritt zum
   * gesuchten Zug, kann also keinen zweiten passenden Zug erzeugen.
   */
  _mitte(werte, fuellWert) {
    const k = karten(werte);
    const ziel = mitteGroesse(this.spiel.runde > 0 ? this.spiel.runde : 1);
    const fuell = fuellWert === undefined ? 1 : fuellWert;
    while (k.length < ziel) k.push(zahlkarte(fuell));
    this.spiel.mitte = k;
  }

  /** Legt ein Sternbild vor einen Spieler und gibt seine ID zurück. */
  _sternbild(idx, werte, versiegelt) {
    const sb = { id: this.spiel.neueSbId(), karten: karten(werte), versiegelt: !!versiegelt };
    this.spiel.spieler[idx].sternbilder.push(sb);
    return sb.id;
  }

  _gegnerName() {
    return this.spiel.spieler[this.gegner].name;
  }

  /* ---------------- Die Abfolge ---------------- */

  _baueSchritte() {

    return [
      /* ================= Vorspann: worum geht es ================= */

            + 'Dazu gibt es vier Formen aus gleichen Zahlen. Die kannst du oben unter '

      },
      {
        art: 'reden',
        text: 'Und jetzt der Haken: Was vor dir liegt, ist nicht sicher. '

      },
