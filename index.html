<title>Sternenraub</title>
<style>
/* ============================================================
   Sternenraub - Gestaltungsmarken
   Verbindlich. Keine anderen Farben, Radien oder Schatten.
   ============================================================ */

:root {
  /* --- Tisch: die Nacht --- */
  --tisch-tief:    #080C17;   /* Rand, Hintergrund ganz aussen */
  --tisch:         #0E1424;   /* Spielflaeche */
  --tisch-hoch:    #16203A;   /* abgesetzte Bereiche, Mitte */
  --tisch-linie:   #253052;   /* Trennlinien, Kartenumriss auf dem Tisch */

  /* --- Karte: das Papier --- */
  --papier:        #EDE6D6;   /* Kartenvorderseite */
  --papier-tief:   #DED3BC;   /* Rueckseite, gedaempfte Karte */
  --tinte:         #1B2233;   /* Ziffern, Linien auf der Karte */
  --tinte-leise:   #6A6656;   /* Nebenangaben auf der Karte */

  /* --- Sterne: Wert wird Farbe --- */
  --stern-kalt:    #6E9BD1;   /* Werte 1-4 */
  --stern-warm:    #D9A02B;   /* Werte 5-8 */
  --stern-heiss:   #C0463A;   /* Werte 9-12 */

  /* --- Zustaende --- */
  --gold:          #B08D3F;   /* versiegelt, fertig, sicher */
  --signal:        #E8DCC0;   /* du bist am Zug, Auswahl */
  --schrift:       #E6E1D4;   /* Text auf dem Tisch */
  --schrift-leise: #8C93A8;   /* Nebentext auf dem Tisch */

  /* --- Schrift --- */
  --serif:  'EB Garamond', Georgia, serif;
  --grotesk:'Archivo', system-ui, sans-serif;

  --t-karte:    clamp(20px, 5vw, 30px);  /* Kartenziffer */
  --t-titel:    clamp(28px, 6vw, 44px);
  --t-abschnitt:19px;
  --t-text:     16px;
  --t-neben:    13px;

  /* --- Mass --- */
  --karte-b: 78px;                    /* Kartenbreite, Verhaeltnis 2,5 : 3,5 */
  --karte-h: 109px;
  --r-karte: 5px;                     /* Karten: fast eckig, wie echtes Papier */
  --r-flaeche: 3px;                   /* Flaechen: noch eckiger */
  --raum: 8px;                        /* alle Abstaende sind Vielfache davon */
}

/* Karten liegen auf dem Tisch - kein Schlagschatten, sondern ein
   dunkler Rand darunter, wie Papier auf einer dunklen Flaeche. */
.karte {
  width: var(--karte-b); height: var(--karte-h);
  background: var(--papier); color: var(--tinte);
  border-radius: var(--r-karte);
  border: 1px solid rgba(0,0,0,.35);
  box-shadow: 0 1px 0 rgba(0,0,0,.5);
  font-family: var(--serif);
}
.karte--versiegelt { box-shadow: 0 1px 0 rgba(0,0,0,.5), 0 0 0 2px var(--gold); }
.karte--gewaehlt   { transform: translateY(-10px); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>

<style>
/* ============================================================
   Sternenraub — Gestaltung der Oberfläche
   ------------------------------------------------------------
   Leitidee: Papier auf der Nacht. Der Tisch ist tiefes Indigo,
   die Karten sind gealtertes Papier. Die Sterne darauf sind
   gedruckt, nicht beleuchtet.

   Verbindlich:  Design_Referenz.html  ·  design-tokens.css
   Struktur:     app/DOM-Vertrag.md    ·  app/DOM-Vertrag-2.md

   design-tokens.css und schriften.css werden VOR dieser Datei
   geladen. Die Marken werden hier nicht neu definiert — nur
   benutzt. Es gibt keine anderen Farben, Radien, Schatten.

   Verboten und deshalb nirgends in dieser Datei:
   Farbverläufe als Hintergrund · Glasflächen mit Weichzeichner ·
   weiche graue Schlagschatten · rundum stark gerundete Kacheln ·
   Großbuchstaben-Etiketten · Emoji in Schaltflächen · Neon,
   Leuchten, animierte Sternenfelder.

   Inhalt
    1. Grundlage
    2. Bausteine: Überschriften, Haarlinien, Knöpfe
    3. Die Karte
    4. Sternbild und kompakte Zeile
    5. Startschirm
    6. Kopfzeile
    7. Das Feld: Sitzordnung
    8. Mitte und Stapel
    9. Vor dir und deine Hand
   10. Seitenleiste
   11. Fußleiste und Tutorleiste
   12. Fenster, Tabellen, Formentafel
   13. Schweber
   14. Mischen
   15. Der enge Tisch (1366 × 768 und darunter)
   16. Handy
   17. Bewegung aus
   18. Klauen und Zerstören (die eine auffällige Bewegung)
   ============================================================ */


/* ============================================================
   1. Grundlage
   ============================================================ */

/* Abgeleitete Hilfsmarken. Keine neuen Farben — nur bestehende
   Marken mit Deckkraft bzw. Vielfache von --raum. */
:root {
  --raum-halb:  calc(var(--raum) / 2);          /*  4px */
  --raum2:      calc(var(--raum) * 2);          /* 16px */
  --raum3:      calc(var(--raum) * 3);          /* 24px */
  --seite-b:    200px;                          /* Breite der Seitenleiste */
  --sitz-b:     clamp(176px, 15vw, 232px);      /* Breite der Seitenplaetze: sechs kleine Karten passen quer */
  --schleier:   color-mix(in srgb, var(--tisch-tief) 84%, transparent);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--tisch-tief);
  color: var(--schrift);
  font-family: var(--grotesk);
  font-size: var(--t-text);
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

/* Tastaturbedienung muss sichtbar sein — ein Rand, kein Leuchten. */
:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 2px;
}
:focus:not(:focus-visible) { outline: none; }

/* Der Tisch füllt das Fenster. Nichts scrollt als Ganzes; was nicht
   passt, scrollt in seiner eigenen Zone (Abschnitt 15). */
#tisch {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--seite-b);
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  /* Die Erzählerzeile ist im Normalfall leer und fällt dann auf 0 zusammen.
     Im Tutorial steht dort die Anweisung — ÜBER der Fußleiste, nicht statt
     ihrer: bestätigt wird auch im Tutorial mit dem Knopf unten. */
  grid-template-areas:
    "kopf   kopf"
    "feld   seite"
    "erz    erz"
    "leiste leiste";
  gap: var(--raum);
  height: 100vh;
  height: 100dvh;
  padding: var(--raum);
  background: var(--tisch);
  overflow: hidden;
}

#kopf        { grid-area: kopf; }
#feld        { grid-area: feld;  min-width: 0; min-height: 0; }
#seitenleiste{ grid-area: seite; min-width: 0; min-height: 0; }
#leiste      { grid-area: leiste; }
#erzaehler   { grid-area: erz; }

/* Es gibt keine Kästen um die Bereiche: Kopf, Plätze, Auslage, Hand
   und Seitenleiste bekommen nirgends einen Grund oder einen Rahmen.
   Getrennt wird durch Haarlinien und Abstand — die Tischfläche läuft
   durch. Einzige Ausnahme ist die Mitte (Abschnitt 8). */

/* Ruhige, schmale Rollbalken in Tischfarben. */
* { scrollbar-width: thin; scrollbar-color: var(--tisch-linie) transparent; }
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--tisch-linie); border-radius: var(--r-flaeche); }


/* ============================================================
   2. Bausteine: Überschriften, Haarlinien, Knöpfe
   ============================================================ */

/* Überschriften stehen in der Serife, in normaler Schreibweise.
   Keine Großbuchstaben-Etiketten, kein Kasten — nur eine Haarlinie. */
.bereich-titel {
  margin: 0 0 var(--raum);
  padding-bottom: var(--raum-halb);
  border-bottom: 1px solid var(--tisch-linie);
  font-family: var(--serif);
  font-weight: 500;
  font-size: var(--t-abschnitt);
  line-height: 1.2;
  letter-spacing: .01em;
  color: var(--schrift);
  display: flex;
  align-items: baseline;
  gap: var(--raum);
}

/* Die Nebenangabe hinter einer Überschrift („höchstens 2 nehmen"). */
.hinweis {
  margin-left: auto;
  font-family: var(--grotesk);
  font-size: var(--t-neben);
  font-weight: 400;
  color: var(--schrift-leise);
  text-align: right;
}

/* Platzhalter, wo noch nichts liegt. */
p.leer, li.leer {
  margin: 0;
  padding: var(--raum-halb) 0;
  font-family: var(--serif);
  font-size: var(--t-neben);
  font-style: italic;
  color: var(--schrift-leise);
  list-style: none;
}

/* ---------- Knöpfe: rechteckig, ohne Verlauf, ohne Leuchten ---------- */

.knopf {
  font-family: var(--grotesk);
  font-size: var(--t-neben);
  font-weight: 500;
  line-height: 1.2;
  color: var(--schrift);
  background: none;
  border: 1px solid var(--tisch-linie);
  border-radius: var(--r-flaeche);
  padding: var(--raum) calc(var(--raum) * 1.5);
  cursor: pointer;
  transition: background-color .12s linear, border-color .12s linear;
}
.knopf:hover  { background: var(--tisch-hoch); }
.knopf:active { background: var(--tisch-hoch); border-color: var(--schrift-leise); }

.knopf.haupt {
  background: var(--signal);
  border-color: var(--signal);
  color: var(--tisch-tief);
}
.knopf.haupt:hover  { background: var(--schrift); border-color: var(--schrift); }

.knopf.gefahr { border-color: var(--stern-heiss); color: var(--stern-heiss); }
.knopf.gefahr:hover { background: var(--stern-heiss); color: var(--papier); }

.knopf.klein  { padding: var(--raum-halb) var(--raum); }
.knopf.gross  { padding: calc(var(--raum) * 1.5) var(--raum3); font-size: var(--t-text); }

.knopf.link {
  border: 0;
  padding: var(--raum-halb) 0;
  color: var(--schrift-leise);
  background: none;
}
.knopf.link:hover { color: var(--schrift); text-decoration: underline; background: none; }

.knopf[disabled] { opacity: .38; cursor: not-allowed; }
.knopf[disabled]:hover { background: none; border-color: var(--tisch-linie); }


/* ============================================================
   3. Die Karte
   ------------------------------------------------------------
   Papier auf dunklem Grund: dunkler Rand ringsum, eine harte
   Kante darunter. Kein Schlagschatten. Aufbau als Spalte —
   oben das Sternbild, darunter die Ziffer.
   ============================================================ */

.karte {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  flex: 0 0 auto;
  width: var(--karte-b);
  height: var(--karte-h);
  padding: var(--raum-halb) 2px;
  background: var(--papier);
  color: var(--tinte);
  font-family: var(--serif);
  border: 1px solid rgba(0, 0, 0, .35);
  border-radius: var(--r-karte);
  box-shadow: 0 1px 0 rgba(0, 0, 0, .5);
  cursor: default;
  /* Einzige Bewegung an der Karte: die Lage. Klauen und Zerstören
     bringen später eine Klasse .fliegt mit, die hier andockt. */
  transition: transform .18s ease-out;
}

button.karte { cursor: pointer; }

/* Die Sterngrafik. Verhältnis rund 56 : 62 der Kartenfläche —
   groß genug, dass die Zacken zählbar bleiben. */
.karte-bild {
  display: block;
  width: calc(var(--karte-b) * .72);
  height: calc(var(--karte-h) * .57);
  flex: 0 0 auto;
  overflow: visible;
}
/* Kosmische Karten tragen statt der Ziffer einen Namen, der zwei
   Zeilen brauchen darf — dafür rückt das Bild etwas zusammen. */
.karte.kosmisch .karte-bild { height: calc(var(--karte-h) * .44); }

/* Die Ziffer unter dem Bild. Nie größer als ein knappes Drittel
   der Kartenhöhe, damit sie auf kleinen Karten nicht anstößt. */
.karte-wert {
  font-family: var(--serif);
  font-size: min(var(--t-karte), calc(var(--karte-h) * .3));
  line-height: 1;
  color: var(--tinte);
}

/* sterne.js zeichnet die Ziffer bei Zahlenkarten ins SVG selbst.
   Dann tritt das DOM-Element zurück, damit sie nicht doppelt steht. */
.karte-bild[data-zahl-im-bild="ja"] ~ .karte-wert { display: none; }

/* Kosmische Karten tragen keinen Zackenwert, sondern einen Namen.
   Das Emoji-Zeichen aus dem DOM entfällt — die Grafik trägt das. */
.karte.kosmisch .karte-zeichen { display: none; }
.karte .karte-name {
  font-family: var(--grotesk);
  /* „Sternschnuppe" ist das längste Wort auf einer Karte. Bei --t-neben brach
     es in „Ster nschnup pe" um. Die Schrift skaliert deshalb mit der Karte
     und bleibt klein genug, dass die Silben stimmen. */
  font-size: clamp(8px, calc(var(--karte-b) * .135), var(--t-neben));
  line-height: 1.1;
  text-align: center;
  color: var(--tinte-leise);
  max-width: 100%;
  overflow-wrap: anywhere;
  hyphens: auto;
}

/* Der Wert, den eine Sternschnuppe im Sternbild gerade vertritt. */
.karte-jokerwert {
  position: absolute;
  top: 2px;
  right: 3px;
  font-family: var(--serif);
  font-size: var(--t-neben);
  line-height: 1;
  color: var(--tinte-leise);
}

/* ---------- Zustände. Kein Leuchten, nur Papier und Ränder ---------- */

/* .spielbar ist die normale Karte — der Unterschied zu .tot trägt
   die Information. Deshalb steht hier bewusst nichts. */

.karte.tot {
  background: var(--papier-tief);
  color: var(--tinte-leise);
  cursor: not-allowed;
}
.karte.tot .karte-wert,
.karte.tot .karte-name { color: var(--tinte-leise); }
.karte.tot .karte-bild { opacity: .55; }

.karte.gewaehlt { transform: translateY(-10px); }

.karte.ziel        { border: 2px solid var(--signal); }
.karte.gefahr      { border: 1px solid var(--stern-heiss); }
.karte.joker-chance{ border: 1px dashed var(--gold); }

/* .frisch bleibt absichtlich ungestaltet: es blitzt nichts auf. */

/* Die Rückseite: gedämpftes Papier mit einer einzigen, sehr
   zurückhaltenden Schraffur. */
.karte.rueckseite {
  background: var(--papier-tief);
  overflow: hidden;
}
.karte.rueckseite::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: .10;
  background: repeating-linear-gradient(
    45deg,
    var(--tinte) 0 1px,
    transparent 1px 7px
  );
  pointer-events: none;
}

/* Eine Reihe Karten. */
.kartenreihe {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: var(--raum);
  min-width: 0;
}


/* ============================================================
   4. Sternbild und kompakte Zeile
   ============================================================ */

/* Karten im Sternbild sind kleiner — Verhältnis 2,5 : 3,5 bleibt.
   Überschrieben wird das Maß, nicht die Kartengestaltung. */
.sternbild {
  --karte-b: 40px;
  --karte-h: 56px;
  min-width: 0;
  padding: var(--raum-halb);
  border: 2px solid transparent;   /* Platz für den Goldrand, damit nichts springt */
  border-radius: var(--r-flaeche);
}

.sb-kopf {
  display: flex;
  align-items: baseline;
  gap: var(--raum-halb);
  margin-bottom: 3px;
}
.sb-typ {
  font-family: var(--serif);
  font-size: var(--t-neben);
  color: var(--schrift);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sb-punkte {
  margin-left: auto;
  font-family: var(--grotesk);
  font-size: var(--t-neben);
  font-weight: 500;
  color: var(--schrift-leise);
}

.sternbild .kartenreihe { gap: 3px; flex-wrap: nowrap; }

/* In einem Sternbild ist die einzige kosmische Karte die Sternschnuppe.
   Ihr Name brach auf den kleinen Karten in „Ster nsch nup" um — dort
   tragen das Zeichen und der vertretene Wert die Auskunft allein. */
.sternbild .karte-name { display: none; }

/* Zustände: die Ränder tragen die Information allein —
   kein Schloss, kein Häkchen. */
.sternbild.sicher     { border: 1px solid var(--gold); padding: calc(var(--raum-halb) + 1px); }
.sternbild.versiegelt { border: 2px solid var(--gold); padding: var(--raum-halb); }
.sternbild.versiegelt .sb-typ,
.sternbild.versiegelt .sb-punkte { color: var(--gold); }

/* Anfassbar, aber noch nicht gewählt: nur der Zeiger und eine Spur Papier
   beim Überfahren. Kein Rand — sonst stünde der halbe Tisch in Kästen. */
.sternbild.anklickbar        { cursor: pointer; }
.sternbild.anklickbar:hover  { background: var(--tisch-hoch); }
.sternbild.anklickbar:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }

.sternbild.ziel        { border: 2px solid var(--signal); cursor: pointer; }
.sternbild.gefahr      { border: 1px solid var(--stern-heiss); padding: calc(var(--raum-halb) + 1px); }
.sternbild.joker-chance{ border: 1px dashed var(--gold); padding: calc(var(--raum-halb) + 1px); }
.sternbild.ziel.gefahr { border: 2px solid var(--signal); padding: var(--raum-halb); }

/* Ein Wrack ist keine gültige Form mehr: null Punkte, nichts hervorgehoben. */
.sternbild[data-typ="WRACK"] .sb-typ,
.sternbild[data-typ="WRACK"] .sb-punkte { color: var(--schrift-leise); }
.sternbild[data-typ="WRACK"] .karte { opacity: .7; }

/* .frisch bleibt auch hier ungestaltet. */

.sternbilder {
  display: flex;
  flex-wrap: wrap;
  gap: var(--raum);
  min-width: 0;
}


/* ============================================================
   5. Startschirm
   ------------------------------------------------------------
   Ein Titelblatt auf der Nacht. Kein Sternenfeld, keine Bewegung.
   ============================================================ */

#startschirm {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--raum3);
  background: var(--tisch-tief);
  overflow: auto;
}
#startschirm[hidden] { display: none; }

/* Das animierte Sternenfeld entfällt ersatzlos (Verbot der Referenz).
   sterne.js hängt hier noch ein SVG ein — es wird nicht gezeigt. */
#start-himmel { display: none; }

#start-mitte {
  width: 100%;
  max-width: 420px;
  text-align: center;
}

#start-titel {
  margin: 0;
  font-family: var(--serif);
  font-weight: 400;
  font-size: var(--t-titel);
  line-height: 1.1;
  letter-spacing: .01em;
  color: var(--schrift);
}
#start-unter {
  margin: var(--raum-halb) 0 var(--raum3);
  font-family: var(--serif);
  font-size: var(--t-text);
  font-style: italic;
  color: var(--schrift-leise);
}

#start-knoepfe {
  display: flex;
  flex-direction: column;
  gap: var(--raum);
  padding-top: var(--raum2);
  border-top: 1px solid var(--tisch-linie);
}
#start-knoepfe[hidden] { display: none; }
#start-knoepfe .knopf { width: 100%; }

#btn-regeln-start { margin-top: var(--raum2); }

/* ---------- Zweite Ebene: gegen wen? ---------- */

#start-wahl {
  padding-top: var(--raum2);
  border-top: 1px solid var(--tisch-linie);
  text-align: left;
}
#start-wahl[hidden] { display: none; }

.wahl-titel {
  margin: 0 0 var(--raum2);
  font-family: var(--serif);
  font-weight: 400;
  font-size: var(--t-abschnitt);
  color: var(--schrift);
}

.wahl-gruppe {
  margin: 0 0 var(--raum2);
  padding: 0;
  border: 0;
  display: flex;
  align-items: center;
  gap: var(--raum);
}
.wahl-gruppe > legend {
  width: 6.5em;
  padding: 0;
  font-family: var(--serif);
  font-size: var(--t-text);
  color: var(--schrift-leise);
}

.wahl-knopf {
  font-family: var(--grotesk);
  font-size: var(--t-neben);
  color: var(--schrift-leise);
  background: none;
  border: 1px solid var(--tisch-linie);
  border-radius: var(--r-flaeche);
  padding: var(--raum-halb) var(--raum);
  min-width: calc(var(--raum) * 5);
  cursor: pointer;
}
.wahl-knopf:hover { background: var(--tisch-hoch); color: var(--schrift); }
.wahl-knopf.gewaehlt {
  border-color: var(--signal);
  color: var(--tisch-tief);
  background: var(--signal);
}

.wahl-name {
  display: flex;
  align-items: center;
  gap: var(--raum);
  margin-bottom: var(--raum2);
  font-family: var(--serif);
  color: var(--schrift-leise);
}
.wahl-name input[type="text"],
.modal-text input[type="text"] {
  flex: 1 1 auto;
  min-width: 0;
  font-family: var(--grotesk);
  font-size: var(--t-text);
  color: var(--schrift);
  background: var(--tisch);
  border: 1px solid var(--tisch-linie);
  border-radius: var(--r-flaeche);
  padding: var(--raum-halb) var(--raum);
}
.wahl-name input[type="text"]:focus,
.modal-text input[type="text"]:focus { border-color: var(--signal); outline: none; }

.wahl-fuss,
.wahl {
  display: flex;
  gap: var(--raum);
  align-items: center;
}
.wahl-fuss .knopf.gross { flex: 1 1 auto; }


/* ============================================================
   6. Kopfzeile
   ------------------------------------------------------------
   Links Runde und Zug, rechts der Punktestand. Kein Kasten,
   keine Pillen — nur eine Haarlinie darunter.
   ============================================================ */

#kopf {
  display: flex;
  align-items: baseline;
  gap: var(--raum2);
  padding-bottom: var(--raum);
  border-bottom: 1px solid var(--tisch-linie);
}

#kopf-runde {
  font-family: var(--serif);
  font-size: var(--t-abschnitt);
  color: var(--schrift-leise);
  white-space: nowrap;
}
#kopf-runde b {
  font-family: var(--grotesk);
  font-weight: 500;
  font-size: var(--t-text);
  color: var(--schrift);
}

#kopf-punkte {
  list-style: none;
  margin: 0 0 0 auto;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--raum2);
  min-width: 0;
}

.spieler-chip {
  display: flex;
  align-items: baseline;
  gap: var(--raum-halb);
  min-width: 0;
}
.chip-name {
  font-family: var(--serif);
  font-size: var(--t-text);
  color: var(--schrift-leise);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chip-punkte {
  font-family: var(--grotesk);
  font-weight: 500;
  font-size: var(--t-text);
  color: var(--schrift);
}
.spieler-chip.mensch .chip-name { color: var(--schrift); }
.spieler-chip.aktiv  .chip-name { color: var(--signal); }
.chip-himmel { font-size: var(--t-neben); color: var(--gold); }

#kopf-knoepfe {
  display: flex;
  gap: var(--raum-halb);
  flex: 0 0 auto;
}


/* ============================================================
   7. Das Feld: Sitzordnung
   ------------------------------------------------------------
   Du sitzt unten. Die Gegner liegen als Rasterfelder darum
   herum. Ein Platz ist kein Kasten: Name in Serife, Haarlinie
   darunter, darunter die Auslage.
   ============================================================ */

/*
   Sitzordnung wie am Tisch: die Gegner an den Rändern, die Mitte in der
   Mitte, du unten über die ganze Breite. Drei Gegner sitzen oben, links und
   rechts; zwei oben und links; einer nur oben. Alle Plätze sind immer zu
   sehen — es wird nichts auf- oder zugeklappt.

   Die eigene Auslage und die Hand spannen sich über alle Spalten. Sie standen
   früher in der Mittelspalte und begannen dadurch mitten im Bild.
*/
#feld {
  display: grid;
  grid-template-columns: var(--sitz-b) minmax(0, 1fr) var(--sitz-b);
  /* Die Mitte bekommt die dehnbare Zeile: sie füllt, was Gegner und Hand
     übrig lassen. */
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  grid-template-areas:
    "links oben   rechts"
    "links mitte  rechts"
    "ich   ich    ich"
    "hand  hand   hand";
  gap: var(--raum) var(--raum2);
  overflow: hidden;
  min-height: 0;
}

/* Die Sammelhülle verschwindet, die Tafeln werden selbst Rasterfelder. */
#gegner-bereich { display: contents; }

.gegner[data-sitz="oben"]   { grid-area: oben; }
.gegner[data-sitz="links"]  { grid-area: links; }
.gegner[data-sitz="rechts"] { grid-area: rechts; }
#mitte-bereich { grid-area: mitte; }
#ich-bereich   { grid-area: ich; }
#hand-bereich  { grid-area: hand; }

/* Ein Gegner: nur der Platz gegenüber, keine leeren Seitenspalten. */
#feld:has(#gegner-bereich[data-anzahl="1"]),
#feld:has(#gegner-bereich[data-anzahl="0"]),
#feld:not(:has(.gegner)) {
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas:
    "oben"
    "mitte"
    "ich"
    "hand";
}

/* Zwei Gegner: oben und links, die rechte Spalte entfällt. */
#feld:has(#gegner-bereich[data-anzahl="2"]) {
  grid-template-columns: var(--sitz-b) minmax(0, 1fr);
  grid-template-areas:
    "links oben"
    "links mitte"
    "ich   ich"
    "hand  hand";
}

/* ---------- Ein Platz ---------- */

.gegner {
  display: flex;
  flex-direction: column;
  gap: var(--raum-halb);
  min-width: 0;
  min-height: 0;
  /* Platz für den Rahmen des aktiven Platzes — sonst springt alles, sobald
     der Zug weitergeht. */
  padding: var(--raum-halb);
  border: 2px solid transparent;
  border-radius: var(--r-flaeche);
}

/* Die Karten eines Gegners sind klein: die Zacken müssen zählbar bleiben,
   mehr braucht man von fremder Auslage nicht. */
.gegner { --g-karte-b: 30px; --g-karte-h: 42px; }
/* Seitenplätze sind schmaler als der Platz gegenüber. Ein Drache mit sechs
   Karten muss auch dort in eine Reihe passen, ohne abgeschnitten zu werden. */
.gegner[data-sitz="links"],
.gegner[data-sitz="rechts"] { --g-karte-b: 26px; --g-karte-h: 36px; }
.gegner .sternbild { --karte-b: var(--g-karte-b); --karte-h: var(--g-karte-h); }

.gegner-kopf {
  display: flex;
  align-items: baseline;
  gap: var(--raum);
  padding-bottom: 3px;
  border-bottom: 1px solid var(--tisch-linie);
}
.gegner-name {
  font-family: var(--serif);
  font-size: var(--t-text);
  color: var(--schrift-leise);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* Die Handkarten des Gegners: verdeckte Blättchen, daneben die Zahl.
   Winzig — sie sind eine Mengenangabe, kein Spielmaterial. */
.gegner-hand {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.mini-faecher { display: flex; gap: 1px; }
.mini-rueck {
  width: 7px;
  height: 10px;
  background: var(--papier-tief);
  border: 1px solid rgba(0, 0, 0, .35);
  border-radius: 1px;
}
.gegner-hand-zahl {
  font-family: var(--grotesk);
  font-size: var(--t-neben);
  color: var(--schrift-leise);
  font-variant-numeric: tabular-nums;
}

.gegner-punkte {
  font-family: var(--grotesk);
  font-weight: 500;
  font-size: var(--t-neben);
  color: var(--schrift);
}

/* Wer am Zug ist, muss auf einen Blick zu sehen sein: der ganze Platz bekommt
   einen Rahmen in Signalfarbe und einen helleren Grund. Ein Balken an der
   linken Kante allein hat man übersehen. Es blinkt nichts. */
.gegner.aktiv {
  border-color: var(--signal);
  background: var(--tisch-hoch);
}
.gegner.aktiv .gegner-name { color: var(--signal); }
.gegner-dran {
  font-family: var(--grotesk);
  font-size: calc(var(--t-neben) - 1px);
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--signal);
  white-space: nowrap;
}

/* Die Auslage eines Gegners scrollt in sich selbst — der Tisch
   wächst nie über seinen Platz hinaus. */
.gegner .sternbilder {
  min-height: 0;
  overflow: auto;
  padding-right: 2px;
}

/* Seitenplätze: eine Spalte. Oben: eine Reihe, die umbrechen darf. */
.gegner[data-sitz="links"] .sternbilder,
.gegner[data-sitz="rechts"] .sternbilder {
  flex-direction: column;
  flex-wrap: nowrap;
  gap: var(--raum-halb);
}
.gegner[data-sitz="oben"] .sternbilder {
  flex-direction: row;
  flex-wrap: wrap;
  gap: var(--raum-halb) var(--raum2);
  /* An derselben Kante wie der Name darüber. Zentriert stünde die Auslage
     216 px weiter rechts als ihre eigene Überschrift. */
  justify-content: flex-start;
  /* Obergrenze: was nicht hineinpasst, scrollt hier — der Platz
     gegenüber darf die Mitte nicht nach unten drücken. Zwei Reihen
     kleiner Sternbilder passen immer. */
  max-height: calc(var(--g-karte-h) * 2 + var(--t-neben) * 4 + var(--raum) * 5);
}


/* ============================================================
   8. Mitte und Stapel
   ------------------------------------------------------------
   Die Mitte ist die EINZIGE abgesetzte Fläche des Tisches.
   ============================================================ */

/*
   Die Mitte wächst mit dem Inhalt. Sie reserviert keine Höhe: fünf Karten
   brauchen eine Reihe, zwölf brauchen zwei, und darunter bleibt in beiden
   Fällen derselbe Abstand zu „Vor dir". Dass die Fläche von Runde zu Runde
   sichtbar größer wird, gehört zum Spiel — die Mitte füllt sich ja wirklich.
   Nach oben begrenzt sie der Platz, den das Raster ihr lässt; erst dann
   scrollt die Kartenreihe in sich.
*/
#mitte-bereich {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: var(--raum);
  background: var(--tisch-hoch);
  border-radius: var(--r-flaeche);
}

#mitte-zeile {
  display: flex;
  align-items: flex-start;
  gap: var(--raum2);
  min-height: 0;
}

#mitte-karten {
  flex: 1 1 auto;
  min-width: 0;
  /* Genau eine Kartenreihe als Mindestmaß — das verhindert das Springen
     beim Umbruch, reserviert aber keinen leeren Platz darüber hinaus. */
  min-height: var(--karte-h);
  overflow-y: auto;
  align-content: flex-start;
}

/* Die Nova liegt neben der Mitte, nicht darin: mehr Abstand und ein
   hellerer Kartenumriss. Kein Leuchten, keine zweite Fläche. */
.karte.nova-karte {
  margin-left: var(--raum3);
  border-color: var(--tinte-leise);
}

/* Rechts, durch eine Haarlinie getrennt: die beiden Stapel. */
#stapel {
  flex: 0 0 auto;
  display: flex;
  gap: var(--raum2);
  padding-left: var(--raum2);
  border-left: 1px solid var(--tisch-linie);
  align-self: stretch;
}

.stapel {
  position: relative;
  width: var(--karte-b);
  /* Höhe der Karte plus die vier angedeuteten Blätter (je 2 px
     Versatz) plus die Beschriftung darunter. */
  padding-bottom: calc(var(--t-abschnitt) * 1.2 + var(--t-neben) * 1.2);
  height: calc(var(--karte-h) + var(--raum) + var(--t-abschnitt) * 1.2 + var(--t-neben) * 1.2);
}

/* Die angedeuteten Blätter darunter: je tiefer, desto weiter versetzt. */
.stapel-blatt {
  position: absolute;
  left: 0;
  top: calc(var(--tiefe) * 2px);
  width: var(--karte-b);
  height: var(--karte-h);
  background: var(--papier-tief);
  border: 1px solid rgba(0, 0, 0, .35);
  border-radius: var(--r-karte);
}

.stapel-oben { position: relative; z-index: 1; }

.stapel-leer {
  width: var(--karte-b);
  height: var(--karte-h);
  border: 1px dashed var(--tisch-linie);
  border-radius: var(--r-karte);
}

/*
   Die Zahl trägt die Auskunft, das Wort steht klein darunter — nebeneinander
   passten beide nie in die Kartenbreite und der Name wurde abgeschnitten.
   Abgeschnittener Text darf nirgends vorkommen.
*/
.stapel-fuss {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column-reverse;   /* Zahl oben, Wort darunter */
  align-items: center;
  line-height: 1.15;
  font-family: var(--grotesk);
  color: var(--schrift-leise);
}
.stapel-name {
  font-size: calc(var(--t-neben) - 2px);
  white-space: nowrap;
}
.stapel-zahl {
  font-size: var(--t-abschnitt);
  font-weight: 500;
  color: var(--schrift);
  font-variant-numeric: tabular-nums;
}
.stapel[data-anzahl="0"] .stapel-zahl { color: var(--schrift-leise); }


/* ============================================================
   9. Vor dir und deine Hand
   ------------------------------------------------------------
   Zwei Zonen, getrennt durch eine Haarlinie. Kein Kasten.
   ============================================================ */

/* Bist du dran, bekommt dein Bereich denselben Rahmen wie ein aktiver
   Gegnerplatz — die Hervorhebung wandert sichtbar um den Tisch. Deine beiden
   Zonen gehören zusammen: oben gerahmt, unten offen, damit sie als ein Feld
   gelesen werden. */
#ich-bereich, #hand-bereich {
  border: 2px solid transparent;
  padding-left: var(--raum);
  padding-right: var(--raum);
  border-radius: var(--r-flaeche);
}
#ich-bereich.aktiv {
  border-color: var(--signal);
  border-bottom-color: transparent;
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
  background: var(--tisch-hoch);
}
#hand-bereich.aktiv {
  border-color: var(--signal);
  border-top-color: transparent;
  border-top-left-radius: 0;
  border-top-right-radius: 0;
  background: var(--tisch-hoch);
}

/* „Du bist am Zug" — steht in der Überschrift deiner Auslage, in derselben
   Signalfarbe wie der Rahmen. */
.dran-marke {
  font-family: var(--grotesk);
  font-size: var(--t-neben);
  font-weight: 500;
  letter-spacing: .04em;
  color: var(--tisch-tief);
  background: var(--signal);
  border-radius: var(--r-flaeche);
  padding: 2px var(--raum);
  white-space: nowrap;
}
.dran-marke[hidden] { display: none; }

/* ---------- Karten in den Regeln ----------
   Jede erklärte Karte steht daneben, wie sie im Spiel aussieht. Kleiner als
   auf dem Tisch, aber dieselbe Zeichnung — sonst lernt man ein Bild und sieht
   im Spiel ein anderes. */
.regel-karte {
  --karte-b: 40px;
  --karte-h: 56px;
  display: inline-flex;
  vertical-align: middle;
  margin-right: var(--raum);
}
.regel-karte-zelle { white-space: nowrap; }
.regel-formen { margin-top: var(--raum2); }

/* Die beiden Nebenwege unter dem Startschirm, untereinander und ruhig. */
#start-fuss {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

#ich-bereich {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding-top: var(--raum-halb);
}

/* Die eigene Auslage bleibt eine Reihe und schiebt sich waagerecht,
   wenn viele Sternbilder liegen — so bleibt die Höhe berechenbar. */
#meine-sternbilder {
  flex-wrap: nowrap;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 2px;
  min-height: 0;
}
#meine-sternbilder .sternbild { flex: 0 0 auto; }

#hand-bereich {
  display: flex;
  flex-direction: column;
  padding-top: var(--raum);
  border-top: 1px solid var(--tisch-linie);
}
#hand-bereich .bereich-titel {
  border-bottom: 0;
  margin-bottom: var(--raum-halb);
  padding-bottom: 0;
}

/* Die Hand beginnt an derselben Kante wie die Auslage darüber — beide
   gehören zu dir und sollen als eine Einheit gelesen werden. Mittig
   zentriert wirken vier Karten wie ein eigener, verlorener Block. */
.kartenreihe.hand {
  flex-wrap: nowrap;
  justify-content: flex-start;
  min-height: var(--karte-h);
  padding-top: 10px;              /* Platz für .gewaehlt (-10px) */
}
.kartenreihe.hand:has(.karte:nth-child(9)) .karte + .karte {
  margin-left: calc(var(--karte-b) * -.22);
}
.kartenreihe.hand:has(.karte:nth-child(13)) .karte + .karte {
  margin-left: calc(var(--karte-b) * -.40);
}
/* Die gewählte Karte steht vorn, damit die Überlappung nichts verdeckt. */
.kartenreihe.hand .karte.gewaehlt { z-index: 2; }
.kartenreihe.hand .karte:hover     { z-index: 1; }


/* ============================================================
   10. Seitenleiste
   ------------------------------------------------------------
   Überschriften in der Serife, Haarlinie darunter, Listen ohne
   Kästen.
   ============================================================ */

#seitenleiste {
  display: flex;
  flex-direction: column;
  gap: var(--raum);
  min-height: 0;
  padding-left: var(--raum2);
  border-left: 1px solid var(--tisch-linie);
  overflow: hidden;
}
#seitenleiste .bereich-titel { margin-bottom: var(--raum-halb); }

#tipps {
  list-style: none;
  margin: 0;
  padding: 0;
  flex: 0 1 auto;
  min-height: 0;
  overflow-y: auto;
}
.tipp {
  display: flex;
  align-items: baseline;
  gap: var(--raum);
  padding: 3px 0;
  font-size: var(--t-neben);
  color: var(--schrift-leise);
  cursor: pointer;
}
.tipp-text { flex: 1 1 auto; min-width: 0; }
.tipp-punkte {
  flex: 0 0 auto;
  font-family: var(--grotesk);
  font-weight: 500;
  color: var(--schrift);
}
.tipp:hover, .tipp.aktiv { color: var(--signal); }

#protokoll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
}
.log-zeile {
  margin: 0 0 3px;
  font-size: var(--t-neben);
  line-height: 1.35;
  color: var(--schrift-leise);
}
.log-zeile:last-child { color: var(--schrift); }
.log-zeile.rundenwechsel {
  margin: var(--raum) 0 var(--raum-halb);
  padding-top: var(--raum-halb);
  border-top: 1px solid var(--tisch-linie);
  font-family: var(--serif);
  color: var(--schrift);
}

/* Im Tutorial stört die Zugliste — der Text unten führt. */
#tisch.tutorial #tipps { display: none; }


/* ============================================================
   11. Fußleiste und Tutorleiste
   ============================================================ */

#leiste {
  display: flex;
  align-items: center;
  gap: var(--raum2);
  padding-top: var(--raum);
  border-top: 1px solid var(--tisch-linie);
  min-height: 0;
}
#leiste-text {
  flex: 1 1 auto;
  min-width: 0;
  font-family: var(--serif);
  font-size: var(--t-text);
  color: var(--schrift-leise);
}
/* Eine kurze Fehlermeldung. Sie wechselt die Farbe, sie blinkt nicht. */
#leiste-text.warnung { color: var(--stern-heiss); }

/* Was ein Gegner gerade getan hat: hell, damit man es im Vorbeigehen liest. */
#leiste-text.ist-zug { color: var(--schrift); }
/* Warum der gewählte Zug nicht geht: dieselbe Farbe wie eine Warnung. */
#leiste-text.ist-fehler { color: var(--stern-heiss); }

#leiste-knoepfe {
  flex: 0 0 auto;
  display: flex;
  gap: var(--raum);
  flex-wrap: wrap;
  justify-content: flex-end;
}


/* ---------- Der Erzähler ----------
   Eine Kartenrückseite führt durch das Tutorial. Zwei Lagen:
   „buehne" mittig auf abgedunkeltem Grund, solange nur erzählt
   wird; „dock" unten an der Stelle der Fußleiste, sobald der
   Tisch dran ist. In beiden Lagen ist die Anweisung groß —
   klein am Rand hat man sie überlesen. */

/* Versteckt schlägt jede Lage. Ohne !important gewinnt die spätere Regel
   #erzaehler[data-modus="buehne"] (gleiche Spezifität) und der Erzähler
   stünde auch außerhalb des Tutorials auf dem Tisch. */
#erzaehler[hidden] { display: none !important; }
/* Die Fußleiste bleibt im Tutorial sichtbar — dort steht der Bestätigen-Knopf.
   Nur solange der Erzähler mittig auf der Bühne steht, hat sie nichts zu
   sagen: dann liegt der Tisch still. */
#tisch:has(#erzaehler[data-modus="buehne"]:not([hidden])) #leiste { display: none; }

.erz-kasten {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--raum2);
}

.erz-karte {
  /* Die Rückseite selbst: dieselbe Karte wie im Spiel, nur größer.
     Die Maße stehen hier, damit der Erzähler unabhängig vom Tisch bleibt. */
  --karte-b: 62px;
  --karte-h: 87px;
  /* Wie hell der Schein gerade ist. Die Oberfläche setzt den Wert bei jedem
     Sprechblip kurz hoch und lässt ihn danach auf den Ruhewert zurück. */
  --schein: .35;
  flex: 0 0 auto;
  transform-origin: 50% 100%;
  /* Warmes Sternenlicht — derselbe Gelbton wie die Karten der mittleren
     Reihe. Kein Rahmen: drei weiche Ringe, die nach außen auslaufen. */
  box-shadow:
    0 1px 0 rgba(0, 0, 0, .5),
    0 0 calc(10px + var(--schein) * 8px) rgba(217, 160, 43, calc(var(--schein) * .55)),
    0 0 calc(26px + var(--schein) * 20px) rgba(217, 160, 43, calc(var(--schein) * .30)),
    0 0 calc(54px + var(--schein) * 34px) rgba(217, 160, 43, calc(var(--schein) * .16));
  transition: box-shadow 110ms ease-out;
}

/* Wippen, während gesprochen wird. Zurückgenommen auf ein Grad, seit der
   Schein die Arbeit macht — beides zusammen war zu unruhig. */
@keyframes erz-wippen {
  0%   { transform: rotate(-1deg) translateY(0); }
  50%  { transform: rotate(1deg) translateY(-2px); }
  100% { transform: rotate(-1deg) translateY(0); }
}
.erz-karte.spricht { animation: erz-wippen 2.1s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  .erz-karte.spricht { animation: none; }
}

.erz-inhalt { min-width: 0; }

.erz-schritt {
  font-family: var(--grotesk);
  font-size: var(--t-neben);
  color: var(--schrift-leise);
  margin-bottom: var(--raum-halb);
}
.erz-schritt:empty { display: none; }

/* Die Anweisung. Groß, in der Serife, in Signalfarbe. */
.erz-text {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(18px, 2.2vw, 26px);
  line-height: 1.4;
  color: var(--signal);
  /* Der Text wächst beim Tippen. Ohne Mindesthöhe springt der Kasten. */
  min-height: 2.8em;
}

/* Das Warum steht kleiner darunter — es erklärt, es fordert nicht. */
.erz-warum {
  margin: var(--raum) 0 0;
  font-family: var(--grotesk);
  font-size: var(--t-neben);
  line-height: 1.5;
  color: var(--schrift-leise);
  max-width: 68ch;
}
.erz-warum:empty { display: none; }

.erz-knoepfe {
  display: flex;
  flex-direction: column;
  gap: var(--raum);
  align-items: stretch;
}
.erz-knoepfe .knopf[hidden] { display: none; }

/* ---- Lage „buehne": mittig, der Tisch tritt zurück ---- */
#erzaehler[data-modus="buehne"] {
  position: fixed;
  inset: 0;
  z-index: 45;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--raum3);
  background: var(--schleier);
}
#erzaehler[data-modus="buehne"] .erz-kasten {
  width: min(760px, 100%);
  padding: var(--raum3);
  background: var(--tisch);
  border: 1px solid var(--tisch-linie);
  border-radius: var(--r-flaeche);
}
#erzaehler[data-modus="buehne"] .erz-text { min-height: 4.2em; }

/* ---- Lage „dock": unten über der Fußleiste ---- */
#erzaehler[data-modus="dock"] {
  grid-area: erz;
  position: static;
  background: none;
  padding: var(--raum) 0 0;
  border-top: 1px solid var(--tisch-linie);
}
/* Im Tutorial ist die Erzählerzeile das Wichtigste — die Mitte gibt Platz ab.
   Die Vorschlagsliste bleibt aus (sie würde die Aufgabe beantworten). */
#tisch.tutorial #feld { min-height: 0; }


/* ============================================================
   12. Fenster, Tabellen, Formentafel
   ============================================================ */

#modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--raum3);
  background: var(--schleier);
  overflow: auto;
}
#modal[hidden] { display: none; }

.modal-kasten {
  position: relative;
  width: 100%;
  max-width: 620px;
  max-height: 86vh;
  overflow: auto;
  padding: var(--raum3);
  background: var(--tisch);
  border: 1px solid var(--tisch-linie);
  border-radius: var(--r-flaeche);
}

.modal-zu {
  position: absolute;
  top: var(--raum);
  right: var(--raum);
  width: var(--raum3);
  height: var(--raum3);
  font-family: var(--grotesk);
  font-size: var(--t-abschnitt);
  line-height: 1;
  color: var(--schrift-leise);
  background: none;
  border: 0;
  border-radius: var(--r-flaeche);
  cursor: pointer;
}
.modal-zu:hover { color: var(--schrift); background: var(--tisch-hoch); }
#modal.pflicht .modal-zu { display: none; }

.modal-titel {
  margin: 0 0 var(--raum2);
  padding-bottom: var(--raum);
  border-bottom: 1px solid var(--tisch-linie);
  font-family: var(--serif);
  font-weight: 400;
  font-size: var(--t-abschnitt);
  color: var(--schrift);
}
.modal-text { color: var(--schrift-leise); }
.modal-text > :first-child { margin-top: 0; }
.modal-text p  { margin: 0 0 var(--raum); max-width: 62ch; }
.modal-text b  { color: var(--schrift); font-weight: 500; }
.modal-text h3 {
  margin: var(--raum2) 0 var(--raum-halb);
  font-family: var(--serif);
  font-weight: 500;
  font-size: var(--t-text);
  color: var(--schrift);
}
.modal-text ol, .modal-text ul { margin: 0 0 var(--raum); padding-left: var(--raum3); }
.modal-text li { margin-bottom: var(--raum-halb); }
.modal-text label {
  display: inline-flex;
  align-items: center;
  gap: var(--raum-halb);
  margin-right: var(--raum2);
}
.modal-text input[type="radio"] { accent-color: var(--signal); }
.modal-text label:has(input:checked) { color: var(--schrift); }
.modal-fuss {
  margin: var(--raum2) 0 0;
  padding-top: var(--raum);
  border-top: 1px solid var(--tisch-linie);
  font-size: var(--t-neben);
  color: var(--schrift-leise);
}
.modal-knoepfe {
  display: flex;
  gap: var(--raum);
  justify-content: flex-end;
  margin-top: var(--raum3);
}

/* ---------- Tabellen ---------- */

.modal-inhalt table { width: 100%; border-collapse: collapse; }
.modal-inhalt th, .modal-inhalt td {
  padding: var(--raum-halb) var(--raum);
  border-bottom: 1px solid var(--tisch-linie);
  text-align: left;
}
table.stand th {
  font-family: var(--serif);
  font-weight: 500;
  font-size: var(--t-neben);
  color: var(--schrift-leise);
}
table.stand td { font-family: var(--serif); color: var(--schrift-leise); }
table.stand td.zahl, table.stand th.zahl {
  font-family: var(--grotesk);
  text-align: right;
  white-space: nowrap;
}
table.stand td.gesamt { font-weight: 500; color: var(--schrift); }
table.stand tr.ich td { color: var(--schrift); }
table.stand tr.sieger td { color: var(--gold); }
table.stand tr:last-child td { border-bottom: 0; }

table.regel-tabelle td {
  font-size: var(--t-neben);
  vertical-align: top;
}
table.regel-tabelle td:first-child { font-family: var(--serif); color: var(--schrift); }
table.regel-tabelle td:last-child  { text-align: right; font-family: var(--grotesk); white-space: nowrap; }
table.regel-tabelle tr:last-child td { border-bottom: 0; }

/* ---------- Formentafel ---------- */

.formentafel { display: flex; flex-direction: column; }
.form-zeile {
  --karte-b: 40px;
  --karte-h: 56px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--raum-halb) var(--raum2);
  align-items: center;
  padding: var(--raum) 0;
  border-bottom: 1px solid var(--tisch-linie);
}
.form-zeile:last-child { border-bottom: 0; }
.form-kopf { grid-column: 1; display: flex; align-items: baseline; gap: var(--raum); }
.form-name { font-family: var(--serif); font-size: var(--t-text); color: var(--schrift); }
.form-regel { font-size: var(--t-neben); color: var(--schrift-leise); }
.form-beispiel { grid-column: 1; gap: 3px; }
.form-punkte {
  grid-column: 2;
  grid-row: 1 / span 2;
  font-family: var(--grotesk);
  font-size: var(--t-neben);
  color: var(--schrift-leise);
  white-space: nowrap;
}


/* ============================================================
   13. Schweber
   ------------------------------------------------------------
   Der Erklärkasten beim Überfahren. Erscheint ohne Animation.
   ============================================================ */

.schweber {
  position: fixed;
  z-index: 60;
  max-width: 30ch;
  padding: var(--raum-halb) var(--raum);
  background: var(--tisch-hoch);
  color: var(--schrift);
  border: 1px solid var(--tisch-linie);
  border-radius: var(--r-flaeche);
  font-family: var(--grotesk);
  font-size: var(--t-neben);
  line-height: 1.35;
  pointer-events: none;
}
.schweber[hidden] { display: none; }


/* ============================================================
   14. Mischen
   ------------------------------------------------------------
   Deutlich zurückgenommen: kein Weichzeichner, kein Leuchten,
   Papierkarten statt bunter Rücken, kurz und ruhig. Der Klau
   soll die auffälligste Bewegung im Spiel bleiben.
   ============================================================ */

.mischen {
  position: fixed;
  inset: 0;
  z-index: 55;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--raum2);
  background: var(--schleier);
}
.mischen.weg { opacity: 0; transition: opacity .2s linear; }

.mischen-wolke {
  position: relative;
  width: var(--karte-b);
  height: var(--karte-h);
}
.mischen-karte {
  position: absolute;
  inset: 0;
  animation: mischen-ein .5s ease-out var(--verzug, 0ms) both;
}
@keyframes mischen-ein {
  from { transform: translate(var(--von-x, 0), var(--von-y, 0)); }
  to   { transform: translate(0, 0); }
}
/* Die Drehung aus ansicht.js wird bewusst nicht benutzt —
   gefächerte, kreiselnde Karten wären zu auffällig. */

.mischen-text {
  font-family: var(--serif);
  font-size: var(--t-text);
  color: var(--schrift-leise);
}


/* ============================================================
   15. Der enge Tisch
   ------------------------------------------------------------
   Prüffall: 1366 × 768, Runde 8, vier Spieler. Ohne Scrollen
   spielbar. Vorrang haben Mitte und eigene Hand; die Gegner-
   plätze werden schmaler. Karten schrumpfen im Verhältnis
   2,5 : 3,5, indem --karte-b und --karte-h gemeinsam kleiner
   gesetzt werden — die Kartengestaltung selbst bleibt gleich.

   Umschaltpunkt für die kompakte Gegneransicht: die Oberfläche
   soll data-ansicht="kompakt" setzen, sobald das Fenster höchstens
   800 px hoch ist ODER mehr als ein Gegner am Tisch sitzt. Grund:
   bei 40 px Kartenbreite ist der Stern noch 29 px breit und zwölf
   Zacken sind zählbar — darunter nicht mehr. Genau ab da trägt die
   Zeile die Auskunft, und der Goldrand sagt sicher oder versiegelt.

   Die eigene Auslage schrumpft dabei später als die der Gegner:
   die eigenen Sternbilder muss man lesen können.
   ============================================================ */

/* Etwas weniger Höhe: Karten leicht kleiner, Seitenleiste schmaler. */
@media (max-height: 880px), (max-width: 1440px) {
  :root {
    --karte-b: 68px;
    --karte-h: 95px;
    --seite-b: 190px;
  }
}

/* Der Prüffall. Bei 768 px Bildschirmhöhe bleiben rund 640 px
   Fensterhöhe: Mitte 1fr, Auslage und Hand fest. */
@media (max-height: 800px) {
  :root {
    --karte-b: 60px;
    --karte-h: 84px;
    --sitz-b: clamp(168px, 14vw, 200px);
  }
  #tisch { gap: var(--raum-halb); padding: var(--raum-halb) var(--raum); }
  #feld  { gap: var(--raum-halb) var(--raum2); }
  .bereich-titel { margin-bottom: var(--raum-halb); font-size: var(--t-text); }
  #mitte-bereich { padding: var(--raum-halb) var(--raum); }
  #hand-bereich  { padding-top: var(--raum-halb); }
  /* Nur die Gegnerauslage schrumpft — dort genügt es zu erkennen,
     was jemand hat. Die eigene bleibt bei 40 × 56. */
  .gegner .sternbild { --karte-b: 34px; --karte-h: 48px; }
}

/* Noch flacher (Notebook mit viel Browserleiste). */
@media (max-height: 700px) {
  :root { --karte-b: 54px; --karte-h: 76px; }
  .gegner .sternbild { --karte-b: 30px; --karte-h: 42px; }
  #meine-sternbilder .sternbild { --karte-b: 34px; --karte-h: 48px; }
}

/* Schmaler als 1000 px: die Seitenleiste rutscht unter das Feld. */
@media (max-width: 1000px) {
  #tisch {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas:
      "kopf"
      "feld"
      "seite"
      "leiste";
  }
  #seitenleiste {
    max-height: 24vh;
    padding: var(--raum) 0 0;
    border-left: 0;
    border-top: 1px solid var(--tisch-linie);
  }
}


/* ============================================================
   16. Handy — schmaler als 720 px
   ------------------------------------------------------------
   Auf dem Handy geht die Rechnung von Abschnitt 15 nicht mehr
   auf: der Inhalt passt nicht in eine Fensterhöhe. Vorher stand
   #tisch auf 100dvh mit overflow: hidden, und #feld gab der Mitte
   eine minmax(0, 1fr)-Zeile. Die wurde auf 20 px zusammen-
   gedrückt; die Kartenreihe der Mitte ragte aus ihrer Zeile
   heraus und legte sich über „Vor dir" und „Deine Hand".
   Dazu schlugen die Sitzordnungs-Regeln aus Abschnitt 7
   (#feld:has(#gegner-bereich[data-anzahl="1" bzw. "2"])) durch
   diese Medienabfrage hindurch — sie wiegen zwei Kennungen
   schwer, die Medienabfrage ändert daran nichts. Bei einem und
   bei zwei Gegnern stand das Feld auf 380 px also weiter in drei
   Spalten.

   Deshalb hier: aus beiden Rastern wird eine einfache Spalte
   (display: flex). Damit kann keine Rasterzeile einen Bereich
   mehr kleiner machen als seinen Inhalt, und die grid-Angaben
   aus Abschnitt 7 laufen wirkungslos ins Leere. Der Bildschirm
   darf senkrecht scrollen — das ist auf dem Handy normal und
   allemal besser als Überlappung.

   Reihenfolge von oben nach unten: Kopfzeile · Gegner · Mitte ·
   Vor dir · Deine Hand · Seitenleiste · Fußleiste. Die Seiten-
   leiste steht vor der Fußleiste und nicht dahinter: die
   Fußleiste klebt am unteren Rand, alles hinter ihr läge beim
   Scrollen unter ihr. Als letztes Kind deckt sie nichts dauerhaft
   zu — am Ende der Seite steht sie an ihrem eigenen Platz.
   ============================================================ */

@media (max-width: 720px) {
  :root {
    /* Karten kleiner, Verhältnis 2,5 : 3,5 bleibt. */
    --karte-b: 46px;
    --karte-h: 64px;
    /* Eine Stufe kleiner: auf 380 px nahmen Kopfzeile und
       Überschriften sonst ein Drittel der Fläche ein. */
    --t-abschnitt: 15px;
    --t-text:      14px;
    --t-neben:     12px;
  }

  /* Die Seite scrollt als Ganzes. */
  html, body { height: auto; }

  #tisch {
    display: flex;
    flex-direction: column;
    gap: var(--raum-halb);
    height: auto;
    min-height: 100vh;
    min-height: 100dvh;
    padding: var(--raum-halb) var(--raum-halb) 0;
    overflow: visible;
  }
  #tisch > * { min-width: 0; }

  /* Aus der Sitzordnung wird eine Spalte. #gegner-bereich ist
     display: contents — die Plätze stehen also selbst in der
     Spalte, in DOM-Reihenfolge untereinander. */
  #feld {
    display: flex;
    flex-direction: column;
    gap: var(--raum-halb);
    flex: 1 0 auto;      /* schiebt die Fußleiste nach unten, wenn wenig liegt */
    min-height: 0;
    overflow: visible;
  }

  /* Kein Bereich deckelt sich mehr selbst: was da ist, wird
     gezeigt, und der Bildschirm scrollt. */
  .gegner .sternbilder { overflow: visible; }
  .gegner[data-sitz="oben"] .sternbilder { max-height: none; }
  .gegner[data-ansicht="kompakt"] .sternbilder { flex-direction: column; }
  #mitte-karten { overflow: visible; }

  .sternbild { --karte-b: 28px; --karte-h: 39px; }

  #mitte-zeile { flex-direction: column; gap: var(--raum); }
  #stapel {
    align-self: stretch;
    padding: var(--raum) 0 0;
    border-left: 0;
    border-top: 1px solid var(--tisch-linie);
  }

  /* Die Hand schiebt sich waagerecht, statt sich zu stapeln:
     jede Karte bleibt 46 px breit und damit zu treffen. */
  .kartenreihe.hand { overflow-x: auto; padding-bottom: var(--raum-halb); }
  .kartenreihe.hand:has(.karte:nth-child(9)) .karte + .karte,
  .kartenreihe.hand:has(.karte:nth-child(13)) .karte + .karte { margin-left: 0; }

  #kopf { flex-wrap: wrap; align-items: center; gap: var(--raum); }
  #kopf-punkte { order: 3; width: 100%; margin-left: 0; gap: var(--raum); }

  /* Beiwerk: Zugliste und Protokoll stehen unter dem Spiel. Das
     Protokoll wächst über acht Runden — es scrollt in sich. */
  #seitenleiste {
    max-height: none;
    overflow: visible;
    padding: var(--raum) 0 0;
    border-left: 0;
    border-top: 1px solid var(--tisch-linie);
  }
  #tipps     { flex: 0 0 auto; overflow: visible; }
  #protokoll { flex: 0 0 auto; max-height: 40vh; }

  /* Die Fußleiste klebt unten: den Zug bestätigt man, ohne zu
     scrollen. Sie liegt auf der Tischfarbe, sonst schiene der
     Text darunter durch — ein Kasten wird sie dadurch nicht,
     getrennt wird weiter durch die Haarlinie. */
  #leiste,
  #erzaehler[data-modus="dock"] {
    position: sticky;
    bottom: 0;
    z-index: 5;
    margin: 0 calc(var(--raum-halb) * -1);
    padding: var(--raum-halb);
    background: var(--tisch);
    border-top: 1px solid var(--tisch-linie);
  }
  #leiste { flex-wrap: wrap; gap: var(--raum-halb) var(--raum); }
  #leiste-knoepfe { width: 100%; justify-content: stretch; }
  #leiste-knoepfe .knopf { flex: 1 1 auto; min-width: 0; }

  /* Der Erzähler in eine Spalte: neben Karte und Knopf blieben für die
     Anweisung sonst 190 px, und sie stünde in einer Schlucht. */
  .erz-kasten {
    grid-template-columns: auto minmax(0, 1fr);
    gap: var(--raum) var(--raum2);
    align-items: start;
  }
  .erz-karte { --karte-b: 42px; --karte-h: 59px; }
  .erz-inhalt { grid-column: 2; }
  .erz-knoepfe {
    grid-column: 1 / -1;
    flex-direction: row;
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  .erz-text { font-size: 19px; min-height: 0; }
  #erzaehler[data-modus="buehne"] .erz-text { min-height: 0; }
  #erzaehler[data-modus="buehne"] { padding: var(--raum2); }
  #erzaehler[data-modus="buehne"] .erz-kasten { padding: var(--raum2); }

  /* Fingerflächen: 44 px. Karten sind mit 46 × 64 px ohnehin
     darüber; eine Zeile wird es, sobald man sie antippen kann. */
  .knopf { min-height: 44px; }
  .wahl-knopf { min-height: 44px; min-width: 44px; }
  .tipp { min-height: 44px; align-items: center; }
  .sb-zeile.ziel { min-height: 44px; align-items: center; }
  .modal-zu { width: 44px; height: 44px; }
  .modal-titel { padding-right: 44px; }

  #start-knoepfe .knopf.gross { width: 100%; }
  .modal-kasten { padding: var(--raum2); }
}


/* ============================================================
   17. Bewegung aus
   ============================================================ */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}

/* ============================================================
   18. Die eine auffällige Bewegung: Klauen und Zerstören
   ------------------------------------------------------------
   Die Oberfläche legt für den Flug kurz eine Ebene über die Seite
   und setzt darin Klone der betroffenen Karten von der alten auf
   die neue Lage. Ohne `position: fixed` würden diese Klone die
   Seite in die Länge ziehen.
   ============================================================ */

.flug-buehne {
  position: fixed;
  inset: 0;
  z-index: 60;
  pointer-events: none;
  overflow: hidden;
}

.karte.fliegt {
  position: absolute;
  margin: 0;
  transition-property: left, top, width, height, opacity, transform;
  transition-timing-function: cubic-bezier(.4, 0, .2, 1);
  transition-duration: 700ms;   /* die Oberfläche setzt die Dauer selbst */
}

/* Ein Klau und eine Zerstörung sind die lauten Momente: die Karte bekommt
   für die Dauer des Fluges den Goldrand bzw. den heißen Rand — sonst
   unterscheidet sich das Wegnehmen nicht vom bloßen Legen. */
.karte.flug-klau      { outline: 2px solid var(--gold); }
.karte.flug-zerstoert { outline: 2px solid var(--stern-heiss); }

/* Kosmische Karten erzählen selbst, was sie tun.
   Schwarzes Loch und Nova saugen ein: alles läuft zusammen und wird kleiner.
   Der Urknall schleudert auseinander. Das Weiße Loch zieht eine einzelne
   Karte heraus — langsam, damit man ihr folgen kann. */
.karte.flug-loch {
  outline: 2px solid var(--stern-heiss);
  transition-timing-function: cubic-bezier(.7, 0, .84, 0);   /* zieht am Ende an */
}
.karte.flug-knall {
  outline: 2px solid var(--stern-heiss);
  transition-timing-function: cubic-bezier(.05, .7, .3, 1);  /* schlägt sofort aus */
}
.karte.flug-zug {
  outline: 2px solid var(--signal);
  transition-timing-function: cubic-bezier(.5, 0, .2, 1);
}

/* Der Urknall blendet den Tisch kurz auf — ein einzelner heller Anschlag,
   kein Leuchten und keine Farbe, die es sonst nicht gibt. */
@keyframes knall-blitz {
  0%   { opacity: 0; }
  12%  { opacity: .5; }
  100% { opacity: 0; }
}
.knall-blitz {
  position: fixed;
  inset: 0;
  z-index: 59;
  pointer-events: none;
  background: var(--signal);
  animation: knall-blitz 620ms ease-out forwards;
}
@media (prefers-reduced-motion: reduce) { .knall-blitz { display: none; } }

@media (prefers-reduced-motion: reduce) {
  .karte.fliegt { transition: none; }
}

</style>
