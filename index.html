/** Kurzer Merktext für den Abschluss (wird neben der Formentafel gezeigt). */
function formenUebersichtText() {
  return `Ein Sternbild sind ${MIN_KARTEN} bis ${MAX_KARTEN} Karten in einer dieser Formen. `
    + 'Du findest die Übersicht jederzeit oben unter „Formen".';
}

/* ===== app\ton.js ===== */
/**
 * Der Ton.
 *
 * Alles wird zur Laufzeit erzeugt (Web Audio API) — keine Dateien, keine
 * Lizenzfragen, keine Ladezeit. Für kurze, trockene Geräusche wie Karten auf
 * Holz ist das genau das richtige Werkzeug.
 *
 * Grundgedanke: Die Lautstärke folgt der Wichtigkeit. Es gibt zwei Wege zum
 * Ausgang — einen für die leisen Bestätigungen (Karte legen, aufnehmen,
 * anwählen) und einen für die großen Ereignisse (Klauen, Nova, Drache,
 * Himmel). Beide lassen sich getrennt regeln, weil man auf dem Handy ohne
 * Kopfhörer vielleicht das Legen hören will, aber nicht bei jedem Klau
 * zusammenzucken.
 *
 *      leise ──┐
 *              ├── gesamt ── Ausgang
 *      laut  ──┘
 *
 * Browser lassen Ton erst nach einer Nutzereingabe zu. Deshalb wird der
 * Tonapparat beim ersten Klick angelegt und nicht vorher — vorher gibt es
 * ihn schlicht nicht, also auch keine Fehlermeldung.
 */

const TON_SPEICHER = 'sternenraub.ton';

/**
 * Vorgaben, bis der Spieler etwas anderes einstellt.
 * `sprechen` ist der eigene Regler für die Sprechblips der Erzählerkarte —
 * manche wollen die Spielgeräusche, aber kein Geplapper.
 */
const TON_VORGABE = { an: true, gesamt: 0.7, laut: 0.7, sprechen: 0.55 };

const TS = {
  ...TON_VORGABE,
  ctx: null,
  gesamtKnoten: null,
  leiseKnoten: null,
  lautKnoten: null,
  sprechKnoten: null,
  zuletzt: new Map(),   // Name -> Zeitpunkt, gegen übereinanderfallende Töne
};

/* ---------------- Einstellungen ---------------- */

function tonLies() {
  try {
    const roh = localStorage.getItem(TON_SPEICHER);
    if (!roh) return;
    const w = JSON.parse(roh);
    if (typeof w.an === 'boolean') TS.an = w.an;
    if (typeof w.gesamt === 'number') TS.gesamt = tonBegrenze(w.gesamt);
    if (typeof w.laut === 'number') TS.laut = tonBegrenze(w.laut);
    if (typeof w.sprechen === 'number') TS.sprechen = tonBegrenze(w.sprechen);
  } catch { /* kaputter oder gesperrter Speicher: Vorgaben behalten */ }
}

function tonSchreib() {
  try {
    localStorage.setItem(TON_SPEICHER, JSON.stringify({
      an: TS.an, gesamt: TS.gesamt, laut: TS.laut, sprechen: TS.sprechen,
    }));
  } catch { /* egal */ }
}

const tonBegrenze = (n) => Math.min(1, Math.max(0, Number(n) || 0));

const tonEinstellungen = () =>
  ({ an: TS.an, gesamt: TS.gesamt, laut: TS.laut, sprechen: TS.sprechen });

function setzeTon(an) { TS.an = !!an; tonSchreib(); tonPegelSetzen(); }
function setzeGesamt(v) { TS.gesamt = tonBegrenze(v); tonSchreib(); tonPegelSetzen(); }
function setzeLaut(v) { TS.laut = tonBegrenze(v); tonSchreib(); tonPegelSetzen(); }
function setzeSprechen(v) { TS.sprechen = tonBegrenze(v); tonSchreib(); tonPegelSetzen(); }

function tonPegelSetzen() {
  if (!TS.ctx) return;
  const jetzt = TS.ctx.currentTime;
  TS.gesamtKnoten.gain.setTargetAtTime(TS.an ? TS.gesamt : 0, jetzt, 0.01);
  TS.lautKnoten.gain.setTargetAtTime(TS.laut, jetzt, 0.01);
  TS.sprechKnoten.gain.setTargetAtTime(TS.sprechen, jetzt, 0.01);
}

/* ---------------- Der Tonapparat ---------------- */

/**
 * Legt den Tonapparat an — nur aufrufen, wenn gerade eine Nutzereingabe
 * stattgefunden hat. Vorher lässt der Browser keinen Ton zu.
 * @returns {boolean} ob Ton gerade möglich ist
 */
function tonBereit() {
  if (!TS.an) return false;
  if (TS.ctx) {
    if (TS.ctx.state === 'suspended') TS.ctx.resume().catch(() => {});
    return TS.ctx.state !== 'closed';
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  try {
    TS.ctx = new AC();
    TS.gesamtKnoten = TS.ctx.createGain();
    TS.leiseKnoten = TS.ctx.createGain();
    TS.lautKnoten = TS.ctx.createGain();
    TS.sprechKnoten = TS.ctx.createGain();
    TS.leiseKnoten.gain.value = 1;
    TS.lautKnoten.gain.value = TS.laut;
    TS.sprechKnoten.gain.value = TS.sprechen;
    TS.gesamtKnoten.gain.value = TS.an ? TS.gesamt : 0;
    TS.leiseKnoten.connect(TS.gesamtKnoten);
    TS.lautKnoten.connect(TS.gesamtKnoten);
    TS.sprechKnoten.connect(TS.gesamtKnoten);
    TS.gesamtKnoten.connect(TS.ctx.destination);
    return true;
  } catch {
    TS.ctx = null;
    return false;
  }
}

/** Beim ersten Klick oder Tastendruck den Apparat anlegen. */
function tonVorbereiten() {
  tonLies();
  const einmal = () => {
    tonBereit();
    window.removeEventListener('pointerdown', einmal);
    window.removeEventListener('keydown', einmal);
  };
  window.addEventListener('pointerdown', einmal, { once: true });
  window.addEventListener('keydown', einmal, { once: true });
}

/* ---------------- Bausteine ---------------- */

/** Kurzes Rauschen als Puffer. Länge in Sekunden. */
function tonRauschen(dauer) {
  const n = Math.max(1, Math.floor(TS.ctx.sampleRate * dauer));
  const puffer = TS.ctx.createBuffer(1, n, TS.ctx.sampleRate);
  const d = puffer.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return puffer;
}

/**
 * Ein gefilterter Rauschstoß.
 * @param {object} o { start, dauer, mitte, guete, spitze, ziel, endMitte }
 */
function tonStoss(o) {
  const q = TS.ctx.createBufferSource();
  q.buffer = tonRauschen(o.dauer + 0.02);

  const f = TS.ctx.createBiquadFilter();
  f.type = o.typ || 'bandpass';
  f.frequency.setValueAtTime(o.mitte, o.start);
  if (o.endMitte) f.frequency.exponentialRampToValueAtTime(o.endMitte, o.start + o.dauer);
  f.Q.value = o.guete == null ? 1 : o.guete;

  const g = TS.ctx.createGain();
  g.gain.setValueAtTime(0.0001, o.start);
  g.gain.exponentialRampToValueAtTime(o.spitze, o.start + (o.anstieg || 0.002));
  g.gain.exponentialRampToValueAtTime(0.0001, o.start + o.dauer);

  q.connect(f); f.connect(g); g.connect(o.ziel);
  q.start(o.start);
  q.stop(o.start + o.dauer + 0.02);
}

/** Ein Sinus- oder Sägeton mit Hüllkurve. */
function tonKlang(o) {
  const osz = TS.ctx.createOscillator();
  osz.type = o.form || 'sine';
  osz.frequency.setValueAtTime(o.von, o.start);
  if (o.nach) osz.frequency.exponentialRampToValueAtTime(o.nach, o.start + o.dauer);
  if (o.verstimmt) osz.detune.value = o.verstimmt;

  const g = TS.ctx.createGain();
  g.gain.setValueAtTime(0.0001, o.start);
  g.gain.exponentialRampToValueAtTime(o.spitze, o.start + (o.anstieg || 0.004));
  g.gain.exponentialRampToValueAtTime(0.0001, o.start + o.dauer);

  let letzter = g;
  if (o.tiefpass) {
    const f = TS.ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(o.tiefpass, o.start);
    if (o.tiefpassNach) f.frequency.exponentialRampToValueAtTime(o.tiefpassNach, o.start + o.dauer);
    g.connect(f); letzter = f;
  }
  osz.connect(g);
  letzter.connect(o.ziel);
  osz.start(o.start);
  osz.stop(o.start + o.dauer + 0.02);
}

/* ---------------- Die Töne ---------------- */

/**
 * Karte auf den Tisch legen: ein kurzes, trockenes Aufsetzen.
 * Zwei Schichten — das Rascheln des Papiers und der dumpfe Aufschlag auf Holz.
 */
function tonLegen(t) {
  // Filz, nicht Holz: kein Klacken. Das Rauschen läuft durch einen Tiefpass
  // statt durch ein Band, damit oben nichts spitz wird, und es setzt weich
  // ein (8 ms statt 2). Dazu ein sehr leiser Körper — die Luft unter der
  // Karte, nicht der Aufschlag.
  // Dies ist der Ton, den man am häufigsten hört. Im Zweifel zu leise.
  tonStoss({ start: t, dauer: 0.09, typ: 'lowpass', mitte: 1200, endMitte: 520,
             guete: 0.4, anstieg: 0.008, spitze: 0.10, ziel: TS.leiseKnoten });
  tonKlang({ start: t, dauer: 0.075, von: 140, nach: 96, form: 'sine',
             anstieg: 0.010, spitze: 0.07, tiefpass: 400, ziel: TS.leiseKnoten });
}

/**
 * Klauen: der wichtigste Ton im Spiel. Er läuft mit, während die Karten
 * sichtbar von einem Platz zum anderen wandern (rund 800 ms), und er soll
 * sich unangenehm anfühlen — deshalb zwei leicht gegeneinander verstimmte
 * Töne, die zusammen abwärts rutschen, und ein Schaben darüber.
 * Am Ende der Aufschlag beim neuen Besitzer.
 */
function tonKlauen(t) {
  // Ziehen, nicht knallen. Nichts setzt hart ein: der Gleitton braucht 40 ms
  // zum Kommen, das Schaben 120. Dreieck statt Sägezahn nimmt das Schnarren
  // heraus, die Verstimmung ist von 28 auf 18 Cent zurück — es soll reiben,
  // nicht kratzen. Knapp eine Sekunde, damit es die wandernden Karten trägt.
  tonKlang({ start: t, dauer: 0.70, von: 300, nach: 105, form: 'triangle',
             anstieg: 0.040, spitze: 0.13, tiefpass: 1200, tiefpassNach: 260,
             ziel: TS.lautKnoten });
  tonKlang({ start: t + 0.02, dauer: 0.68, von: 300, nach: 105, form: 'triangle',
             verstimmt: 18, anstieg: 0.050, spitze: 0.09, tiefpass: 1100,
             tiefpassNach: 240, ziel: TS.lautKnoten });

  // Das Schleifen der Karten über den Filz: ein Band, das langsam absinkt.
  tonStoss({ start: t, dauer: 0.78, mitte: 1800, endMitte: 500, guete: 1.0,
             anstieg: 0.120, spitze: 0.09, ziel: TS.lautKnoten });

  // Angekommen: ein weiches Absetzen ohne Anschlag.
  tonKlang({ start: t + 0.70, dauer: 0.26, von: 92, nach: 62, form: 'sine',
             anstieg: 0.060, spitze: 0.10, tiefpass: 320, ziel: TS.lautKnoten });
}

/**
 * Mischen: ein Kartenstapel, der durch die Finger läuft. Viele sehr kurze
 * Stöße dicht hintereinander, in der Mitte am dichtesten.
 */
function tonMischen(t) {
  const anzahl = 14;
  for (let i = 0; i < anzahl; i++) {
    const anteil = i / (anzahl - 1);
    // in der Mitte am dichtesten, außen lockerer
    const versatz = 0.30 * (anteil - 0.18 * Math.sin(anteil * Math.PI));
    const lautheit = 0.10 + 0.09 * Math.sin(anteil * Math.PI);
    tonStoss({
      start: t + versatz + Math.random() * 0.006,
      dauer: 0.022,
      mitte: 2200 + Math.random() * 1500,
      guete: 1.1,
      spitze: lautheit,
      ziel: TS.leiseKnoten,
    });
  }
  // Der Stapel wird am Ende aufgestoßen.
  tonStoss({ start: t + 0.34, dauer: 0.06, mitte: 1400, endMitte: 700, guete: 0.7,
          spitze: 0.22, ziel: TS.leiseKnoten });
}

/**
 * Ein Sprechblip — die Technik aus Undertale und Animal Crossing: pro
 * erscheinendem Zeichen ein sehr kurzer Ton, kein echtes Sprechen.
 *
 * Weich statt Retro: Dreieck statt Rechteck, dazu ein Tiefpass, der sofort
 * zufällt. Das klingt eher nach einem leisen Glockenklopfen als nach
 * 8-Bit-Piepsen und passt zu Papier auf der Nacht.
 *
 * Jeder Blip weicht zufällig um bis zu zehn Prozent von der Grundtonhöhe ab.
 * Ohne diese Streuung klingt eine Zeile nach wenigen Sekunden unerträglich.
 *
 * @param {number} grund Grundtonhöhe in Hz. Verschiedene Figuren bekommen
 *   verschiedene Werte — dann klingt jede anders, ohne neue Töne.
 */
function spielSprechBlip(grund = 500) {
  if (!tonBereit()) return;
  const t = TS.ctx.currentTime + 0.005;
  const hz = grund * (0.9 + Math.random() * 0.2);
  tonKlang({
    start: t, dauer: 0.075, von: hz, nach: hz * 0.86, form: 'triangle',
    anstieg: 0.006, spitze: 0.085, tiefpass: hz * 3.2, tiefpassNach: hz * 1.1,
    ziel: TS.sprechKnoten,
  });
}

const TON_TABELLE = {
  legen: tonLegen,
  klauen: tonKlauen,
  mischen: tonMischen,
};

/** Mindestpause je Ton, damit schnelle Botzüge nicht übereinanderfallen. */
const TON_PAUSE = { legen: 70, klauen: 700, mischen: 400 };

/**
 * Spielt einen Ton. Unbekannte Namen, abgeschalteter Ton und ein noch nicht
 * freigegebener Tonapparat führen still zu gar nichts — nie zu einem Fehler.
 * @param {'legen'|'klauen'|'mischen'} name
 */
function spieleTon(name) {
  const bauen = TON_TABELLE[name];
  if (!bauen || !tonBereit()) return;

  const jetzt = performance.now();
  const vorher = TS.zuletzt.get(name) || 0;
  if (jetzt - vorher < (TON_PAUSE[name] || 60)) return;
  TS.zuletzt.set(name, jetzt);

  try {
    bauen(TS.ctx.currentTime + 0.005);
  } catch { /* ein verlorener Ton ist kein Grund, das Spiel anzuhalten */ }
}

/** Für die Einstellungsseite: beim Schieben eines Reglers sofort hören. */
function probeTon(welcher) {
  TS.zuletzt.delete(welcher);
  spieleTon(welcher);
}

/* ===== app\erzaehler.js ===== */
/**
 * Sternenraub — der Erzähler.
 *
 * Eine Kartenrückseite fliegt in die Mitte und übernimmt die Führung durch das
 * Tutorial. Sie wippt leicht, während sie spricht, und der Text erscheint im
 * Sprechtempo. Ein Tippen überspringt das Tippen und zeigt sofort alles.
 *
 * Zwei Lagen:
 *   'buehne' — mittig auf abgedunkeltem Grund. Für die Erklärungen am Anfang,
 *              wo der Tisch noch nichts zu sagen hat.
 *   'dock'   — unten über der Fußleiste, ohne Verdunkelung. Für die Aufgaben:
 *              der Tisch bleibt bedienbar, die Anweisung bleibt groß.
 *
 * Enthält keine Spiellogik und keine Texte — beides kommt aus tutorial.js.
 */

/** Millisekunden je Zeichen. Etwa Vorlesetempo. */
const ERZ_TAKT = 26;
/** Nach einem Satzzeichen wird kurz Luft geholt. */
const ERZ_PAUSE = { '.': 260, '!': 260, '?': 260, ',': 110, ';': 140, '—': 160 };

/** Nur bei jedem soundsovielten Zeichen ein Blip — sonst wird es ein Sirren. */
const ERZ_BLIP_ABSTAND = 3;
/** Zeichen, die stumm bleiben: Leerraum und Satzzeichen. */
const ERZ_STUMM = /[\s.,!?;:—–„"'()-]/;

/** Ruhepegel des Scheins. Darüber pulst es beim Sprechen. */
const ERZ_SCHEIN_RUHE = 0.35;
const ERZ_SCHEIN_SPITZE = 0.75;

class Erzaehler {
  /**
   * @param {object} dom  Elemente aus start.js: erz, erzKarte, erzText, erzWeiter, erzEnde
   * @param {object} [opt]
   * @param {(hz:number)=>void} [opt.blip] wird je hörbarem Zeichen gerufen
   * @param {number} [opt.stimme] Grundtonhöhe dieser Figur in Hz. Andere
   *   Figuren bekommen andere Werte und klingen dadurch verschieden.
   */
  constructor(dom, opt = {}) {
    this.dom = dom;
    this.blip = opt.blip || null;
    this.stimme = opt.stimme || 500;
    this._timer = null;
    this._fertig = null;      // löst auf, wenn der Text zu Ende getippt ist
    this._ganzerText = '';
    this._seitBlip = 0;       // Zeichen seit dem letzten Blip
    this._weiterAuf = null;   // löst auf, wenn „Weiter" gedrückt wurde

    // Ein Tippen auf den Kasten überspringt das Tippen des Textes.
    dom.erz.addEventListener('click', (e) => {
      if (e.target.closest('.knopf')) return;
      this.sofortFertig();
    });
    dom.erzWeiter.addEventListener('click', () => {
      if (this._timer) { this.sofortFertig(); return; }
      const f = this._weiterAuf;
      this._weiterAuf = null;
      if (f) f();
    });
  }

  /* ---------------- Auftritt und Abgang ---------------- */

  /**
   * Die Rückseite fliegt von `vonEl` (dem Nachziehstapel) in die Mitte.
   * @returns {Promise<void>}
   */
  einfliegen(vonEl) {
    const d = this.dom;
    d.erz.hidden = false;
    d.erz.dataset.modus = 'buehne';
    d.erzText.textContent = '';
    d.erzWeiter.hidden = true;
    d.erzKarte.classList.remove('spricht');
    d.erzKarte.style.setProperty('--schein', String(ERZ_SCHEIN_RUHE));

    const ruhig = window.matchMedia
      && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (ruhig || !vonEl) return Promise.resolve();

    const von = vonEl.getBoundingClientRect();
    const nach = d.erzKarte.getBoundingClientRect();
    if (!von.width || !nach.width) return Promise.resolve();

    // Verschieben statt umbauen: die Karte startet dort, wo der Stapel liegt,
    // und rutscht in ihre eigentliche Lage.
    const dx = von.left - nach.left;
    const dy = von.top - nach.top;
    d.erzKarte.style.transition = 'none';
    d.erzKarte.style.transform = `translate(${dx}px, ${dy}px) scale(.7)`;
    // Bewusst setTimeout statt requestAnimationFrame: in einem Hintergrund-Tab
    // ruft der Browser rAF gar nicht auf. Das Tutorial bliebe dann für immer
    // an dieser Stelle stehen.
    return new Promise((fertig) => {
      setTimeout(() => {
        d.erzKarte.style.transition = 'transform 620ms cubic-bezier(.4,0,.2,1)';
        d.erzKarte.style.transform = 'translate(0, 0) scale(1)';
      }, 30);
      setTimeout(() => {
        d.erzKarte.style.transition = '';
        d.erzKarte.style.transform = '';
        fertig();
      }, 700);
    });
  }

  /** Lage wechseln: 'buehne' (mittig, abgedunkelt) oder 'dock' (unten). */
  lage(modus) {
    this.dom.erz.dataset.modus = modus;
  }

  verstecken() {
    this._stoppen();
    this.dom.erz.hidden = true;
    this.dom.erzKarte.classList.remove('spricht');
  }

  /* ---------------- Sprechen ---------------- */

  /**
   * Text im Sprechtempo ausgeben.
   * @param {string} text
   * @returns {Promise<void>} löst auf, wenn alles steht (auch beim Überspringen)
   */
  sag(text) {
    this._stoppen();
    const d = this.dom;
    this._ganzerText = text;
    d.erzText.textContent = '';
    d.erzKarte.classList.add('spricht');

    let i = 0;
    this._seitBlip = 0;
    return new Promise((fertig) => {
      this._fertig = fertig;
      const schreib = () => {
        if (i >= text.length) { this._abschluss(); return; }
        const z = text[i++];
        d.erzText.textContent += z;

        // Ton und Schein hängen an derselben Stelle — dann passen sie immer
        // zusammen, auch wenn der Text durch eine Pause stockt.
        if (!ERZ_STUMM.test(z) && ++this._seitBlip >= ERZ_BLIP_ABSTAND) {
          this._seitBlip = 0;
          this._puls();
          if (this.blip) this.blip(this.stimme);
        }

        this._timer = setTimeout(schreib, ERZ_TAKT + (ERZ_PAUSE[z] || 0));
      };
      this._timer = setTimeout(schreib, 160);
    });
  }

  /**
   * Ein Atemzug des Scheins: kurz heller, dann zurück auf den Ruhepegel.
   * Läuft unabhängig vom Ton — wer stumm spielt, sieht trotzdem, dass geredet
   * wird. Der Ruhepegel selbst ist das Zeichen: Text fertig, du kannst weiter.
   */
  _puls() {
    const k = this.dom.erzKarte;
    if (!k) return;
    k.style.setProperty('--schein', String(ERZ_SCHEIN_SPITZE));
    clearTimeout(this._pulsTimer);
    this._pulsTimer = setTimeout(() => {
      k.style.setProperty('--schein', String(ERZ_SCHEIN_RUHE));
    }, 90);
  }

  /** Tippen überspringen: sofort der ganze Text. */
  sofortFertig() {
    if (!this._timer) return;
    this.dom.erzText.textContent = this._ganzerText;
    this._abschluss();
  }

  _abschluss() {
    clearTimeout(this._timer);
    clearTimeout(this._pulsTimer);
    this._timer = null;
    this.dom.erzKarte.classList.remove('spricht');
    // Ruhepegel: der Schein bleibt schwach stehen und sagt damit „fertig".
    this.dom.erzKarte.style.setProperty('--schein', String(ERZ_SCHEIN_RUHE));
    const f = this._fertig;
    this._fertig = null;
    if (f) f();
  }

  _stoppen() {
    clearTimeout(this._timer);
    clearTimeout(this._pulsTimer);
    this._timer = null;
    this._fertig = null;
  }

  /* ---------------- Warten ---------------- */

  /**
   * Zeigt den Weiter-Knopf und wartet, bis er gedrückt wird.
   * @param {string} [beschriftung]
   * @returns {Promise<void>}
   */
  warteAufWeiter(beschriftung) {
    const d = this.dom;
    d.erzWeiter.textContent = beschriftung || 'Weiter';
    d.erzWeiter.hidden = false;
    return new Promise((weiter) => { this._weiterAuf = weiter; });
  }

  /** Knopf wieder weg — jetzt ist der Tisch dran. */
  knopfWeg() {
    this.dom.erzWeiter.hidden = true;
    this._weiterAuf = null;
  }
}

/* ===== app\start.js ===== */
/**
 * Sternenraub — Oberfläche, Schritt 2: ein Mensch gegen Bots.
 *
 * Diese Datei ist der Kopf: sie hält den Auswahlzustand, übersetzt Klicks in
 * Engine-Aufrufe und baut das Sichtmodell, das ansicht.js zeichnet.
 * Spielregeln stehen hier KEINE — die kommen alle aus engine/.
 */

const BOT_NAMEN = ['Rigel', 'Wega', 'Atair'];
const MAX_TIPPS = 8;

/**
 * Denkpause der Bots vor dem Zug, in Millisekunden. Über sternenraub.tempo(ms)
 * umstellbar. Danach läuft die Kartenbewegung (700 ms, beim Klauen und
 * Zerstören 1190 ms), dann bleibt das Bild BOT_NACHLAUF stehen. Zusammen
 * gut zwei Sekunden je Botzug, beim Klauen knapp drei.
 *
 * Bewusst eher zu langsam: Kürzen kann man immer noch, aber wer nicht
 * mitbekommt, was der Gegner getan hat, kann auch nicht darauf reagieren.
 */
let botTempo = 900;
const BOT_NACHLAUF = 650;

/* ================================================================= */
/*  Zustand der Oberfläche                                            */
/* ================================================================= */

const S = {
  ablauf: null,
  spielerzahl: 3,
  menschIdx: 0,
  meinName: 'Anton',
  schwer: true,                 // Bots: normal (true) oder einfach (false)
  auswahlHand: new Set(),
  auswahlMitte: new Set(),
  kosmischGespielt: false,      // Teil 1 in diesem Zug schon benutzt?
  modus: null,                  // null | {art:'SCHWARZES_LOCH'|'WEISSES_LOCH'|'NOVA', kartenId?}
  optionen: null,
  botTimer: null,
  knopfTun: [],                 // Rückrufe der Fußleisten-Knöpfe
  letzteSb: new Map(),          // sbId -> Kartenzahl, für die .frisch-Markierung
  letzteHand: new Set(),
  frisch: new Set(),
  frischeKarten: new Set(),
  punkteRundenStart: [],        // für die Rundenbilanz inklusive Trost- und Himmelspunkten
  tutorial: null,               // läuft gerade das Tutorial?
  tutorialZugFertig: null,      // Rückruf, sobald der geforderte Zug gemacht ist
  tutorialAufgedraengt: false,  // kam das Tutorial ungefragt hinter „Spielen"?
  letzterSchritt: '',           // für das Aufleuchten beim Schrittwechsel
  // (Gegnerplaetze klappen nicht mehr auf und zu - sie liegen immer offen.)
  zugMeldung: '',               // was der Bot gerade getan hat, für die Leiste
  zielSb: null,                 // angeklicktes Zielsternbild (eigenes = erweitern, fremdes = klauen)
  jokerZiel: null,              // angeklickte fremde Sternschnuppe (Karten-Id), die du holen willst
  zeigeTipps: false,            // Vorschlagsliste aufgeklappt?
};

const dom = {};

function holeDom() {
  const ids = {
    tisch: 'tisch', kopfRunde: 'kopf-runde', kopfPunkte: 'kopf-punkte',
    gegnerBereich: 'gegner-bereich', mitteKarten: 'mitte-karten', mitteHinweis: 'mitte-hinweis',
    meineSternbilder: 'meine-sternbilder', meineHand: 'meine-hand',
    tipps: 'tipps', protokoll: 'protokoll',
    leisteText: 'leiste-text', leisteKnoepfe: 'leiste-knoepfe',
    stapelDeck: 'stapel-deck', stapelAblage: 'stapel-ablage', ichPunkte: 'ich-punkte',
    ichBereich: 'ich-bereich', handBereich: 'hand-bereich', dranMarke: 'dran-marke',
    erz: 'erzaehler', erzKarte: null, erzText: 'erz-text', erzWarum: 'erz-warum',
    erzSchritt: 'erz-schritt', erzWeiter: 'erz-weiter', erzEnde: 'erz-ende',
    modal: 'modal', modalInhalt: 'modal-inhalt',
    btnRegeln: 'btn-regeln', btnNeu: 'btn-neu', btnFormen: 'btn-formen', ichName: 'ich-name',
  };
  for (const [k, id] of Object.entries(ids)) dom[k] = id ? document.getElementById(id) : null;
  dom.erzKarte = dom.erz ? dom.erz.querySelector('.erz-karte') : null;
}

/* ================================================================= */
/*  Partie starten und weiterlaufen lassen                            */
/* ================================================================= */

function neuesSpiel(spielerzahl, schwer, seed, meinName) {
  clearTimeout(S.botTimer);
  S.spielerzahl = spielerzahl;
  S.schwer = schwer !== false;
  if (meinName) S.meinName = meinName;
  const namen = [S.meinName, ...BOT_NAMEN.slice(0, spielerzahl - 1)];
  S.ablauf = new Ablauf(spielerzahl, seed >>> 0, { namen, protokoll: true, menschIdx: 0 });
  S.ablauf.start();
  merkeRundenStart();
  auswahlLeeren();
  S.kosmischGespielt = false;
  S.letzteSb = new Map();
  S.letzteHand = new Set();
  schliesseModal(dom);
  weiterLaufen();
}

const botFn = () => (S.schwer ? botNormal : botEinfach);

/* ================================================================= */
/*  Tutorial                                                          */
/* ================================================================= */

/**
 * Das Tutorial läuft auf demselben Tisch, aber ohne Zugschleife: die Karten
 * werden je Aufgabe hingelegt, und nur der eine gesuchte Zug ist erlaubt.
 * Deshalb wird in fuehreAus() `spiel.fuehreAktion` gerufen und nicht
 * `ablauf.spieleZug` — sonst würde Teil 3 nachziehen und den Aufbau aufweichen.
 *
 * Gesteuert wird es als eine durchlaufende Folge (laufeTutorial): der Erzähler
 * spricht, wartet auf „Weiter" oder auf deinen Zug, und geht dann weiter.
 * Abbrechen ist jederzeit möglich — dafür bekommt jeder Lauf eine Nummer, und
 * ein abgebrochener Lauf hört auf, sich einzumischen.
 */
let tutorialLauf = 0;

/**
 * @param {boolean} [ersterBesuch] true, wenn das Tutorial ungefragt hinter
 *   „Spielen" kam. Dann heißt der Abbruchknopf „Überspringen", und danach
 *   geht es direkt weiter zur Frage, gegen wen gespielt wird.
 */
function starteTutorial(ersterBesuch) {
  clearTimeout(S.botTimer);
  S.tutorialAufgedraengt = !!ersterBesuch;
  dom.erzEnde.textContent = ersterBesuch ? 'Überspringen' : 'Tutorial beenden';
  startschirm.verstecken();
  schliesseModal(dom);

  const a = new Ablauf(2, 20260904, { namen: [S.meinName, 'Rigel'], protokoll: true, menschIdx: 0 });
  a.start();
  a.amZug = 0;                       // im Tutorial ist immer der Mensch dran
  S.ablauf = a;
  S.tutorial = new Tutorial(a.spiel);
  S.tutorial.starteSchritt();

  dom.tisch.classList.add('tutorial');
  S.letzteSb = new Map();
  S.letzteHand = new Set();
  auswahlLeeren();
  zeichne();

  laufeTutorial(++tutorialLauf);
}

/**
 * Bricht das Tutorial ab. Wer es übersprungen hat, hat es gesehen — es kommt
 * nicht wieder von selbst. Über „Wie es geht" im Menü bleibt es erreichbar.
 */
function beendeTutorial() {
  tutorialLauf++;                    // laufende Folge stilllegen
  S.tutorial = null;
  S.tutorialZugFertig = null;
  fuehrer.verstecken();
  dom.tisch.classList.remove('tutorial');
  const aufgedraengt = S.tutorialAufgedraengt;
  S.tutorialAufgedraengt = false;
  // Als „gesehen" zählt nur der Weg über „Spielen". Wer freiwillig über
  // „Wie es geht" hineinschaut, bleibt ein neuer Spieler — sonst nimmt man
  // sich mit einem Blick ins Tutorial die Führung beim ersten echten Start.
  if (aufgedraengt) { merkeTutorialGesehen(); startschirm.zeigeWahl(); return; }
  zeigeStart();
}

/** Wartet, bis der Spieler den gesuchten Zug gemacht hat. */
function warteAufZug() {
  return new Promise((fertig) => { S.tutorialZugFertig = fertig; });
}

/**
 * Die Folge: erzählen, Aufgabe stellen, auf den Zug warten, erklären, weiter.
 * @param {number} lauf Nummer dieses Laufs; bricht ab, sobald eine neue beginnt
 */
async function laufeTutorial(lauf) {
  const t = S.tutorial;
  const gilt = () => lauf === tutorialLauf && S.tutorial === t;
  const text = (x) => (typeof x === 'function' ? x() : x);

  // Auftritt: die Rückseite fliegt vom Nachziehstapel in die Mitte.
  await fuehrer.einfliegen(dom.stapelDeck);
  if (!gilt()) return;

  while (gilt() && !t.fertig) {
    const s = t.schritt();
    // Der Tisch wird JETZT gestellt, unmittelbar bevor die Karte zu sprechen
    // anfaengt. Frueher geschah das schon beim Druck auf "Weiter" - dann
    // aenderte sich die Auslage, waehrend noch der alte Text stand.
    t.starteSchritt();

    if (s.art === 'reden' || s.art === 'ende') {
      fuehrer.lage('buehne');
      zeigeErzKopf('', s.titel || '');
      await fuehrer.sag(text(s.text));
      if (!gilt()) return;
      await fuehrer.warteAufWeiter(s.art === 'ende' ? 'Losspielen' : 'Weiter');
      if (!gilt()) return;
      if (s.art === 'ende') { tutorialFertig(); return; }
      t.weiter();
      zeichne();
      continue;
    }

    /* ---- Vorführung: die Karte zeigt etwas, statt es zu verlangen ---- */
    if (s.art === 'zeigen') {
      fuehrer.lage('dock');
      auswahlLeeren();
      zeichne();
      zeigeErzKopf('', s.titel);
      dom.erzWarum.textContent = '';
      await fuehrer.sag(text(s.text));
      if (!gilt()) return;
      await fuehrer.warteAufWeiter('Zeig es mir');
      if (!gilt()) return;
      fuehrer.knopfWeg();

      const vorher = kartenLage();
      if (s.ereignis) s.ereignis();
      zeichne();
      tonZumZug(vorher);
      await fliegeUm(vorher, { kosmisch: nimmKosmisch() });
      if (!gilt()) return;

      await fuehrer.sag(text(s.danach));
      if (!gilt()) return;
      await fuehrer.warteAufWeiter('Weiter');
      if (!gilt()) return;
      t.weiter();
      zeichne();
      continue;
    }

    /* ---- Aufgabe ---- */
    fuehrer.lage('dock');
    auswahlLeeren();
    zeichne();
    zeigeErzKopf(`Schritt ${t.aufgabeNr} von ${t.aufgabenGesamt}`, s.titel);
    fuehrer.knopfWeg();
    dom.erzWarum.textContent = '';
    await fuehrer.sag(text(s.text));
    if (!gilt()) return;
    // Das Warum steht unter der Anweisung — es erklärt, nicht es fordert.
    dom.erzWarum.textContent = text(s.warum) || '';

    await warteAufZug();
    if (!gilt()) return;

    dom.erzWarum.textContent = '';
    await fuehrer.sag(text(s.danach));
    if (!gilt()) return;
    await fuehrer.warteAufWeiter('Weiter');
    if (!gilt()) return;
    t.weiter();
    zeichne();
  }
}

function zeigeErzKopf(schritt, titel) {
  dom.erzSchritt.textContent = [schritt, titel].filter(Boolean).join(' · ');
}

/** Ende der Führung: ab hier eine ganz normale Partie. */
function tutorialFertig() {
  S.tutorial = null;
  S.tutorialZugFertig = null;
  fuehrer.verstecken();
  dom.tisch.classList.remove('tutorial');
  // Siehe beendeTutorial(): nur der Weg über „Spielen" setzt den Merker.
  if (S.tutorialAufgedraengt) merkeTutorialGesehen();
  S.tutorialAufgedraengt = false;
  zeigeModal(dom, 'Die Formen auf einen Blick', `<p>${formenUebersichtText()}</p>`,
    [{ text: 'Losspielen', klasse: 'haupt', tun: () => {
      // Nicht sofort losspielen: erst darf man wählen, gegen wen.
      schliesseModal(dom);
      startschirm.zeigeWahl();
    } }], true);
  const kasten = dom.modalInhalt.querySelector('.modal-text');
  if (kasten) kasten.appendChild(formenTafel());
}

/**
 * Welcher Ton gehört zu dem Zug, der gerade passiert ist?
 *
 * Abgelesen wird an den Karten, nicht an der Aktion: Wandert eine Karte von
 * einem Platz zu einem anderen, war es ein Klau. Kommt eine Karte neu auf
 * einen Platz, wurde gelegt. Das trifft auch die Züge der Bots, ohne dass
 * die Oberfläche deren Entscheidung kennen müsste.
 */
function tonZumZug(vorher) {
  if (!vorher || !vorher.size) return;
  const jetzt = kartenLage();
  let geklaut = false;
  let gelegt = false;
  for (const [id, neu] of jetzt) {
    const alt = vorher.get(id);
    if (!alt || alt.ort === neu.ort) continue;
    const vonSpieler = alt.ort.indexOf('sp') === 0;
    const nachSpieler = neu.ort.indexOf('sp') === 0;
    if (vonSpieler && nachSpieler) geklaut = true;
    else if (nachSpieler) gelegt = true;
  }
  if (geklaut) spieleTon('klauen');
  else if (gelegt) spieleTon('legen');
}

/** Punktestand zu Rundenbeginn festhalten — nur so stimmt die Rundenbilanz. */
function merkeRundenStart() {
  S.punkteRundenStart = S.ablauf.spiel.spieler.map((sp) => sp.punkte);
}

/** Bots ziehen lassen, bis der Mensch dran ist oder die Runde endet. */
function weiterLaufen() {
  const a = S.ablauf;
  zeichne();
  if (a.beendet) { zeigeEnde(); return; }
  if (a.phase === 'HIMMELWAHL') return;      // wartet darauf, dass du ein Ziel anklickst
  if (a.phase === 'RUNDENENDE') { zeigeRundenende(); return; }
  if (a.istMensch()) { S.kosmischGespielt = false; zeichne(); return; }

  S.botTimer = setTimeout(() => {
    if (S.ablauf !== a) return;              // inzwischen neu gestartet
    const vorher = kartenLage();
    const logVor = a.spiel.protokoll ? a.spiel.protokoll.length : 0;

    a.botZug(botFn());

    // Was der Bot getan hat, in einem Satz. Ohne diese Zeile sieht man nur,
    // dass sich etwas verändert hat — nicht was.
    const neu = a.spiel.protokoll ? a.spiel.protokoll.slice(logVor) : [];
    S.zugMeldung = logText(neu.map((p) => p.text).filter((t) => t.indexOf('—') !== 0).join(' · '));

    zeichne();
    tonZumZug(vorher);
    fliegeUm(vorher, { kosmisch: nimmKosmisch() }).then(() => {
      if (S.ablauf !== a) return;
      // Kurz stehen lassen, damit das Ergebnis ankommt, bevor der Nächste zieht.
      S.botTimer = setTimeout(() => {
        if (S.ablauf !== a) return;
        S.zugMeldung = '';
        weiterLaufen();
      }, BOT_NACHLAUF);
    });
  }, botTempo);
}

/* ================================================================= */
/*  Auswahl                                                           */
/* ================================================================= */

function auswahlLeeren() {
  S.auswahlHand.clear();
  S.auswahlMitte.clear();
  S.zielSb = null;
  S.jokerZiel = null;
  S.modus = null;
}

/** Enthält `ids` alle Elemente von `menge`? */
/**
 * Wertmuster einer Kartenliste, z. B. "ZAHL:5,ZAHL:6". Sortiert, damit die
 * Reihenfolge egal ist.
 *
 * Warum das nötig ist: generiereAktionen() fasst wertgleiche Kombinationen
 * zusammen und liefert nur EINEN Vertreter je Muster. Liegen zwei Sechsen in
 * der Mitte, kennt die Aktionsliste nur die eine. Wer die andere anklickt,
 * wählt dieselbe Kombination — nur mit anderen IDs. Über IDs zu vergleichen
 * hat solche Züge fälschlich abgelehnt.
 */
function muster(karten) {
  return karten.map((k) => k.art + ':' + (k.wert ?? '')).sort().join(',');
}

/** Muster einer ID-Liste; null, sobald eine ID nicht auflösbar ist. */
function musterVonIds(ids, nachId) {
  const karten = [];
  for (const id of ids || []) {
    const k = nachId.get(id);
    if (!k) return null;
    karten.push(k);
  }
  return muster(karten);
}


/* ================================================================= */
/*  Die Prüfung: geht dieser Zug — und wenn nicht, warum nicht?        */
/* ================================================================= */

/**
 * Der Jokertausch, sobald eine fremde Sternschnuppe angewählt ist.
 *
 * Regel: Du gibst die Karte her, die die Sternschnuppe gerade vertritt, und
 * musst mit der erbeuteten Sternschnuppe im selben Zug ein NEUES Sternbild
 * bauen — aus deinen übrigen gewählten Handkarten und höchstens zwei
 * Mittelkarten. Ein bestehendes eigenes Sternbild damit zu ergänzen ist nicht
 * erlaubt.
 *
 * Auch hier wählst du: welche Karte du hergibst, ergibt sich aus dem Wert,
 * und woraus das neue Sternbild besteht, bestimmst du. Früher bot die Leiste
 * drei fertige Jokerklau-Züge an — die Entscheidung lag bei der App.
 */
function pruefeJoker(z, ich) {
  // Welches Sternbild, welcher Wert?
  let sb = null;
  let besitzer = -1;
  for (const sp of z.spieler) {
    const t = sp.sternbilder.find((x) => x.karten.some((k) => k.id === S.jokerZiel));
    if (t) { sb = t; besitzer = sp.idx; break; }
  }
  if (!sb) { S.jokerZiel = null; return { grund: 'Diese Sternschnuppe liegt nicht mehr da.' };  }

  const jw = jokerKarteWerte(sb);
  const wert = jw ? jw.get(S.jokerZiel) : null;
  const opfer = z.spieler[besitzer].name;
  const kopf = `Sternschnuppe aus ${opfer}s ${typText(sb.typ)} holen: `;

  if (sb.versiegelt) return { grund: kopf + 'Das Sternbild ist versiegelt — da kommt niemand heran.' };
  if (wert == null) return { grund: kopf + 'Diese Sternschnuppe vertritt gerade keinen festen Wert.' };

  // Die hergegebene Karte: eine gewählte Handkarte mit genau diesem Wert.
  const gewaehlteHand = (ich.hand || []).filter((k) => S.auswahlHand.has(k.id));
  const tausch = gewaehlteHand.find((k) => k.art === 'ZAHL' && k.wert === wert);
  if (!tausch) {
    const habe = (ich.hand || []).some((k) => k.art === 'ZAHL' && k.wert === wert);
    return { grund: kopf + (habe
      ? `Wähle deine ${wert} aus der Hand — sie nimmt den Platz der Sternschnuppe ein.`
      : `Dafür brauchst du eine ${wert} auf der Hand. Du hast keine.`) };
  }

  // Was entsteht aus der Sternschnuppe und dem Rest der Auswahl?
  const joker = sb.karten.find((k) => k.id === S.jokerZiel);
  const rest = gewaehlteHand.filter((k) => k.id !== tausch.id);
  const ausMitte = z.mitte.filter((k) => S.auswahlMitte.has(k.id));
  if (ausMitte.length > CONFIG.zug.bauenMaxAusMitte) {
    return { grund: kopf + `Höchstens ${CONFIG.zug.bauenMaxAusMitte} Karten aus der Mitte. ` +
      `Du hast ${ausMitte.length} gewählt.` };
  }

  const neu = [joker, ...rest, ...ausMitte];
  if (neu.length < CONFIG.sternbild.minKarten) {
    return { grund: kopf + `Mit der Sternschnuppe musst du sofort ein NEUES Sternbild bauen. ` +
      `Dafür fehlen dir noch Karten — bisher wären es ${neu.length} von ${CONFIG.sternbild.minKarten}.` };
  }
  if (neu.length > CONFIG.sternbild.maxKarten) {
    return { grund: kopf + `Höchstens ${CONFIG.sternbild.maxKarten} Karten. Du kommst auf ${neu.length}.` };
  }

  const b = bewerte(neu);
  if (!b.gueltig) {
    const werte = rest.concat(ausMitte).filter((k) => k.art === 'ZAHL')
      .map((k) => k.wert).sort((x, y) => x - y);
    return { grund: kopf + `Aus der Sternschnuppe und ${werte.join('-')} wird kein gültiges ` +
      'Sternbild. Die Sternschnuppe darf jeden Wert vertreten — aber die Form muss stimmen.' };
  }

  // Die Engine hat das letzte Wort: gesucht ist eine JOKERKLAU-Aktion mit
  // demselben Wertmuster. Danach wird sie auf die angeklickten Karten
  // umgeschrieben (wertgleiche Karten werden in der Zuggenerierung zusammengefasst).
  const nachId = new Map();
  for (const k of ich.hand || []) nachId.set(k.id, k);
  for (const k of z.mitte) nachId.set(k.id, k);
  const mRest = muster(rest);
  const mMitte = muster(ausMitte);

  const treffer = (S.optionen ? S.optionen.aktionen : []).find((a) => (
    a.art === 'JOKERKLAU' && a.sbId === sb.id && a.wert === wert
    && (a.handIds || []).length === rest.length
    && (a.mitteIds || []).length === ausMitte.length
    && musterVonIds(a.handIds, nachId) === mRest
    && musterVonIds(a.mitteIds, nachId) === mMitte
  ));
  if (!treffer) {
    return { grund: kopf + 'Dieser Tausch ist nicht erlaubt. Sieh unter „Vorschläge" nach.' };
  }
  return {
    aktion: {
      ...treffer,
      tauschHandId: tausch.id,
      handIds: rest.map((k) => k.id),
      mitteIds: ausMitte.map((k) => k.id),
    },
    jokerKopf: kopf,
  };
}

/**
 * Nimmt die vom Spieler gewählten Karten und das gewählte Zielsternbild und
 * sagt, ob daraus ein legaler Zug wird.
 *
 * Die Wahrheit kommt aus der Engine: gesucht wird eine Aktion aus
 * `generiereAktionen`, deren Karten genau der Auswahl entsprechen. Die
 * Begründung dagegen wird hier gerechnet — die Engine sagt nur ja oder nein,
 * nicht warum.
 *
 * @returns {{aktion:object}|{grund:string}}
 */
function pruefeAuswahl() {
  const z = S.ablauf.zustand();
  const ich = z.spieler[S.menschIdx];
  const hand = S.auswahlHand.size;
  const mitte = S.auswahlMitte.size;
  const gesamt = hand + mitte;

  if (S.jokerZiel) return pruefeJoker(z, ich);

  if (gesamt === 0 && !S.zielSb) {
    return { grund: 'Wähle Karten aus deiner Hand — und dazu bis zu ' +
      `${CONFIG.zug.bauenMaxAusMitte} aus der Mitte.` };
  }

  // Wem gehört das Ziel?
  let ziel = null;
  let zielBesitzer = -1;
  for (const sp of z.spieler) {
    const t = sp.sternbilder.find((sb) => sb.id === S.zielSb);
    if (t) { ziel = t; zielBesitzer = sp.idx; break; }
  }
  const klauen = ziel && zielBesitzer !== S.menschIdx;
  const opfer = klauen ? z.spieler[zielBesitzer].name : '';
  // Vorspann für jede Meldung mit Ziel, damit immer klar ist, worum es geht —
  // beim Klauen wie beim Erweitern des eigenen Sternbilds.
  const klauKopf = klauen
    ? `${opfer}s ${typText(ziel.typ)} (${ziel.punkte} P., ${ziel.karten.length} Karten) klauen: `
    : ziel
      ? `Dein ${typText(ziel.typ)} (${ziel.punkte} P.) erweitern: `
      : '';

  /* --- die harten Grenzen zuerst, sie sind am leichtesten zu erklären --- */

  if (mitte > CONFIG.zug.bauenMaxAusMitte) {
    return { grund: `Höchstens ${CONFIG.zug.bauenMaxAusMitte} Karten aus der Mitte. ` +
      `Du hast ${mitte} gewählt.` };
  }

  if (klauen && hand < CONFIG.zug.klauenMinHandkarten) {
    return { grund: klauKopf + `Du musst mindestens ${CONFIG.zug.klauenMinHandkarten} eigene ` +
      `Handkarten dazulegen — gewählt hast du ${hand}.` };
  }
  if (!klauen && hand < CONFIG.zug.bauenMinHandkarten) {
    return { grund: klauKopf + `Mindestens ${CONFIG.zug.bauenMinHandkarten} eigene Handkarte ` +
      'muss dabei sein. Wähle sie unten in deiner Hand.' };
  }

  if (ziel && ziel.sicher) {
    return { grund: ziel.versiegelt
      ? 'Dieses Sternbild ist versiegelt — da kommt niemand mehr heran.'
      : 'Dieses Sternbild ist fertig und kann nicht mehr wachsen.' };
  }

  /* --- was käme heraus? --- */

  const karten = [];
  if (ziel) karten.push(...ziel.karten);
  for (const k of ich.hand || []) if (S.auswahlHand.has(k.id)) karten.push(k);
  for (const k of z.mitte) if (S.auswahlMitte.has(k.id)) karten.push(k);

  if (karten.length < CONFIG.sternbild.minKarten) {
    return { grund: klauKopf + `Ein Sternbild braucht mindestens ${CONFIG.sternbild.minKarten} Karten. ` +
      `Du kommst auf ${karten.length}.` };
  }
  if (karten.length > CONFIG.sternbild.maxKarten) {
    return { grund: klauKopf + `Höchstens ${CONFIG.sternbild.maxKarten} Karten. ` +
      `Du kommst auf ${karten.length}.` };
  }

  const b = bewerte(karten);
  if (!b.gueltig) {
    const werte = karten.filter((k) => k.art === 'ZAHL').map((k) => k.wert).sort((x, y) => x - y);
    return { grund: klauKopf + `Aus ${werte.join('-')} wird keine gültige Form. ` +
      'Pfeil braucht Werte in Folge, Wagen gleiche Abstände, dazu Krone, Kreuz, ' +
      'Zwilling und Doppelstier — siehe „Formen" oben.' };
  }

  if (klauen && b.punkte <= ziel.punkte) {
    return { grund: klauKopf + `Es muss mehr werden. ${typText(b.typ)} ${werteText(b.werte)} ` +
      `bringt ${b.punkte} Punkte — das Sternbild hat aber schon ${ziel.punkte}.` };
  }

  /* --- die Engine hat das letzte Wort --- */

  const nachId = new Map();
  for (const k of ich.hand || []) nachId.set(k.id, k);
  for (const k of z.mitte) nachId.set(k.id, k);

  const mHand = muster((ich.hand || []).filter((k) => S.auswahlHand.has(k.id)));
  const mMitte = muster(z.mitte.filter((k) => S.auswahlMitte.has(k.id)));

  const treffer = (S.optionen ? S.optionen.aktionen : []).find((a) => {
    if (a.art !== 'BAUEN' && a.art !== 'KLAUEN') return false;
    if ((a.sbId || null) !== (S.zielSb || null)) return false;
    if ((a.handIds || []).length !== S.auswahlHand.size) return false;
    if ((a.mitteIds || []).length !== S.auswahlMitte.size) return false;
    return musterVonIds(a.handIds, nachId) === mHand
        && musterVonIds(a.mitteIds, nachId) === mMitte;
  });
  // Die gefundene Aktion wird auf die tatsächlich angeklickten Karten
  // umgeschrieben — sonst legt die Engine andere, wertgleiche Karten ab.
  if (treffer) {
    return { aktion: { ...treffer, handIds: [...S.auswahlHand], mitteIds: [...S.auswahlMitte] } };
  }

  // Im Tutorial ist die Aktionsliste absichtlich auf den einen gesuchten Zug
  // beschnitten — dann liegt es nicht an den Regeln, sondern an der Aufgabe.
  if (S.tutorial) {
    return { grund: 'Das wäre im Spiel erlaubt — hier geht es gerade nur um den einen Zug, '
      + 'den die Karte oben nennt.' };
  }

  // Hierher kommt man nur, wenn die Engine etwas verbietet, das oben nicht
  // abgefangen wurde. Lieber ehrlich sagen als etwas erfinden.
  return { grund: 'Dieser Zug ist nicht erlaubt. Sieh unter „Vorschläge" nach, was gerade geht.' };
}

/* ================================================================= */
/*  Sichtmodell                                                       */
/* ================================================================= */

function jokerKarteWerte(sb) {
  const joker = sb.karten.filter((k) => k.art === 'STERNSCHNUPPE');
  if (!joker.length) return null;
  const werte = jokerWerte(sb.karten);
  const m = new Map();
  joker.forEach((k, i) => { if (werte[i] != null) m.set(k.id, werte[i]); });
  return m;
}

function baueSicht() {
  const a = S.ablauf;
  const z = a.zustand();
  const dranMensch = a.istMensch();
  S.optionen = dranMensch ? a.optionen() : null;

  // Im Tutorial bleibt von allen legalen Zügen nur der eine übrig, um den es geht.
  if (S.tutorial && S.optionen) {
    S.optionen = {
      aktionen: S.optionen.aktionen.filter((x) => S.tutorial.erlaubt(x)),
      kosmische: S.optionen.kosmische.filter((x) => S.tutorial.erlaubtKosmisch(x)),
      nova: [],
      jokerTausch: [],
    };
  }

  const s = {
    z,
    menschIdx: S.menschIdx,
    rundenGesamt: CONFIG.spiel.runden,
    auswahlHand: S.auswahlHand,
    auswahlMitte: S.auswahlMitte,
    spielbareHand: new Set(),
    spielbareMitte: new Set(),
    zieleSb: new Map(),
    gefahrSb: new Set(),
    jokerWerte: new Map(),
    frisch: S.frisch,
    frischeKarten: S.frischeKarten,
    tipps: [],
    knoepfe: [],
    hinweis: '',
    mitteHinweis: '',
    novaMoeglich: false,
    wlKarten: new Set(),
    jokerSb: new Set(),      // fremde Sternbilder, aus denen du gerade einen Joker holen kannst
    jokerZiel: S.jokerZiel,  // die angewählte fremde Sternschnuppe
    dranMensch,
  };

  for (const sp of z.spieler) {
    for (const sb of sp.sternbilder) {
      const jw = jokerKarteWerte(sb);
      if (jw) s.jokerWerte.set(sb.id, jw);
    }
  }

  // eigene Sternbilder, die ein Gegner noch übernehmen könnte
  const ich = z.spieler[S.menschIdx];
  for (const sb of ich.sternbilder) {
    if (sb.sicher) continue;
    if (CONFIG.sternbild.maxKarten - sb.karten.length >= CONFIG.zug.klauenMinHandkarten) {
      s.gefahrSb.add(sb.id);
    }
  }

  /* ---- Der Himmel ist vollendet: das Schwarze Loch ausrichten ---- */
  if (a.phase === 'HIMMELWAHL') {
    for (const w of a.himmelZiele()) s.zieleSb.set(w.sbId, { art: 'HIMMEL', ...w });
    s.hinweis = 'Der Himmel schenkt dir ein Schwarzes Loch — welches gegnerische Sternbild soll zerfallen?';
    s.knoepfe = [{ text: 'Darauf verzichten' }];
    S.knopfTun = [() => { S.ablauf.waehleHimmelZiel(null); nachZug(); }];
    return s;
  }

  if (!dranMensch) {
    // Steht eine frische Meldung an, hat sie Vorrang vor „… überlegt".
    s.hinweis = S.zugMeldung || (a.phase === 'ZUG' ? `${z.spieler[z.amZug].name} überlegt …` : '');
    s.hinweisIstZug = !!S.zugMeldung;
    s.mitteHinweis = '';
    S.knopfTun = [];
    return s;
  }

  /* ---- Modus: Ziel für eine kosmische Karte oder die Nova wählen ---- */
  if (S.modus) {
    baueZielModus(s);
    return s;
  }

  /* ---- freie Auswahl ----
     Nichts wird gesperrt. Jede Handkarte und jede nehmbare Mittelkarte bleibt
     anklickbar, egal was schon gewählt ist. Ob die Kombination geht, sagt erst
     die Prüfung beim Bestätigen — und wenn nicht, sagt sie warum.
     Vorher hat die Oberfläche alles deaktiviert, was zu keinem legalen Zug
     führte. Dann kommt man nicht weiter und erfährt auch nicht, warum. */
  for (const k of ich.hand || []) s.spielbareHand.add(k.id);
  for (const k of z.mitte) {
    // Kosmische Karten außer der Sternschnuppe darf man nicht aus der Mitte nehmen.
    if (k.art === 'ZAHL' || k.art === 'STERNSCHNUPPE') s.spielbareMitte.add(k.id);
  }

  // Das gewählte Zielsternbild bekommt die Marke .ziel — eigenes wie fremdes.
  if (S.zielSb) s.zieleSb.set(S.zielSb, { art: 'ZIEL' });

  // Passt eine Handkarte zu einem ausliegenden Joker? Dann das Sternbild markieren,
  // damit man die Gelegenheit nicht suchen muss.
  for (const akt of S.optionen.aktionen) {
    if (akt.art === 'JOKERKLAU') s.jokerSb.add(akt.sbId);
  }

  s.novaMoeglich = !!z.nova && S.optionen.nova.length > 0;
  s.mitteHinweis = `höchstens ${CONFIG.zug.bauenMaxAusMitte} nehmen`;

  if (S.zeigeTipps) baueTipps(s);
  baueKnoepfe(s);
  return s;
}

/** Ziel-Auswahl für Schwarzes Loch, Weißes Loch oder Nova. */
function baueZielModus(s) {
  const m = S.modus;
  S.knopfTun = [];
  if (m.art === 'NOVA') {
    for (const w of S.optionen.nova) s.zieleSb.set(w.sbId, { art: 'NOVA', ...w });
    s.hinweis = 'Nova: welches Sternbild soll verglühen? Auch versiegelte sind erlaubt.';
  } else {
    const passend = S.optionen.kosmische.filter((k) => k.kartenId === m.kartenId);
    for (const w of passend) {
      if (m.art === 'WEISSES_LOCH') {
        s.wlKarten.add(w.karteId);
        s.zieleSb.set(w.sbId, { art: 'WL', ...w });
      } else {
        s.zieleSb.set(w.sbId, { art: 'SL', ...w });
      }
    }
    s.hinweis = m.art === 'WEISSES_LOCH'
      ? 'Weißes Loch: welche Karte willst du herausziehen?'
      : 'Schwarzes Loch: welches Sternbild soll zerfallen?';
  }
  s.knoepfe = [{ text: 'Abbrechen', klasse: '', }];
  S.knopfTun = [() => { S.modus = null; zeichne(); }];
  return s;
}

function baueTipps(s) {
  const alle = S.optionen.aktionen;
  const bewertet = alle.map((a) => ({ a, w: tippWert(a) }));
  bewertet.sort((x, y) => y.w - x.w);
  const gesehen = new Set();
  for (const { a } of bewertet) {
    const t = aktionText(a, s.z);
    if (gesehen.has(t)) continue;
    gesehen.add(t);
    s.tipps.push(a);
    if (s.tipps.length >= MAX_TIPPS) break;
  }
}

function tippWert(a) {
  switch (a.art) {
    case 'KLAUEN': return a.punkteNachher - a.entschaedigung + 0.5;
    case 'BAUEN': return a.gewinn;
    case 'DRACHE': return 99;
    case 'VERSIEGELN': return a.punkteNachher * 0.2;
    case 'JOKERKLAU': return 0.4;
    case 'ABWERFEN': return -1;
    default: return 0;
  }
}

/**
 * Was passiert, wenn ich jetzt bestätige? Beim Klauen steht hier ausdrücklich,
 * was es mir bringt und was der Bestohlene dafür bekommt — sonst rechnet man
 * mitten im Zug nach.
 */
function erfolgText(a, z) {
  const form = `${typText(a.typ)} ${werteText(a.werte)}`;
  if (a.art === 'JOKERKLAU') {
    const opfer = z.spieler[a.opferIdx] ? z.spieler[a.opferIdx].name : 'Der Gegner';
    return `Das geht: Du gibst deine ${a.wert} her, nimmst die Sternschnuppe und baust `
      + `daraus ${form} — ${a.punkteNachher} Punkte. ${opfer}s Sternbild bleibt liegen. `
      + 'Unten bestätigen.';
  }
  if (a.art === 'KLAUEN') {
    const opfer = z.spieler[a.opferIdx] ? z.spieler[a.opferIdx].name : 'Der Gegner';
    return `Klauen geht: ${form} — ${a.punkteNachher} Punkte für dich. `
      + `${opfer} verliert das Sternbild und bekommt ${a.entschaedigung} Trostpunkte `
      + `(${a.geklauteKarten} geklaute Karten). Unten bestätigen.`;
  }
  if (a.sbId) {
    return `Das geht: erweitert auf ${form} — ${a.punkteNachher} Punkte `
      + `(${plus(a.gewinn)}). Unten bestätigen.`;
  }
  return `Das geht: ${form} — ${a.punkteNachher} Punkte. Unten bestätigen.`;
}

function baueKnoepfe(s) {
  const knoepfe = [];
  const tun = [];
  const opt = S.optionen;
  const etwasGewaehlt = S.auswahlHand.size > 0 || S.auswahlMitte.size > 0;

  // Der Hauptknopf: immer da, sobald Karten gewählt sind. Er prüft und führt
  // aus — oder sagt, woran es liegt. Kein Menü fertiger Züge mehr.
  if (etwasGewaehlt || S.zielSb || S.jokerZiel) {
    const p = pruefeAuswahl();
    if (p.aktion) {
      const a = p.aktion;
      if (a.art === 'JOKERKLAU') {
        knoepfe.push({
          text: `Sternschnuppe holen: ${typText(a.typ)} ${werteText(a.werte)}  (${a.punkteNachher} P.)`,
          klasse: 'haupt gefahr',
          titel: `Du gibst deine ${a.wert} her und baust sofort ein neues Sternbild.`,
        });
      } else if (a.art === 'KLAUEN') {
        knoepfe.push({
          text: `Klauen: ${typText(a.typ)} ${werteText(a.werte)}  (${a.punkteNachher} P.)`,
          klasse: 'haupt gefahr',
          titel: `Du bekommst ${a.punkteNachher} Punkte, der Bestohlene ${a.entschaedigung} Trostpunkte.`,
        });
      } else {
        const was = a.sbId
          ? `Erweitern zu ${typText(a.typ)} ${werteText(a.werte)}`
          : `${typText(a.typ)} ${werteText(a.werte)} legen`;
        knoepfe.push({ text: `${was}  (${plus(a.gewinn)})`, klasse: 'haupt' });
      }
      tun.push(() => fuehreAus(a));
    } else {
      knoepfe.push({ text: 'Legen', klasse: 'haupt', aus: true, titel: p.grund });
      tun.push(() => {});
    }
  }

  /*
     Abwerfen ist nach den Regeln an keine Bedingung geknüpft: genau eine
     Handkarte auf den Ablagestapel, fertig. Deshalb steht der Knopf da,
     sobald genau eine Handkarte gewählt ist — auch wenn ein besserer Zug
     möglich wäre. Ob man schlecht spielt, entscheidet der Spieler.

     Die Aktion wird hier selbst gebaut und nicht in opt.aktionen gesucht:
     generiereAktionen() fasst wertgleiche Handkarten zu EINEM Abwurf
     zusammen. Wer die zweite von zwei Fünfen anwählte, bekam sonst keinen
     Knopf. Die Engine nimmt jede Handkarten-Id an.
  */
  if (S.auswahlHand.size === 1 && !S.tutorial) {
    const id = [...S.auswahlHand][0];
    const mit = S.auswahlMitte.size;
    knoepfe.push({
      text: 'Abwerfen',
      titel: mit
        ? 'Nur die Handkarte wandert auf die Ablage; die Mittelkarten bleiben liegen.'
        : 'Eine Handkarte auf den Ablagestapel. Kostet den Zug.',
    });
    tun.push(() => fuehreAus({ art: 'ABWERFEN', handIds: [id], gewinn: 0, punkteNachher: 0 }));
  }

  if (!etwasGewaehlt) {
    for (const a of opt.aktionen) {
      if (a.art === 'DRACHE') {
        knoepfe.push({ text: 'Drachen zusammensetzen', klasse: 'haupt' });
        tun.push(() => fuehreAus(a));
      }
    }
    for (const a of opt.aktionen) {
      if (a.art === 'VERSIEGELN') {
        const sb = s.z.spieler[S.menschIdx].sternbilder.find((x) => x.id === a.sbId);
        knoepfe.push({
          text: `${typText(sb ? sb.typ : null)} versiegeln (${a.punkteNachher})`,
          titel: 'Kostet einen ganzen Zug, macht das Sternbild unantastbar.',
        });
        tun.push(() => fuehreAus(a));
      }
    }
    // Fertige Jokerklau-Züge stehen hier NICHT mehr. Sie nahmen die
    // Entscheidung ab: welche Karte hergeben, was daraus bauen. Stattdessen
    // tippt man die Sternschnuppe im fremden Sternbild an und wählt selbst.
    for (const w of opt.jokerTausch) {
      knoepfe.push({ text: `Sternschnuppe gegen deine ${w.wert} tauschen`, titel: 'Freie Aktion' });
      tun.push(() => { S.ablauf.spiel.jokerTauschen(S.menschIdx, w); zeichne(); });
    }
  }

  if (etwasGewaehlt || S.zielSb || S.jokerZiel) {
    knoepfe.push({ text: 'Auswahl leeren' });
    tun.push(() => { auswahlLeeren(); zeichne(); });
  }

  // Die Vorschläge sind eine Hilfe, kein Weg. Deshalb ein Knopf, keine Liste.
  knoepfe.push({ text: S.zeigeTipps ? 'Vorschläge ausblenden' : 'Vorschläge' });
  tun.push(() => { S.zeigeTipps = !S.zeigeTipps; zeichne(); });

  if (opt.aktionen.length === 0) {
    knoepfe.push({ text: 'Zug aussetzen', klasse: 'haupt' });
    tun.push(() => { S.ablauf.spieleZug({ aktion: null }); nachZug(); });
  }

  s.knoepfe = knoepfe;
  S.knopfTun = tun;

  if (S.modus) return;
  if (!etwasGewaehlt && !S.zielSb && !S.jokerZiel) {
    s.hinweis = 'Du bist dran. Wähle Karten aus deiner Hand und aus der Mitte. '
      + 'Ein Sternbild anklicken heißt: dort anlegen oder es klauen.';
  } else {
    // Hier steht entweder, was herauskommt, oder woran es scheitert.
    const p = pruefeAuswahl();
    s.hinweis = p.aktion ? erfolgText(p.aktion, s.z) : p.grund;
    s.hinweisIstFehler = !p.aktion;
  }
}

/* ================================================================= */
/*  Zeichnen                                                          */
/* ================================================================= */

function merkeFrisch(z) {
  S.frisch = new Set();
  S.frischeKarten = new Set();
  const jetzt = new Map();
  for (const sp of z.spieler) {
    for (const sb of sp.sternbilder) {
      jetzt.set(sb.id, sb.karten.length);
      const vorher = S.letzteSb.get(sb.id);
      if (vorher === undefined || vorher !== sb.karten.length) S.frisch.add(sb.id);
    }
  }
  if (S.letzteSb.size === 0) S.frisch.clear();
  S.letzteSb = jetzt;

  const hand = z.spieler[S.menschIdx].hand || [];
  const jetztHand = new Set(hand.map((k) => k.id));
  if (S.letzteHand.size) for (const id of jetztHand) if (!S.letzteHand.has(id)) S.frischeKarten.add(id);
  S.letzteHand = jetztHand;
}

/** Die Aktionen hinter der Vorschlagsliste — Index = data-nr des Listeneintrags. */
let tippListe = [];

function zeichne() {
  const s0 = S.ablauf.zustand();
  merkeFrisch(s0);
  const s = baueSicht();
  tippListe = s.tipps;
  zeichneKopf(dom, s);
  zeichneGegner(dom, s);
  zeichneMitte(dom, s);
  zeichneIch(dom, s);
  zeichneTipps(dom, s);
  zeichneLeiste(dom, s);
  zeichneProtokoll(dom, S.ablauf.spiel.protokoll.slice(-250));
  markiereWlKarten(s);
  // (Der Erzaehler zeichnet sich selbst - siehe erzaehler.js.)
  dom.ichName.textContent = s.z.spieler[S.menschIdx].name;
  const meine = s.z.spieler[S.menschIdx].sternbilder;
  const offen = meine.filter((sb) => !sb.sicher).length;
  dom.ichPunkte.textContent = meine.length === 0
    ? ''
    : `${meine.length} Sternbild${meine.length === 1 ? '' : 'er'} · ` +
      `${meine.reduce((n, sb) => n + sb.punkte, 0)} Punkte` +
      (offen ? ` · ${offen} noch angreifbar` : ' · alle sicher');
}

/** Im Weißes-Loch-Modus werden einzelne Karten in fremden Sternbildern anklickbar. */
function markiereWlKarten(s) {
  if (!s.wlKarten.size) return;
  for (const id of s.wlKarten) {
    const e = dom.gegnerBereich.querySelector(`.karte[data-id="${id}"]`);
    if (e) { e.classList.add('spielbar'); e.dataset.wl = '1'; }
  }
}

/* ================================================================= */
/*  Klicks                                                            */
/* ================================================================= */

function karteGeklickt(ort, id, el) {
  const a = S.ablauf;
  if (!a.istMensch()) return;
  const z = a.zustand();

  if (ort === 'nova') {
    if (!S.optionen || !S.optionen.nova.length) return;
    S.modus = { art: 'NOVA' };
    zeichne();
    return;
  }

  if (S.modus && S.modus.art === 'WEISSES_LOCH' && el && el.dataset.wl === '1') {
    const wahl = S.optionen.kosmische.find((k) => k.kartenId === S.modus.kartenId && k.karteId === id);
    if (wahl) spieleKosmisch(wahl);
    return;
  }
  if (S.modus) return;

  if (ort === 'joker') {
    // Eine fremde Sternschnuppe anwählen. Sie schließt das Klauziel aus:
    // beides zusammen wäre kein Zug.
    S.jokerZiel = (S.jokerZiel === id) ? null : id;
    if (S.jokerZiel) S.zielSb = null;
    zeichne();
    return;
  }

  if (ort === 'hand') {
    const karte = (z.spieler[S.menschIdx].hand || []).find((k) => k.id === id);
    if (!karte) return;
    if (AKTIONS_KOSMISCH.indexOf(karte.art) >= 0) { kosmischGeklickt(karte); return; }
    umschalten(S.auswahlHand, id);
  } else if (ort === 'mitte') {
    // Auch zu viele Mittelkarten darf man wählen — die Prüfung sagt dann,
    // dass es zu viele sind. Stilles Ignorieren erklärt nichts.
    umschalten(S.auswahlMitte, id);
  }
  zeichne();
}

function umschalten(menge, id) {
  if (menge.has(id)) menge.delete(id); else menge.add(id);
}

function kosmischGeklickt(karte) {
  if (S.kosmischGespielt) { blinken('Nur eine kosmische Karte pro Zug.'); return; }
  const passend = S.optionen.kosmische.filter((k) => k.kartenId === karte.id);
  if (!passend.length) { blinken(`${ART_TEXT[karte.art]} hat gerade kein Ziel.`); return; }
  if (karte.art === 'MILCHSTRASSE') { spieleKosmisch(passend[0]); return; }
  if (karte.art === 'URKNALL') { fragUrknall(passend[0]); return; }
  S.modus = { art: karte.art, kartenId: karte.id };
  zeichne();
}

/** Der Urknall reißt auch die eigenen offenen Sternbilder mit — einmal nachfragen. */
function fragUrknall(wahl) {
  const z = S.ablauf.zustand();
  const zaehle = (sp) => sp.sternbilder.filter((sb) => !sb.sicher)
    .reduce((sum, sb) => sum + sb.punkte, 0);
  const meins = zaehle(z.spieler[S.menschIdx]);
  const fremd = z.spieler.reduce((sum, sp) => sum + (sp.idx === S.menschIdx ? 0 : zaehle(sp)), 0);
  zeigeModal(dom, 'Urknall zünden?',
    `<p>Alle offenen Sternbilder zerfallen — auch deine. Sichere und versiegelte bleiben.</p>
     <table class="stand">
       <tr><td>Du verlierst</td><td class="zahl gesamt">${meins} P.</td></tr>
       <tr><td>Die Gegner verlieren</td><td class="zahl gesamt">${fremd} P.</td></tr>
     </table>`,
    [
      { text: 'Zünden', klasse: 'haupt', tun: () => { schliesseModal(dom); spieleKosmisch(wahl); } },
      { text: 'Lieber nicht', tun: () => schliesseModal(dom) },
    ]);
}

/**
 * Welche kosmische Karte hat gerade gewirkt? Einmal lesen, dann zurücksetzen —
 * sonst zeigte der nächste Zug noch einmal dasselbe Bild.
 */
function nimmKosmisch() {
  const sp = S.ablauf && S.ablauf.spiel;
  if (!sp) return null;
  const art = sp.letzteKosmisch || null;
  sp.letzteKosmisch = null;
  return art;
}

function spieleKosmisch(wahl) {
  const vorher = kartenLage();
  S.ablauf.spiel.spieleKosmisch(S.menschIdx, wahl);
  S.kosmischGespielt = true;
  auswahlLeeren();
  zeichne();
  // Erst die Bewegung, dann das Protokoll: man soll sehen, was passiert ist.
  fliegeUm(vorher, { kosmisch: nimmKosmisch() });
}

function sternbildGeklickt(sbId) {
  const a = S.ablauf;

  if (a.phase === 'HIMMELWAHL') {
    if (a.himmelZiele().some((w) => w.sbId === sbId)) { a.waehleHimmelZiel(sbId); nachZug(); }
    return;
  }
  if (!a.istMensch()) return;

  if (S.modus) {
    if (S.modus.art === 'NOVA') {
      const wahl = S.optionen.nova.find((w) => w.sbId === sbId);
      if (wahl) {
        const vorher = kartenLage();
        a.spiel.spieleNova(S.menschIdx, wahl);
        S.modus = null;
        zeichne();
        fliegeUm(vorher, { kosmisch: nimmKosmisch() });
      }
      return;
    }
    if (S.modus.art === 'SCHWARZES_LOCH') {
      const wahl = S.optionen.kosmische.find((k) => k.kartenId === S.modus.kartenId && k.sbId === sbId);
      if (wahl) spieleKosmisch(wahl);
      return;
    }
    return;   // Weißes Loch: dort wird eine Karte geklickt, nicht das Sternbild
  }

  // Ein Klick wählt das Ziel aus, er führt nichts aus. Eigenes Sternbild
  // heißt erweitern, fremdes heißt klauen — beides dieselbe Geste.
  if (!a.istMensch()) return;
  S.zielSb = (S.zielSb === sbId) ? null : sbId;
  if (S.zielSb) S.jokerZiel = null;
  zeichne();
}

function fuehreAus(aktion) {
  if (S.tutorial) {
    // Kein spieleZug: Teil 3 würde nachziehen und den vorbereiteten Schritt aufweichen.
    const vorher = kartenLage();
    S.ablauf.spiel.fuehreAktion(S.menschIdx, aktion);
    S.tutorial.nachZug();               // geskriptete Antwort des Gegners
    auswahlLeeren();
    zeichne();
    tonZumZug(vorher);
    const weiter = S.tutorialZugFertig;
    S.tutorialZugFertig = null;
    fliegeUm(vorher, { kosmisch: nimmKosmisch() }).then(() => { if (weiter) weiter(); });
    return;
  }
  // Vorher merken, wo die Karten liegen — beim Klauen sieht man sie danach wandern.
  const vorher = kartenLage();
  S.ablauf.spieleZug({ aktion });
  auswahlLeeren();
  S.kosmischGespielt = false;
  zeichne();
  tonZumZug(vorher);
  fliegeUm(vorher, { kosmisch: nimmKosmisch() }).then(() => weiterLaufen());
}

function nachZug() {
  auswahlLeeren();
  S.kosmischGespielt = false;
  weiterLaufen();
}

/* ================================================================= */
/*  Erklärung beim Überfahren                                         */
/* ================================================================= */

/**
 * Ein Satz zu dem, worauf die Maus gerade steht — kurz genug, dass man ihn
 * im Vorbeigehen liest. Karten erklären sich über ihr Bild, Sternbilder über
 * ihren Zustand.
 */
function schweberText(el) {
  const karte = el.closest && el.closest('.karte');
  if (karte && !karte.classList.contains('rueckseite')) {
    const art = karte.dataset.art;
    if (art && art !== 'ZAHL') return `${ART_TEXT[art]} — ${ART_KURZ[art] ?? ''}`;
    const w = Number(karte.dataset.wert);
    if (w === 1) return '1 — ein Lichtpunkt mit Ring';
    if (w === 2) return '2 — ein schmales Doppelglühen';
    if (w >= 3) return `${w} — ein Stern mit ${w} Zacken`;
  }

  const sb = el.closest && el.closest('.sternbild');
  if (sb) {
    const teile = [];
    const kopf = sb.querySelector('.sb-typ');
    const punkte = sb.querySelector('.sb-punkte');
    teile.push((kopf ? kopf.textContent.trim() : '?')
      + (punkte ? ` · ${punkte.textContent} Punkte` : ''));
    if (sb.classList.contains('versiegelt')) teile.push('versiegelt — unantastbar');
    else if (sb.classList.contains('sicher')) teile.push('fertig — kann nicht mehr wachsen');
    else if (sb.dataset.typ === 'WRACK') teile.push('Wrack — 0 Punkte, leichte Beute');
    else teile.push('offen — kann geklaut werden');
    if (sb.classList.contains('joker-chance')) teile.push('hier liegt ein Joker für dich');
    return teile.join(' · ');
  }

  const stapel = el.closest && el.closest('.stapel');
  if (stapel) {
    return stapel.id === 'stapel-deck'
      ? `Nachziehstapel — ${stapel.dataset.anzahl} Karten. Ist er leer, wird die Ablage neu gemischt.`
      : `Ablage — ${stapel.dataset.anzahl} Karten, oberste offen`;
  }
  return '';
}

function verdrahteSchweber() {
  let letzter = null;
  dom.tisch.addEventListener('mousemove', (e) => {
    const ziel = e.target.closest('.karte, .sternbild, .stapel');
    if (!ziel) { if (letzter) { letzter = null; versteckeSchweber(); } return; }
    if (ziel !== letzter) letzter = ziel;
    const text = schweberText(e.target);
    if (!text) { versteckeSchweber(); return; }
    const b = ziel.getBoundingClientRect();
    zeigeSchweber(text, { x: b.left + b.width / 2, y: b.top });
  });
  dom.tisch.addEventListener('mouseleave', () => { letzter = null; versteckeSchweber(); });
}

function blinken(text) {
  dom.leisteText.textContent = text;
  dom.leisteText.classList.add('warnung');
  setTimeout(() => dom.leisteText.classList.remove('warnung'), 1200);
}

/* ================================================================= */
/*  Fenster: Rundenende, Spielende, Regeln, neues Spiel               */
/* ================================================================= */

function zeigeRundenende() {
  const a = S.ablauf;
  const z = a.zustand();
  // Rundenbilanz = alles, was seit Rundenbeginn dazugekommen ist: Sternbilder am
  // Rundenende, aber auch Trostpunkte und der Himmelsbonus, die sofort gutgeschrieben werden.
  const zeilen = z.spieler
    .map((sp) => ({ sp, d: sp.punkte - (S.punkteRundenStart[sp.idx] || 0) }))
    .sort((x, y) => y.sp.punkte - x.sp.punkte)
    .map(({ sp, d }) =>
      `<tr${sp.idx === S.menschIdx ? ' class="ich"' : ''}><td>${sp.name}</td>` +
      `<td class="zahl">${plus(d)}</td><td class="zahl gesamt">${sp.punkte}</td></tr>`)
    .join('');
  zeigeModal(dom, `Runde ${a.runde} ausgewertet`,
    `<table class="stand"><tr><th>Spieler</th><th class="zahl">Runde</th><th class="zahl">Gesamt</th></tr>${zeilen}</table>
     <p class="modal-fuss">Alle Karten kommen zurück ins Deck und werden neu gemischt.</p>`,
    [{
      text: `Runde ${a.runde + 1} beginnen`,
      klasse: 'haupt',
      tun: () => {
        schliesseModal(dom);
        // Erst mischen zeigen, dann die neue Runde — sonst sieht man nur,
        // dass plötzlich alles weg ist.
        spieleTon('mischen');
        mischeAnimation(dom).then(() => {
          a.weiter();
          merkeRundenStart();
          weiterLaufen();
        });
      },
    }],
    true);
}

function zeigeEnde() {
  const a = S.ablauf;
  const z = a.zustand();
  const erg = a.spiel.ergebnis();
  const sortiert = erg.rangfolge.map((i) => z.spieler[i]);
  const siegerNamen = erg.sieger.map((i) => z.spieler[i].name);
  const binDabei = erg.sieger.indexOf(S.menschIdx) >= 0;
  const zeilen = sortiert.map((sp, i) =>
    `<tr class="${sp.idx === S.menschIdx ? 'ich ' : ''}${erg.sieger.indexOf(sp.idx) >= 0 ? 'sieger' : ''}">` +
    `<td>${i + 1}.</td><td>${sp.name}</td>` +
    `<td class="zahl">${erg.besterEinzelwert[sp.idx]}</td>` +
    `<td class="zahl gesamt">${sp.punkte}</td></tr>`).join('');

  let titel;
  if (erg.geteilterSieg) titel = binDabei ? 'Geteilter Sieg' : `Geteilter Sieg: ${siegerNamen.join(' und ')}`;
  else titel = binDabei ? 'Du gewinnst' : `${siegerNamen[0]} gewinnt`;

  let fuss = '';
  if (erg.geteilterSieg) {
    fuss = `<p class="modal-fuss">Gleich viele Punkte <b>und</b> gleich starkes bestes Sternbild —
            ${siegerNamen.join(' und ')} teilen sich den Sieg.</p>`;
  } else if (erg.punktgleich) {
    fuss = '<p class="modal-fuss">Punktgleich — entschieden hat das wertvollste einzelne Sternbild aus Runde 8.</p>';
  }
  zeigeModal(dom, titel,
    `<table class="stand">
       <tr><th class="rang"></th><th>Spieler</th><th class="zahl">bestes Sternbild</th><th class="zahl">Gesamt</th></tr>
       ${zeilen}
     </table>${fuss}`,
    [{ text: 'Neue Partie', klasse: 'haupt', tun: () => zeigeStart() }],
    true);
}

function zeigeRegeln() {
  zeigeModal(dom, 'Sternenraub — die Regeln in Kürze', REGELN_KURZ,
    [{ text: 'Alles klar', klasse: 'haupt', tun: () => schliesseModal(dom) }]);
  bebildereRegeln();
}

/**
 * Die Regeln bekommen Bilder: jede kosmische Karte so, wie sie im Spiel
 * aussieht, und unter den Sternbildern die Formentafel mit echten Karten.
 *
 * Der Regeltext selbst bleibt reiner Text (texte.js) — er enthält nur leere
 * Platzhalter. Gezeichnet wird hier, mit demselben karteEl() wie auf dem Tisch;
 * so kann das Bild in den Regeln nie von dem auf dem Tisch abweichen.
 */
function bebildereRegeln() {
  const wurzel = dom.modalInhalt;
  if (!wurzel) return;

  for (const platz of wurzel.querySelectorAll('[data-karte]')) {
    const art = platz.dataset.karte;
    const karte = art === 'ZAHL'
      ? { id: -1, art: 'ZAHL', wert: Number(platz.dataset.wert) || 1 }
      : { id: -1, art, wert: null };
    const el = karteEl(karte, 'regel', { klickbar: false, titel: '' });
    el.classList.add('regel-karte');
    platz.replaceWith(el);
  }

  const formen = wurzel.querySelector('.regel-formen');
  if (formen) formen.appendChild(formenTafel());
}

/** Zurück zum Startschirm. */
function zeigeStart() {
  clearTimeout(S.botTimer);
  schliesseModal(dom);
  startschirm.zeigen();
}

/** Die sechs Sternbilder als Nachschlagetafel — im Spiel jederzeit erreichbar. */
function zeigeFormen() {
  zeigeModal(dom, 'Die sechs Sternbilder', '',
    [{ text: 'Zurück zum Spiel', klasse: 'haupt', tun: () => schliesseModal(dom) }]);
  const text = dom.modalInhalt.querySelector('.modal-text');
  if (text) text.appendChild(formenTafel());
}

/* ================================================================= */
/*  Verdrahtung                                                       */
/* ================================================================= */

function verdrahte() {
  dom.tisch.addEventListener('click', (e) => {
    const karte = e.target.closest('.karte');
    if (karte && karte.dataset.ort) {
      karteGeklickt(karte.dataset.ort, Number(karte.dataset.id), karte);
      return;
    }
    // Jedes Sternbild ist anklickbar - es waehlt das Ziel, nicht den Zug.
    const sb = e.target.closest('.sternbild');
    if (sb && sb.dataset.sb) { sternbildGeklickt(sb.dataset.sb); return; }

    const knopf = e.target.closest('[data-knopf]');
    if (knopf) { const f = S.knopfTun[Number(knopf.dataset.knopf)]; if (f) f(); return; }

    const tipp = e.target.closest('.tipp[data-nr]');
    if (tipp) { tippGeklickt(Number(tipp.dataset.nr)); return; }
  });

  dom.tisch.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const sb = e.target.closest && e.target.closest('.sternbild[data-sb], .sb-zeile[data-sb]');
    if (sb) { e.preventDefault(); sternbildGeklickt(sb.dataset.sb); }
  });

  dom.btnRegeln.addEventListener('click', zeigeRegeln);
  dom.btnNeu.addEventListener('click', zeigeStart);
  dom.btnFormen.addEventListener('click', zeigeFormen);
  dom.erzEnde.addEventListener('click', beendeTutorial);
  verdrahteSchweber();
  /** Pflichtfenster (Start, Rundenende, Spielende) lassen sich nicht wegklicken. */
  const darfSchliessen = () => !dom.modal.classList.contains('pflicht');

  dom.modal.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-zu') || e.target === dom.modal) {
      if (darfSchliessen()) schliesseModal(dom);
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!dom.modal.hidden) { if (darfSchliessen()) schliesseModal(dom); return; }
    if (S.modus || S.auswahlHand.size || S.auswahlMitte.size) { auswahlLeeren(); zeichne(); }
  });
}

function tippGeklickt(nr) {
  const a = tippListe[nr];
  if (a) fuehreAus(a);
}

/* ================================================================= */

holeDom();
// Die Erzählerkarte spricht mit 500 Hz. Weitere Figuren bekämen andere Werte
// und klängen dadurch verschieden, ohne dass es neue Töne braucht.
const fuehrer = new Erzaehler(dom, { blip: spielSprechBlip, stimme: 500 });
verdrahte();
tonVorbereiten();

const startschirm = baueStartschirm({
  spielen: ({ bots, stufe, name }) => {
    S.tutorial = null;
    dom.tisch.classList.remove('tutorial');
    fuehrer.verstecken();
    startschirm.verstecken();
    neuesSpiel(bots + 1, stufe === 'normal', (Math.random() * 2 ** 32) >>> 0, name);
  },
  /**
   * „Spielen" beim allerersten Besuch: erst das Tutorial, dann das Spiel.
   * Danach steht in localStorage, dass man es kennt, und der Knopf führt
   * wie gewohnt zur Frage, gegen wen gespielt wird.
   */
  spielenGedrueckt: () => {
    if (tutorialSchonGesehen()) return false;
    starteTutorial(true);
    return true;
  },
  tutorial: () => starteTutorial(false),
  freunde: () => {
    zeigeModal(dom, 'Mit Freunden',
      '<p>Daran wird gerade gebaut.</p>',
      [{ text: 'Alles klar', klasse: 'haupt', tun: () => schliesseModal(dom) }]);
  },
  regeln: () => zeigeRegeln(),
});

S.meinName = gemerkterName();
// Beim Öffnen kommt IMMER der Startschirm. Das Tutorial startete hier
// früher von selbst, wenn man es noch nie gesehen hatte — wer den Link
// zum ersten Mal öffnet, landete dann ungefragt in der Führung.
// „Wie es geht" ist dort ein Knopf unter anderen.
startschirm.zeigen();

/* Kleiner Griff für Tests in der Browser-Konsole: sternenraub.tempo(0) */
window.sternenraub = {
  tempo: (ms) => { botTempo = Math.max(0, Number(ms) || 0); },
  zustand: () => (S.ablauf ? S.ablauf.zustand() : null),
  spiel: () => (S.ablauf ? S.ablauf.spiel : null),
  ablauf: () => S.ablauf,
  neuZeichnen: () => zeichne(),
};

</script>
</body>
</html>
